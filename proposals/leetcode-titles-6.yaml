design: [设计题（Design）, 如何设计支持“按时间戳查询最近版本”的 Time Based Key-Value Store（TimeMap）？]
directed-acyclic-graph: [有向无环图（Directed Acyclic Graph）, 矩阵中求最长严格递增路径（LeetCode 329），常见套路是什么？]
doubly-linked-list: [双向链表（Doubly-Linked List）, BST 转排序双向链表：为什么用中序遍历收集节点，再统一连接，而不是边遍历边连接？]
dynamic-programming: [动态规划（Dynamic Programming）, 「买卖股票最佳时机」(只能交易一次)有哪几种等价的解法思路？]
enumeration: [枚举（Enumeration）, 数组中，一部分数字之和等于另一部分的固定倍数关系（如“special 数字之和 = outlier 之外所有数的和”），如何枚举求解？]
floyd-s-cycle-finding-algorithm: [Floyd 判圈算法（Floyd's Cycle Finding Algorithm）, 写 findDuplicate
    时用了原地交换（cycle sort）思路，为什么这个解法不满足题目要求？]
game-theory: [博弈论（Game Theory）, '1927. Sum Game：字符串对半分，含 ''?'' 的博弈论求和问题，如何在 O(n) 内判断先手（Alice）是否必胜？']
geometry: [计算几何（Geometry）, '如何统计“跨分组配对数量”这类问题(例如:按 y 分组统计点对，再统计不同组线段两两组合的梯形数)？']
graph-theory: [图论（Graph Theory）, 如何判断无向图中两个节点 source 和 destination 是否连通？]
greedy: [贪心（Greedy）, 为什么最初写的 4 分支公式（被注释掉的代码）比最终解法多了一项？]
hash-table: [哈希表（Hash Table）, 如何在 O(n) 时间、O(1) 空间内求数组中缺失的最小正整数（First Missing Positive）？]
linear-algebra: [线性代数（Linear Algebra）, 如何计算两个稀疏矩阵 mat1 (m1×n1) 和 mat2 (m2×n2) 的乘积？（暴力做法）。]
linked-list: [链表（Linked List）, 如何一次遍历找到链表的所有临界点（局部极大/极小值），并求出相邻临界点间的最小距离与首尾临界点间的最大距离？]
math: [数学（Math）, 脑筋急转弯类构造题：题目问「能否构造出某种数组」时，先想清楚极端情况——是否无论输入什么都恒成立？]
matrix: [矩阵（Matrix）, 网格图 DP + 有限次「中和」操作（如最多消除k次负数格子）该如何建模状态？]
memoization: [记忆化搜索（Memoization）, 爬楼梯问题（LeetCode 70）：为什么状态转移是 f(n) = f(n-1) + f(n-2)？如何把空间优化到
    O(1)？]
number-theory: [数论（Number Theory）, 如何用 BFS 求解“通过质数传送到达终点的最少跳数”问题（如 LC 3629）？]
persistent-data-structure: [可持久化数据结构（Persistent Data Structure）, Snapshot Array 如何做到
    set/snap O(1)、get O(log n)？]
prefix-sum: [前缀和（Prefix Sum）, 给定数组，需要对每个下标 i 同时知道「前缀最值」和「后缀最值」，如何在 O(n) 内完成？]
simulation: [模拟（Simulation）, '给定 0-based 排列 nums，要求 O(1) 额外空间构造 ans[i] = nums[nums[i]]，思路是什么？']
sorting: [排序（Sorting）, 遇到「若两元素满足某条件（如差值 ≤ limit）则可以交换」这类题目，如何设计算法？]
stack: [栈（Stack）, 如何在一次遍历中计算含 +、-、*、/ 的表达式（无括号）？]
string: [字符串（String）, Buddy Strings：如何用 O(n) 判断能否通过一次交换让 s 变成 goal？]
two-pointers: [双指针（Two Pointers）, 有序数组原地去重（LeetCode 26），双指针怎么设计？]
uncategorised: [未分类（uncategorised）, 电梯按顺序处理请求队列，求总耗时——用什么模式？]
zero-sum-game: [零和博弈（Zero-Sum Game）, Stone Game IX（2029）：如何用余数分类 + 计数判断先手是否必胜？]
