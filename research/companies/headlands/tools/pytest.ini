[pytest]
testpaths = problems
python_files = test_*.py
markers =
    part1: Part 1 of the problem
    part2: Part 2 of the problem
    part3: Part 3 of the problem
    part4: Part 4 of the problem
    part5: Part 5 of the problem
    edge: corner cases / boundary conditions
    fmt: output formatting / ordering / rounding
    perf: time & memory efficiency on large inputs
    io: stdin/stdout end-to-end run of the module as a script
addopts = -q -p no:cacheprovider -W ignore::DeprecationWarning -W ignore::pytest.PytestDeprecationWarning
