# Opt-in: `uv tool install pre-commit && pre-commit install` (or `prek install`) in this clone. CI does not read this file;
# it runs the same checks itself (.github/workflows/ci.yml). Details: docs/reference/checks.md.
# Revs are full commit SHAs; the comment is the release they are.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check            # lint only, no --fix, no formatter; rule set is [tool.ruff.lint] in pyproject.toml
        files: ^(trellis|scripts|tests)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks              # staged changes only
  - repo: local
    hooks:
      - id: learning-page-style
        name: plain_style + phone_diagrams on staged vault pages
        entry: python3 -B scripts/changed_learning_pages.py --check --files
        language: system
        files: ^vault/.*\.md$
        exclude: /clippings/
      - id: wikilinks
        name: dead wikilinks in the vault
        entry: python3 -B scripts/check_wikilinks.py
        language: system
        files: ^vault/
        pass_filenames: false
