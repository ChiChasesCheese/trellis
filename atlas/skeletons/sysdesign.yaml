    - id: b.net.tcp-reliability
      title: TCP 可靠传输、滑动窗口与拥塞控制
      summary: 序号、确认、重传保证可靠；滑动窗口做流量控制；慢启动、拥塞避免做拥塞控制。
    - id: b.net.nagle-delayed-ack
      title: Nagle 算法与延迟确认（TCP_NODELAY）
      summary: Nagle 与延迟确认叠加造成 40ms 延迟，设置 TCP_NODELAY。
    - id: b.net.tcp-udp-quic
      title: TCP 与 UDP 的区别、QUIC 是什么
      summary: TCP 与 UDP 的区别，QUIC 基于 UDP 解决队头阻塞并加快握手。
    - id: b.net.http-versions
      title: HTTP/1.1、HTTP/2、HTTP/3 的差异
      summary: HTTP/1.1 持久连接，HTTP/2 多路复用，HTTP/3 基于 QUIC 去掉 TCP 队头阻塞。
    - id: b.net.tls-handshake
      title: TLS / HTTPS 握手（RSA vs ECDHE）与证书
      summary: TLS 握手：证书校验、密钥协商（RSA vs ECDHE）、TLS 1.3 一个往返；JWT 与 HTTPS 安全点。
    - id: b.net.dns
      title: DNS 解析过程
      summary: DNS 递归与迭代解析过程、缓存与常见记录类型。
    - id: b.net.tcp-queues-attacks
      title: 半连接/全连接队列、SYN 攻击与单机连接数上限
      summary: 半连接与全连接队列、SYN 攻击防护、单机连接数上限。
    - id: b.net.tcp-keepalive-sticky
      title: TCP Keepalive、心跳、粘包与连接异常（拔网线、进程崩溃）
      summary: TCP Keepalive 与应用心跳、粘包与拆包、拔网线与进程崩溃的连接表现。
    - id: b.net.http-basics-cache
      title: HTTP 基础：GET/POST、状态码、强缓存与协商缓存
