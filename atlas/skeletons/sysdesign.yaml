  summary: 重点补强（Weak Spots）
  children:
  - id: fix.gofundme
    title: GoFundMe：逐条改进
    summary: GoFundMe 常见追问：弱回答、差在哪、应该怎么说、白板怎么改。
  - id: fix.retry-key
    title: 副作用之前先定重试键
    summary: 扣款、下单、抢票之前，先让客户端拿到一个每次重试都带上的键。
  - id: fix.apply-once
    title: 派生状态只应用一次
    summary: 总额、计数、库存这类派生值：队列会重放，用已应用表保证每个事件只加一次。
  - id: fix.bounded-read
    title: 热点页面读有界的小结构
    summary: 最近 N 条、最大 N 条、排行榜：每个字段对应一个裁剪到固定长度的结构。
  - id: fix.component-cost
    title: 加组件先说职责和新问题
    summary: 加 Redis、队列、分片之前，说清它做什么、带来什么新故障、怎么处理。
  - id: fix.scope-math
    title: 范围和估算
    summary: 面试官划掉的范围不再花时间；估算当场算对，并用它推出设计。
  - id: fix.airbnb-wallet
    title: Airbnb Wallet：逐条改进
    summary: Airbnb Wallet 模拟面试的每条反馈：弱回答、差在哪、应该怎么说、白板怎么改。
  - id: fix.bound-external
    title: 用户能触发的外部调用要有上限
    summary: 读请求不等外部服务：新鲜度窗口、每笔一次排队刷新、全局限速。
  - id: fix.asked-race
    title: 先答被问的那个竞态
    summary: 两笔不同的并发扣款靠一条条件更新；重试幂等是另一个问题，分开说。
  - id: fix.recon-sweep
    title: 回调是常态路径，扫描兜底
    summary: webhook 正常收尾；定时扫描仍在 pending 的转账，按同一事务规则落状态。
  - id: fix.notification
    title: 通知系统：逐条改进
    summary: 通知系统模拟面试的每条反馈：弱回答、差在哪、应该怎么说、白板怎么改。
  - id: fix.ack-point
    title: 先说清 200 在哪一步返回
    summary: 确认（ack）放在哪个持久化步骤之后，决定崩溃时丢什么；每种顺序各丢什么要能一句话说出。
  - id: fix.resumable-job
    title: 批量任务可续跑：游标和分块状态
    summary: 千万级扇出或回填：任务表记游标和分块状态，与该块的写入同一事务，重启从游标继续，唯一约束吸收重叠。
