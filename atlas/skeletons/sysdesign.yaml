- id: s09
  title: 语言运行时与操作系统
  summary: 语言运行时与操作系统
  order: 9
  children:
  - id: t.runtime
    title: 语言运行时与并发
    summary: 语言运行时与并发
    children:
    - id: a.runtime
      title: 语言运行时与并发
      summary: Java、Go、Python 各自的集合、并发、GC 与调度模型。
      children:
      - id: a.runtime.java-hashmap-collections
        title: Java HashMap 结构、扩容与常用集合（HashMap, ArrayList, LinkedHashMap, TreeMap）
        summary: HashMap 的数组加链表/红黑树结构、扩容与线程不安全；ArrayList、LinkedList、TreeMap 的取舍。
        core: true
      - id: a.runtime.java-chm
        title: ConcurrentHashMap 如何线程安全（JDK 7 vs 8）
        summary: ConcurrentHashMap 空桶 CAS、非空桶锁头节点、读无锁；JDK 7 分段锁到 8 的演进。
        core: true
      - id: a.runtime.java-threadpool
        title: 线程池的参数、执行流程与大小设置（ThreadPoolExecutor）
        summary: ThreadPoolExecutor 参数、任务提交流程、拒绝策略、线程数估算与动态调参。
        core: true
      - id: a.runtime.java-gc-fullgc
        title: JVM 垃圾回收：收集器选择、GC 算法与 Full GC 排查
        summary: 垃圾回收算法、收集器选择（G1/ZGC）与 Full GC 频繁的排查路径。
        core: true
      - id: a.runtime.go-gmp
        title: Go 的 GMP 调度模型（Goroutine Scheduler）
        summary: Go 的 G/M/P 调度模型、本地队列与工作窃取、系统调用时的处理。
        core: true
    - id: b.runtime
      title: 语言运行时与并发
      summary: Java、Go、Python 各自的集合、并发、GC 与调度模型。
      children:
      - id: b.runtime.java-sync-lock
        title: synchronized、ReentrantLock 与锁升级
        summary: synchronized 的 monitor 与锁升级，ReentrantLock 的可中断、公平、条件变量。
      - id: b.runtime.java-volatile-cas-jmm
        title: volatile、CAS 与 Java 内存模型（JMM, happens-before）
        summary: volatile 保证可见性与禁止重排但不保证原子，CAS 的 ABA 问题，JMM 与 happens-before。
      - id: b.runtime.java-threadlocal
        title: ThreadLocal 原理与内存泄漏
        summary: ThreadLocal 的 ThreadLocalMap 结构、弱引用 key 导致的内存泄漏与线程池中必须 remove。
      - id: b.runtime.java-aqs-juc
        title: AQS 与并发工具类（CountDownLatch, Semaphore, CompletableFuture, 并发容器）
        summary: AQS 队列同步器、CountDownLatch、Semaphore、CompletableFuture 与并发容器。
      - id: b.runtime.java-jvm-memory-classload
        title: JVM 内存区域、对象布局与类加载（双亲委派）
        summary: 运行时数据区、对象创建与布局、类加载过程与双亲委派。
      - id: b.runtime.java-virtual-threads
        title: 虚拟线程（Virtual Thread, JDK 21）与现代 Java 特性
        summary: JDK 21 虚拟线程的调度、Pinning 与适用场景，以及现代 Java 特性。
      - id: b.runtime.java-reflection-proxy-spi
        title: 反射、动态代理、SPI 与序列化
        summary: 反射、JDK 与 CGLIB 动态代理、SPI 与序列化协议的取舍。
      - id: b.runtime.java-language-basics
        title: Java 语言基础：String、equals/hashCode、异常、泛型、IO 模型
        summary: String 不可变与常量池、equals/hashCode 约定、异常体系、泛型擦除与 Java IO 模型。
      - id: b.runtime.java-money-bigdecimal
        title: 金额计算：为什么不用 double，BigDecimal 与 Long（Money Representation）
        summary: 金额不能用 double，用 BigDecimal 或以最小货币单位存 long，注意 equals 与 compareTo。
      - id: b.runtime.java-deadlock-threads
        title: 线程基础与死锁（Thread Lifecycle, Deadlock）
        summary: 线程生命周期、线程安全、死锁的四个必要条件与排查预防。
      - id: b.runtime.go-channel-map
        title: Go 的 channel 实现、select 与 map 并发安全
        summary: channel 的环形缓冲与等待队列、select、map 并发不安全与 sync.Map。
      - id: b.runtime.go-gc
        title: Go 的垃圾回收（三色标记、写屏障、GOGC）
        summary: Go GC 采用并发三色标记加写屏障，GOGC 控制触发时机。
      - id: b.runtime.go-leak-mutex
        title: goroutine 泄漏、Mutex 与常见并发题
        summary: goroutine 泄漏的典型场景、Mutex 的加锁实现与常见并发题（WaitGroup、超时等待）。
      - id: b.runtime.go-language-pitfalls
        title: Go 语言易错点：slice、new 与 make、内存逃逸、defer
        summary: slice 扩容与共享底层数组、new 与 make、内存逃逸、defer 执行顺序。
      - id: b.runtime.py-gil
        title: Python 的 GIL 是什么，怎么绕过
        summary: GIL 保证同一时刻只有一个线程执行字节码，多线程不适合 CPU 密集，需多进程或 C 扩展。
      - id: b.runtime.py-concurrency-choice
        title: asyncio、多线程、多进程怎么选
        summary: asyncio、多线程、多进程的选择：IO 密集用 asyncio，CPU 密集用多进程。
  - id: t.os
    title: 操作系统
    summary: 操作系统
