      title: 布隆过滤器原理与误判（Bloom Filter）
      summary: 布隆过滤器用位数组加多个哈希，不会漏判但会误判，不能删除。
    - id: b.cache.breakdown
      title: 缓存击穿（Hotspot Invalid）：互斥重建、逻辑过期、singleflight
      summary: 热点 key 过期瞬间大量请求击穿到数据库，用互斥重建、逻辑过期或永不过期解决。
    - id: b.cache.avalanche
      title: 缓存雪崩（Cache Avalanche）
      summary: 大量 key 同时过期或缓存整体故障，请求涌向数据库；TTL 加随机、多级缓存、限流降级。
    - id: b.cache.big-key
      title: 大 key 的危害与处理（Big Key）
      summary: 大 key 的危害（阻塞、网络、迁移）与拆分、压缩、UNLINK 渐进删除。
    - id: b.cache.multilevel
      title: 多级缓存设计与冷启动（Local + Redis, Cold Start）
      summary: 本地缓存加 Redis 加数据库的多级缓存设计、短 TTL、失效广播与冷启动。
    - id: b.cache.hit-rate
      title: 缓存命中率与容量估算
      summary: 缓存命中率与容量估算：数据库压力 = QPS × (1 − 命中率)。
    - id: b.cache.lru
      title: LRU 缓存的实现（LRU Cache, LinkedHashMap, TTL, LFU）
      summary: LRU 的数据结构（哈希表加双向链表）与 Redis 的近似 LRU / LFU；手写编码题已由 LeetCode 与 LLD 题库覆盖。
