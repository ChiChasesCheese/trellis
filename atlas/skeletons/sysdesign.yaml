      summary: 这一篇的整体框架：有哪几块、常见做法、什么时候用。
    - id: qb.sd.messenger-chat-system.pre-sd-deep-dives-redis
      title: 先修 · Redis
      summary: 聊天与即时通讯系统 用到的概念。
    - id: sd.deep-dives.redis.notes
      title: 摘要 · Redis
      summary: 按小节总结这一章的核心内容。
    - id: a.redis.single-thread-fast
      title: Redis 单线程为什么快（Single Thread, I/O Multiplexing）与为什么选 Redis
      summary: Redis 命令执行是单线程，快在内存、I/O 多路复用和简单数据结构；6.0 起网络 I/O 可多线程。
      core: true
    - id: a.redis.zset-skiplist
      title: ZSet 与跳表（Skip List）
      summary: ZSet 由跳表加哈希表实现，支持按分数范围和排名查询，是排行榜的基础。
      core: true
    - id: a.redis.rdb-aof
      title: RDB、AOF 与混合持久化（Persistence）
      summary: RDB 快照与 AOF 日志的原理、写回策略、重写与混合持久化，决定宕机时丢多少数据。
      core: true
    - id: a.redis.expire-eviction
      title: 过期键删除与内存淘汰（Expiration & Eviction，含 LRU/LFU）
      summary: 过期键的惰性加定期删除，内存满时按 maxmemory-policy 淘汰（LRU/LFU/TTL/随机）。
      core: true
    - id: a.redis.ha-overview
      title: 主从、哨兵与 Cluster 怎么保证高可用（High Availability）
      summary: 主从、哨兵、Cluster 三层高可用的职责与异步复制带来的丢写风险。
      core: true
    - id: sd.deep-dives.redis.exam
      title: 考点 · Redis
      summary: 这一章里的内容会怎么被问到。
    - id: b.redis.encodings
      title: 五种基本类型的底层编码（Object Encoding）
      summary: 五种基本类型在不同数据量下的底层编码：SDS、listpack、hashtable、intset、quicklist、skiplist。
    - id: b.redis.hashtable-rehash
      title: Redis 哈希表与渐进式 rehash（Incremental Rehash）
      summary: Redis 哈希表用链地址法解决冲突，扩容用渐进式 rehash，避免一次性搬迁卡住主线程。
    - id: b.redis.listpack
      title: 压缩列表与 listpack：连锁更新（Cascade Update）
      summary: 压缩列表（ziplist）因连锁更新被 listpack 取代；理解紧凑编码的取舍。
    - id: b.redis.replication-sync
      title: 主从复制：全量同步、增量同步与复制缓冲区
      summary: 主从复制的全量同步、增量同步与 replication buffer / repl backlog buffer。
    - id: b.redis.sentinel-failover
      title: 哨兵选主、故障转移与脑裂（Sentinel, Split Brain）
      summary: 哨兵的主观/客观下线、选主流程、故障转移，以及脑裂导致数据丢失与 min-slaves 配置。
    - id: b.redis.cluster-slots
      title: Redis Cluster 的哈希槽与重定向（Hash Slot, MOVED/ASK）
      summary: Cluster 用 16384 个哈希槽分片，客户端靠 MOVED/ASK 重定向，多 key 操作要求同槽。
    - id: b.redis.tx-lua-pipeline
      title: Redis 事务、Lua 脚本与 Pipeline
      summary: MULTI 不回滚、Lua 脚本原子执行、pipeline 只减少网络往返，三者保证的东西不同。
    - id: b.redis.keys-scan
      title: KEYS 与 SCAN：线上为什么不能用 KEYS
      summary: 线上禁用 KEYS，用 SCAN 增量遍历，SCAN 可能重复且不保证一致快照。
    - id: b.redis.bitmap-hll-geo
      title: Bitmap、HyperLogLog、Geo：海量去重、计数与签到
      summary: Bitmap 做签到与活跃，HyperLogLog 做 UV 近似去重，Geo 做附近的人。
    - id: b.redis.key-design
      title: Redis Key 与缓存结构怎么设计（Key Design）
      summary: Redis key 命名、结构选择（String vs Hash）、过期时间与大小的设计规范。
    - id: b.redis.blocking-slow
      title: Redis 变慢与阻塞的常见原因（含内存碎片）
      summary: Redis 变慢的常见原因：O(n) 命令、大 key、AOF 刷盘、fork、swap、内存碎片、网络。
    - id: b.redis.stream-delay-queue
      title: Redis 做消息队列与延时任务（List/Pub-Sub/Stream、Redisson）
      summary: Redis 做消息队列的三代方案（List、Pub/Sub、Stream）与延时任务（过期监听、Redisson）。
    - id: sd.deep-dives.redis.beyond
      title: 拓展 · Redis
      summary: 这一章没讲、但 senior 面试会追问的内容。
