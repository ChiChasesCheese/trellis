      title: 本地消息表 / Outbox 与最大努力通知
      summary: 本地消息表/outbox：业务与消息同一本地事务，异步中继发送，保证至少一次。
      core: true
    - id: a.idem.tcc
      title: TCC：Try / Confirm / Cancel，空回滚与悬挂
      summary: TCC 的 Try/Confirm/Cancel 三个接口与空回滚、悬挂、幂等三个坑。
      core: true
