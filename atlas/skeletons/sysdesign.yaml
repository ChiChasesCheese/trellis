      title: 通览 · 可靠性与服务保护
      summary: 这一篇的整体框架：有哪几块、常见做法、什么时候用。
    - id: a.protect.retry
      title: 重试的原则与为什么不能无限重试（Backoff, Budget）
      summary: 只重试幂等的临时错误，指数退避加抖动，设置总预算，防止逐层重试放大。
      core: true
    - id: a.protect.spike-10x
      title: QPS 突增 10 倍怎么应对（Traffic Spike）
      summary: QPS 突增十倍：判断真假、入口限流、保核心、削峰、扩容、复盘。
      core: true
