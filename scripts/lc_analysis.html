<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>算法分析</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root{--board:#F5F6F3;--grid:rgba(30,36,51,.045);--ink:#1E2433;--ink-2:#5B6273;--rule:#D9DDD8;--blue:#2558C9;--red:#C8323C;--amber:#D9971A;--green:#2F8A55;
 --hand:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif;--text:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
@media (prefers-color-scheme:dark){:root{--board:#1D2622;--grid:rgba(233,234,227,.04);--ink:#E9EAE3;--ink-2:#A3AAA4;--rule:#34403A;--blue:#8DB1FF;--red:#FF8A8A;--amber:#F2C35B;--green:#7FD39C}}
*{box-sizing:border-box}html{background:var(--board)}
body{margin:0;color:var(--ink);font:15px/1.65 var(--text);font-variant-numeric:tabular-nums;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.page{max-width:1180px;margin:0 auto;padding:36px 32px 64px}
.date{color:var(--ink-2);font-size:13px;margin:0 0 6px}
h1{font:400 clamp(28px,4.2vw,48px)/1.2 var(--hand);margin:0 0 14px}
h1 .topic{position:relative}
h1 .topic svg{position:absolute;left:-1%;bottom:-.2em;width:102%;height:.42em;overflow:visible}
h1 .topic path{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){h1 .topic path{animation:none;stroke-dashoffset:0}}
.why{max-width:66ch;margin:0 0 6px;font-size:17px}.standing{max-width:72ch;margin:0;color:var(--ink-2)}
h2{font:400 22px/1.3 var(--hand);margin:0 0 10px}
.tabs{display:flex;gap:4px;margin:40px 0 0;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font:400 20px/1 var(--hand);padding:10px 16px 8px;border:2px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-2px}
.tabs button[aria-selected=true]{border-color:var(--ink);background:var(--board)}
.tabs button:focus-visible{outline:3px solid var(--blue)}
.lead{color:var(--ink-2);font-size:13.5px;margin:14px 0 6px;max-width:80ch}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:36px;margin-top:10px;align-items:start}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:400;color:var(--ink-2);padding:6px 6px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td,tr.row.on td{background:color-mix(in srgb,var(--blue) 8%,transparent)}
tr.row:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
tr.basic td{color:var(--ink-2)}
.num{text-align:right;white-space:nowrap}
.bar{width:90px;height:7px;border-radius:4px;background:var(--rule);overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%}
.slip{font-weight:600}.slip.hi{color:var(--red)}.slip.lo{color:var(--green)}
#side h3{font:400 24px/1.3 var(--hand);margin:0 0 6px}#side p{margin:6px 0}
.plist{list-style:none;margin:10px 0 0;padding:0}.plist li{padding:7px 0;border-bottom:1px solid var(--rule)}
.plist b{font-weight:600}.plist small{display:block;color:var(--ink-2);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:999px;border:1px solid var(--rule);margin-left:4px;color:var(--ink-2)}
.tag.red{border-color:var(--red);color:var(--red)}
.note{color:var(--ink-2);font-size:13px;margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);max-width:90ch}
@media (max-width:900px){.page{padding:22px 16px 48px}.layout{grid-template-columns:1fr}.bar{width:56px}.hide-s{display:none}}
</style></head><body><div class="page">
<p class="date" id="date"></p><h1 id="hero"></h1><p class="why" id="why"></p><p class="standing" id="standing"></p>
<div class="tabs" role="tablist" id="tabs"></div>
<p class="lead" id="lead"></p>
<div class="layout"><div><table id="tbl"></table></div><aside id="side" aria-live="polite"></aside></div>
<p class="note" id="note"></p>
</div>
<script>
const A=/*DATA*/null;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pct=x=>Math.round(x*100)+'%';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
function mix(m){const [r,a,g]=[hex(css('--red')),hex(css('--amber')),hex(css('--green'))];const t=Math.max(0,Math.min(1,m));const [p,q,u]=t<.5?[r,a,t*2]:[a,g,(t-.5)*2];return `rgb(${p.map((v,i)=>Math.round(v+(q[i]-v)*u)).join(',')})`}
const P=A.problems;const DIMS={techniques:['思路','每道题靠哪一步想通。最能看出「会不会想」。'],patterns:['题型','题目属于哪一类。用来看覆盖面。'],pitfalls:['易错点','题解里写明的常见错误。看你会在哪里摔跤。'],idioms:['语法','解法里用到的 Python 库和写法。灰色是到处都用的基础写法，不参与排序。']};
let dim='techniques',cur=null;
document.getElementById('date').textContent=A.generated.replace(/^(\d+)-(\d+)-(\d+).*/,(m,a,b,c)=>`${a} 年 ${+b} 月 ${+c} 日`);
const lead=A.dims.techniques[0]||A.dims.patterns[0];
document.getElementById('hero').innerHTML=`算法这块，先补<span class="topic">「${esc(lead.name)}」<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M1 7 C 25 3, 55 9, 99 4"/></svg></span>`;
document.getElementById('why').textContent=`它占全部考频的 ${(lead.importance*100).toFixed(1)}%，用在 ${lead.problems.length} 道题里；你目前掌握了 ${pct(lead.mastery)}`+(lead.slip_ratio>1.15?`，而且这里的失手率是你平均水平的 ${lead.slip_ratio.toFixed(1)} 倍。`:'。');
document.getElementById('standing').textContent=`考频只看 GitHub 公司题频统计（${A.bank.companies} 家公司、${A.bank.problems} 道题；字节 / TikTok 占 0.6，全公司广度占 0.4）：全部考频的 80% 落在前 ${A.bank.n80} 道题，你的题库收了其中 ${A.bank.deck_in_top_n80} 道，总共覆盖 ${pct(A.bank.coverage)} 的考频。按考频加权，这 ${A.n} 道题你见过的覆盖 ${pct(A.covered)}，记牢的占 ${(A.held*100).toFixed(1)}%；前 ${A.pareto_n80} 道题占 80% 的考频。你在 ${A.reviews} 次复习里平均失手率 ${(A.global_slip*100).toFixed(1)}%（按「忘记」计 1、「困难」计 0.5）。`;

const tabs=document.getElementById('tabs');
tabs.innerHTML=Object.entries(DIMS).map(([k,[n]])=>`<button role="tab" data-d="${k}" aria-selected="${k===dim}">${n}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;dim=b.dataset.d;cur=null;
 tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
function slipCls(r){return r>1.15?'hi':r<.85?'lo':''}
function render(){const rows=A.dims[dim];document.getElementById('lead').textContent=DIMS[dim][1]+' 优先级 = 考频 × 没掌握的部分 × 失手加成（最多 1.5 倍）。';
 const maxI=Math.max(...rows.map(r=>r.importance));
 document.getElementById('tbl').innerHTML=`<thead><tr><th>${DIMS[dim][0]}</th><th>考频</th><th class="hide-s">见过</th><th>掌握</th><th class="num">失手</th><th class="num">优先</th></tr></thead><tbody>`+
 rows.map((r,i)=>`<tr class="row${r.basic?' basic':''}${r.id===cur?' on':''}" tabindex="0" data-i="${i}"><td>${esc(r.name)}</td>
  <td><span class="bar"><i style="width:${r.importance/maxI*100}%;background:var(--blue)"></i></span></td>
  <td class="hide-s">${pct(r.coverage)}</td>
  <td><span class="bar"><i style="width:${Math.max(2,r.mastery*100)}%;background:${mix(r.mastery)}"></i></span></td>
  <td class="num"><span class="slip ${slipCls(r.slip_ratio)}">${r.reviews?r.slip_ratio.toFixed(1)+'×':'—'}</span></td>
  <td class="num">${r.basic?'—':i+1}</td></tr>`).join('')+'</tbody>';
 if(!cur&&rows[0])show(rows[0])}
document.getElementById('tbl').addEventListener('click',e=>{const tr=e.target.closest('tr.row');if(tr)show(A.dims[dim][+tr.dataset.i])});
document.getElementById('tbl').addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest('tr.row');if(tr)show(A.dims[dim][+tr.dataset.i])}});
function show(r){cur=r.id;document.querySelectorAll('tr.row').forEach(t=>t.classList.toggle('on',A.dims[dim][+t.dataset.i].id===cur));
 const ps=r.problems.map(s=>P[s]).filter(Boolean).sort((a,b)=>(a.seen-b.seen)||(b.importance-a.importance));
 const unseen=ps.filter(p=>!p.seen).length,slipped=ps.filter(p=>p.again>0).length;
 document.getElementById('side').innerHTML=`<h3>${esc(r.name)}</h3>
 <p>${ps.length} 道题用到它，你见过 ${ps.length-unseen} 道${slipped?`，其中 ${slipped} 道按过「忘记」`:''}。${r.reviews?`这里的失手率是你平均水平的 ${r.slip_ratio.toFixed(1)} 倍。`:'还没有复习记录。'}</p>
 <ul class="plist">${ps.slice(0,40).map(p=>`<li><b>${esc(p.title)}</b>${p.again?`<span class="tag red">忘过 ${p.again} 次</span>`:''}${p.seen?'':'<span class="tag">没学过</span>'}
  <small>${p.insight?esc(p.insight)+'。':''}考频 ${(p.importance).toFixed(2)}${p.tiktok?`，字节 / TikTok 频率 ${Math.round(p.tiktok*100)}`:''}，${p.companies||0} 家公司考过${p.seen?`，掌握 ${pct(p.mastery)}`:''}</small></li>`).join('')}</ul>`}
render();
document.getElementById('note').textContent=`考频 = 0.50 × TikTok/字节公司标签频率（近半年出现 ×1.2）+ 0.15 × Amazon 频率 + 0.25 × 全公司热度 + 0.10 × 经典题单收录数，数据来自 LeetCode Premium 公司标签的两个公开整理仓库。掌握度来自 Anki 的复习间隔，失手率按「忘记」1、「困难」0.5 计，并向你的整体水平收缩，避免两三次复习就下结论。思路和易错点由题解的「一句话 / 识别 / 易错点」按 ${(A.dims.techniques||[]).length} 个思路、${(A.dims.pitfalls||[]).length} 类易错点分类，语法从题解代码解析。`;
</script></body></html>
