<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>LeetCode 学习看板</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0d12;--card:#12151c;--line:#222836;--text:#e8eaf0;--mute:#8a92a6;--dim:#5b6375;--acc:#3dd6b0;--acc2:#6aa8ff;--warn:#f5b84b;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 84px)}
@media(min-width:760px){body{max-width:1100px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)!important}}
.head{display:flex;align-items:flex-end;gap:10px;margin:4px 2px 14px}
h1{font-size:22px;margin:0;letter-spacing:.2px;flex:1}
.sub{color:var(--mute);font-size:12px}
.refresh{background:#1a1f2a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.5px}
.kpi .l{color:var(--mute);font-size:12px}
.kpi .s{color:var(--dim);font-size:12px;margin-top:2px}
.up{color:var(--acc)}.down{color:var(--bad)}
.sec{margin:18px 2px 8px;font-size:13px;color:var(--mute);letter-spacing:.6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
background:rgba(11,13,18,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:12px;padding:6px 0}
.tabs button b{display:block;font-size:17px;line-height:1.2}
.tabs button.on{color:var(--acc)}
.page{display:none}.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.heat{overflow-x:auto}.heat svg{display:block}
.legend{display:flex;gap:4px;align-items:center;color:var(--dim);font-size:11px;margin-top:6px;flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.row{display:flex;align-items:center;gap:10px}
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;font-weight:560;min-width:0}
.n{color:var(--mute);font-size:12px}
.bar{height:8px;background:#1b202b;border-radius:6px;overflow:hidden;position:relative;margin-top:7px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.pct{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px;text-align:right}
.more{display:none;margin-top:10px}
.item.open .more{display:block}
.p{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed #1d2230;font-size:13.5px}
.p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:#1b202b;color:var(--mute);margin:3px 5px 3px 0}
.chip.on{color:var(--bg);background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;margin:4px 0 10px}
.badge{font-size:11px;font-weight:650;padding:1px 7px;border-radius:6px}
.meta{color:var(--mute);font-size:12px;margin-top:3px}
.k{color:#c6cbe0;font-size:13px;margin-top:6px}
.mat{display:grid;grid-template-columns:92px repeat(12,1fr);gap:3px;font-size:11px;align-items:center}
.mat .h{color:var(--dim);text-align:center}
.mat .lab{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat .c{height:20px;border-radius:4px;background:#161b25}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#1b202b;margin-top:8px}
.stack i{display:block;height:100%}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);background:#202634;border:1px solid #2c3445;
padding:7px 12px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
.fb{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.fb:last-child{border-bottom:0}
.fb .h{color:var(--mute);font-size:12px;margin-bottom:6px}
.seg{display:flex;background:#151923;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12.5px;padding:6px;border-radius:8px}
.seg button.on{background:#232a38;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 0;border-bottom:1px solid var(--line)} td.r{text-align:right;color:var(--mute);white-space:nowrap}
.spark{width:100%;height:110px}
</style>
</head>
<body>
<div class="head"><div style="flex:1"><h1>LeetCode 学习看板</h1><div class="sub" id="gen"></div></div><button class="refresh" id="refresh">↻ 刷新</button></div>

<section class="page on" id="p-must">
  <div class="card" id="must-head" style="margin-bottom:10px"></div>
  <div class="card" style="padding:0" id="must"></div>
</section>

<section class="page" id="p-home">
  <div class="grid" id="kpis"></div>
  <div class="sec">根据你最近的作答</div>
  <div class="card" style="padding:0" id="feedback"></div>
  <div class="sec">各牌组进度</div>
  <div class="card" style="padding:0" id="decks"></div>
  <div class="sec">Anki 复习热力图（LeetCode 牌组）</div>
  <div class="card"><div class="heat" id="heat"></div><div class="legend" id="leg"></div></div>
</section>

<section class="page" id="p-area">
  <div class="sec">各领域掌握度（LeetCode Tops 01–17 的题）</div>
  <div class="sub" style="margin:0 2px 8px">绿色条 = 整体掌握度；暗色条 = 学过的比例。点一行展开题目。</div>
  <div class="card" style="padding:0" id="groups"></div>
  <div class="sec">领域 × 周 · 复习正确率（近 12 周）</div>
  <div class="card"><div class="mat" id="matrix"></div><div class="legend" id="leg-mat"></div></div>
</section>

<section class="page" id="p-lists">
  <div class="sec">题单覆盖（以 Anki 复习记录为准）</div>
  <div class="sub" style="margin:0 2px 8px">深绿 = 熟（间隔 ≥ 21 天）· 浅绿 = 学过 · 灰 = 没学过</div>
  <div class="card" style="padding:0" id="cover"></div>
  <div class="sec">高频但还没学（按全公司热度）</div>
  <div class="card" style="padding:0" id="unseen"></div>
</section>

<section class="page" id="p-weak">
  <div class="seg" id="weak-mode"><button class="on" data-m="7">近 7 天</button><button data-m="30">近 30 天</button><button data-m="all">全部</button></div>
  <div class="chips" id="weak-chips"></div>
  <div class="card" style="padding:0" id="weak"></div>
</section>

<section class="page" id="p-lc">
  <div class="sub" style="margin:0 2px 10px">LeetCode 账号的公开数据，仅作参考；上面各页的数字都来自 Anki。</div>
  <div class="grid" id="lc-kpis"></div>
  <div class="sec">LeetCode 提交热力图</div>
  <div class="card"><div class="heat" id="heat-lc"></div><div class="legend" id="leg-lc"></div></div>
  <div class="sec">周赛分数</div>
  <div class="card"><svg class="spark" id="spark" viewBox="0 0 320 110" preserveAspectRatio="none"></svg><div class="sub" id="spark-note"></div></div>
  <div class="sec">最近解出的题</div>
  <div class="card"><table id="recent"></table></div>
</section>

<nav class="tabs" id="tabs">
  <button class="on" data-p="must"><b>★</b>必读</button>
  <button data-p="home"><b>◎</b>总览</button>
  <button data-p="area"><b>▦</b>领域</button>
  <button data-p="lists"><b>☰</b>题单</button>
  <button data-p="weak"><b>⚑</b>弱项</button>
  <button data-p="lc"><b>⌁</b>LC</button>
</nav>
<div class="toast" id="toast"></div>

<script>
let D = /*__DATA__*/null;
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => Math.round(x * 100) + "%";
let toastT;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1800)}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.p));
  window.scrollTo({top:0});
});
const mcol = (m, seen) => m >= .75 ? "#3dd6b0" : m >= .5 ? "#8fd16a" : m >= .25 ? "#f5b84b" : seen ? "#ff6b6b" : "#3a4152";
const GREEN = ["#171c26","#0f3b33","#13664f","#1f9c74","#3dd6b0"], BLUE = ["#171c26","#14284a","#1d4687","#2f6fd0","#6aa8ff"];

function calendar(el, legEl, data, weeks, colors, tipf) {
  const cell = 13, gap = 3, today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today - ((weeks - 1) * 7 + today.getDay()) * 864e5);
  const val = v => Array.isArray(v) ? v[0] : (v || 0);
  const vals = Object.values(data).map(val).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 1, th = [q(.25), q(.5), q(.75)];
  const lvl = v => !v ? 0 : v <= th[0] ? 1 : v <= th[1] ? 2 : v <= th[2] ? 3 : 4;
  let svg = `<svg width="${weeks * (cell + gap) + 22}" height="${7 * (cell + gap) + 18}">`, lastM = -1;
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const day = new Date(+start + (w * 7 + d) * 864e5); if (day > today) continue;
    const key = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,"0")}-${String(day.getDate()).padStart(2,"0")}`, v = data[key];
    if (d === 0 && day.getMonth() !== lastM) { lastM = day.getMonth(); svg += `<text x="${22 + w * (cell + gap)}" y="10" fill="#5b6375" font-size="10">${day.getMonth() + 1}月</text>`; }
    svg += `<rect x="${22 + w * (cell + gap)}" y="${16 + d * (cell + gap)}" width="${cell}" height="${cell}" rx="3" fill="${colors[lvl(val(v))]}" data-t="${tipf(key, v)}"/>`;
  }
  ["", "一", "", "三", "", "五", ""].forEach((t, d) => svg += `<text x="0" y="${26 + d * (cell + gap)}" fill="#5b6375" font-size="10">${t}</text>`);
  el.innerHTML = svg + "</svg>";
  el.querySelectorAll("rect").forEach(r => r.onclick = () => toast(r.dataset.t));
  el.scrollLeft = 1e5;
  legEl.innerHTML = "少 " + colors.map(c => `<i style="background:${c}"></i>`).join("") + " 多";
}

function render() {
  const R = Object.fromEntries(D.rows.map(r => [r.s, r])), G = Object.fromEntries(D.groups.map(g => [g.id, g.t]));
  const name = s => R[s] ? (R[s].id ? "LC " + R[s].id + " " : "") + R[s].n : s;
  $("#gen").textContent = `更新于 ${D.generated} · 牌组里共 ${D.total_items} 道题`;

  // KPIs — all from Anki
  const seen = D.rows.filter(r => r.rv), mature = D.rows.filter(r => r.iv >= 21);
  const acc = w => w[0] ? 1 - w[1] / w[0] : null, a7 = acc(D.w7), a7p = acc(D.w7p);
  const delta = a7 != null && a7p != null ? Math.round((a7 - a7p) * 100) : null;
  const k = [
    ["今天", `${D.today[0]} 张`, `忘记 ${D.today[1]} · 新学 ${D.today[2]}`],
    ["连续复习", `${D.streak} 天`, "LeetCode 牌组，每天至少复习一张"],
    ["近 7 天正确率", a7 == null ? "—" : pct(a7), delta == null ? `复习 ${D.w7[0]} 张` : `复习 ${D.w7[0]} 张 · 比上周 <span class="${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "+" : ""}${delta}%</span>`],
    ["待复习", `${D.due_all} 张`, `还没学的新卡 ${D.new_all} 张`],
    ["学过的题", `${seen.length}/${D.total_items}`, `至少复习过一次`],
    ["已熟的题", `${mature.length}`, "最长间隔 ≥ 21 天"],
  ];
  $("#kpis").innerHTML = k.map(([l, v, s]) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  // feedback
  const F = D.feedback, chips = ss => ss.map(s => `<span class="chip">${esc(name(s))}</span>`).join("") || `<span class="n">无</span>`;
  $("#feedback").innerHTML = [
    [`近 7 天忘过 ${F.fails7.length} 道题`, chips(F.fails7)],
    [`14 天内忘了 2 次以上：${F.repeat.length} 道（记忆没立住，优先处理）`, chips(F.repeat)],
    ["本周正确率最低的领域", F.worst.map(w => `<span class="chip">${w.g} · 忘 ${pct(w.rate)}（${w.n} 次）</span>`).join("") || `<span class="n">本周复习还不够多</span>`],
    ["建议先手写这几道", chips(F.handwrite)],
    ["高频但还没学", chips(F.unseen_hot)],
  ].map(([h, b]) => `<div class="fb"><div class="h">${h}</div>${b}</div>`).join("");

  // decks
  $("#decks").innerHTML = D.decks.map(d => `<div class="item"><div class="row"><span class="t">${d.t}</span><span class="n">本牌组学过 ${d.seen}/${d.n} · 待复习 ${d.due} · 新卡 ${d.new}</span></div>
    <div class="bar"><i style="width:${d.any / Math.max(d.n, 1) * 100}%;background:#2a4a44"></i><i style="width:${d.seen / Math.max(d.n, 1) * 100}%;background:var(--acc)"></i></div>
    ${d.any > d.seen ? `<div class="meta">其中 ${d.any} 题已在别的牌组学过（暗色条）</div>` : ""}</div>`).join("");

  calendar($("#heat"), $("#leg"), D.byday, 26, GREEN, (k, v) => v ? `${k}：复习 ${v[0]} 张，忘记 ${v[1]}，新学 ${v[2]}` : `${k}：没复习`);

  // groups
  const by = {}; D.rows.forEach(r => { if (r.a) (by[r.a] ||= []).push(r); });
  $("#groups").innerHTML = [...D.groups].sort((a, b) => a.m - b.m).map(g => {
    const ps = (by[g.id] || []).sort((x, y) => (x.r || 9999) - (y.r || 9999));
    return `<div class="item"><div class="row" onclick="this.parentNode.classList.toggle('open')"><span class="t">${g.t}</span>
      <span class="n">${g.seen}/${g.n} 学过 · ${g.mature} 熟</span><span class="pct" style="color:${mcol(g.m, g.seen)}">${pct(g.m)}</span></div>
      <div class="bar"><i style="width:${g.seen / Math.max(g.n, 1) * 100}%;background:#2a4a44"></i><i style="width:${g.m * 100}%;background:${mcol(g.m, g.seen)}"></i></div>
      <div class="more">${ps.map(r => `<div class="p"><span class="dot" style="background:${mcol(r.m, r.rv)}"></span><span class="nm">${esc(name(r.s))}</span>
        <span class="n">${r.rv ? `${pct(r.m)} · 忘 ${r.ag}` : "未学"}${r.r ? " · #" + r.r : ""}</span></div>`).join("")}</div></div>`;
  }).join("");
  const maxv = Math.max(1, ...D.groups.flatMap(g => g.weeks.map(w => w[0])));
  let h = `<div></div>` + Array.from({length: 12}, (_, i) => `<div class="h">${i === 11 ? "本周" : i % 3 === 2 ? "-" + (11 - i) : ""}</div>`).join("");
  D.groups.forEach(g => { h += `<div class="lab">${g.t}</div>`;
    g.weeks.forEach(([n, ag], i) => { const rec = n ? 1 - ag / n : 0;
      const col = !n ? "#161b25" : rec >= .9 ? "#3dd6b0" : rec >= .75 ? "#8fd16a" : rec >= .6 ? "#f5b84b" : "#ff6b6b";
      h += `<div class="c" style="background:${col};opacity:${n ? .35 + .65 * Math.sqrt(n / maxv) : 1}" data-t="${g.t} · ${11 - i ? (11 - i) + " 周前" : "本周"}：复习 ${n}，正确率 ${n ? pct(rec) : "—"}"></div>`; }); });
  $("#matrix").innerHTML = h;
  $("#matrix").querySelectorAll(".c").forEach(c => c.onclick = () => toast(c.dataset.t));
  $("#leg-mat").innerHTML = `<i style="background:#ff6b6b"></i>&lt;60% <i style="background:#f5b84b"></i>60–75% <i style="background:#8fd16a"></i>75–90% <i style="background:#3dd6b0"></i>≥90% · 越亮复习越多`;

  // list coverage
  $("#cover").innerHTML = D.cover.map(c => { const learning = c.seen - c.mature, n = Math.max(c.n, 1);
    return `<div class="item"><div class="row"><span class="t">${c.t}</span><span class="n">${c.seen}/${c.n} 学过 · ${c.mature} 熟</span><span class="pct" style="color:${mcol(c.m, c.seen)}">${pct(c.m)}</span></div>
      <div class="stack"><i style="width:${c.mature / n * 100}%;background:#3dd6b0"></i><i style="width:${learning / n * 100}%;background:#1f6b58"></i></div></div>`; }).join("");
  $("#unseen").innerHTML = D.rows.filter(r => r.r && !r.rv).sort((a, b) => a.r - b.r).slice(0, 25).map(r =>
    `<div class="item"><div class="row"><span class="badge" style="background:#6aa8ff22;color:#6aa8ff">#${r.r}</span><span class="t">${esc(name(r.s))}</span><span class="n">${r.d}</span></div>
     <div class="meta">${G[r.a] || ""}${r.l.length ? " · " + r.l.join("、") : ""}</div></div>`).join("");

  // 必读: picked automatically from Anki history and recent LeetCode solves
  $("#must-head").innerHTML = `<div style="font-weight:600">${D.gap >= 3 ? `你已经 ${D.gap} 天没复习了，先看这几道` : "现在最该看的题"}</div>
    <div class="meta">按每道题「多久没看 × 平时忘得多不多 × 有多高频」自动挑选，不用你标记。点开看考点。</div>`;
  $("#must").innerHTML = D.must.map((m, i) => { const r = R[m.s] || {n: m.s, id: 0}, col = m.recall == null ? "#6aa8ff" : mcol(m.recall, true);
    return `<div class="item" onclick="this.classList.toggle('open')"><div class="row"><span class="badge" style="background:${col}22;color:${col}">${i + 1}</span>
      <span class="t">${esc(name(m.s))}</span>${m.recall == null ? "" : `<span class="n">记得 ${pct(m.recall)}</span>`}</div>
      <div class="chips" style="margin:6px 0 0">${m.why.map(w => `<span class="chip">${w}</span>`).join("")}</div>
      <div class="more"><div class="k">${esc(r.k || "")}</div><div class="meta">${r.a ? (D.groups.find(g => g.id === r.a) || {}).t + " · " : ""}${r.d || ""}${r.dk ? " · " + r.dk.join(" · ") : ""}</div></div></div>`; }).join("");

  drawWeak();
  drawLC();
}

let wmode = "7", warea = "";
function weakRow(r) {
  const col = mcol(r.m, r.rv), recent = wmode === "7" ? r.ag7 : wmode === "30" ? r.ag30 : r.ag;
  return `<div class="item" onclick="this.classList.toggle('open')"><div class="row"><span class="dot" style="background:${col}"></span>
    <span class="t">${r.id ? "LC " + r.id + " " : ""}${esc(r.n)}</span><span class="badge" style="background:${col}22;color:${col}">${pct(r.m)}</span></div>
    <div class="meta">${r.a ? (D.groups.find(g => g.id === r.a) || {}).t + " · " : ""}${r.d || ""} · 忘 ${recent} 次${wmode === "all" ? "" : "（全部 " + r.ag + "）"} · 复习 ${r.rv} 次 · 最长间隔 ${r.iv} 天${r.last ? " · 上次 " + r.last : ""}</div>
    <div class="more"><div class="k">${esc(r.k)}</div><div class="meta">${r.dk.join(" · ")}${r.r ? " · 全公司热度第 " + r.r + " 名" : ""}${r.l.length ? " · " + r.l.join("、") : ""}</div></div></div>`;
}
function drawWeak() {
  const key = wmode === "7" ? "ag7" : wmode === "30" ? "ag30" : "ag";
  const rs = D.rows.filter(r => r.rv && r[key] > 0 && (!warea || r.a === warea)).sort((a, b) => b[key] - a[key] || a.m - b.m);
  $("#weak").innerHTML = rs.slice(0, 60).map(weakRow).join("") || `<div class="item n">这段时间没有忘记的题。</div>`;
  $("#weak-chips").innerHTML = [["", "全部"], ...D.groups.map(g => [g.id, g.t])].map(([id, t]) => `<span class="chip${id === warea ? " on" : ""}" data-a="${id}">${t}</span>`).join("");
}
$("#weak-chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { warea = c.dataset.a; drawWeak(); } };
$("#weak-mode").onclick = e => { const b = e.target.closest("button"); if (!b) return; wmode = b.dataset.m;
  document.querySelectorAll("#weak-mode button").forEach(x => x.classList.toggle("on", x === b)); drawWeak(); };

function drawLC() {
  const L = D.lc || {};
  if (L.error || !L.solved) { $("#lc-kpis").innerHTML = `<div class="card n">LeetCode 数据暂时取不到</div>`; return; }
  const c = L.contest || {}, s = L.solved;
  $("#lc-kpis").innerHTML = [["已解", s.All, `简单 ${s.Easy} · 中等 ${s.Medium} · 困难 ${s.Hard}`],
    ["周赛分", c.rating ? Math.round(c.rating) : "—", c.rating ? `前 ${c.topPercentage}% · ${c.attendedContestsCount} 场` : ""]]
    .map(([l, v, t]) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${t}</div></div>`).join("");
  calendar($("#heat-lc"), $("#leg-lc"), L.cal, 52, BLUE, (k, v) => `${k}：提交 ${v || 0} 次`);
  const cs = L.contests || [];
  if (cs.length > 1) {
    const rs = cs.map(x => x.r), lo = Math.min(...rs) - 30, hi = Math.max(...rs) + 30;
    const pts = cs.map((x, i) => [i / (cs.length - 1) * 310 + 5, 102 - (x.r - lo) / (hi - lo) * 92]);
    $("#spark").innerHTML = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa8ff" stop-opacity=".35"/><stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/></linearGradient></defs>
      <path d="M${pts.map(p => p.join(",")).join(" L")} L315,110 L5,110 Z" fill="url(#g)"/><path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="#6aa8ff" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
      pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#6aa8ff" data-t="${cs[i].d} ${esc(cs[i].t)}：${cs[i].r}"/>`).join("");
    $("#spark").querySelectorAll("circle").forEach(x => x.onclick = () => toast(x.dataset.t));
    $("#spark-note").textContent = `最近 ${cs.length} 场：${rs[0]} → ${rs[rs.length - 1]}（点圆点看场次）`;
  }
  $("#recent").innerHTML = (L.recent || []).map(x => `<tr><td>LC ${x.id} ${esc(x.n)}</td><td class="r">${x.d.slice(5)} · ${x.diff}</td></tr>`).join("");
}

render();
$("#refresh").onclick = async () => {
  $("#refresh").textContent = "…";
  try { const r = await fetch("data.json?fresh=1", {cache: "no-store"}); if (r.ok) { D = await r.json(); render(); toast("已从 Anki 刷新"); } else toast("这个页面是静态快照"); }
  catch (e) { toast("这个页面是静态快照"); }
  $("#refresh").textContent = "↻ 刷新";
};
</script>
