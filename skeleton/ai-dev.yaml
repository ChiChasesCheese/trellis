- id: t07
  title: 团队 adoption 与 metrics
  children:
  - id: t07.metr-randomized-controlled-trial
    title: 证据 1：METR 2025 randomized controlled trial
    summary: 16 位有经验的开源开发者、246 个真实任务，允许使用 AI 时平均慢 19%，而他们自己以为快了约 20%；适用范围与局限（样本小、熟悉的大仓库、2025 年初工具）；METR 称结果已过时并发布了后续数据
    core: true
  - id: t07.dora-ai-assisted-software-development-report
    title: 证据 2：DORA 2025 AI-assisted Software Development report
    summary: 核心结论：AI 是放大器，放大组织已有的强项与弱点；七项 AI 能力模型；吞吐与稳定性的关系（数字需核对原报告）
    core: true
  - id: t07.stack-overflow-developer-survey
    title: 证据 3：Stack Overflow 2025 Developer Survey
    summary: 84% 使用或计划使用，51% 的专业开发者每天用；信任准确性的只有 33%，最大困扰是「几乎对但不对」（66%）
    core: true
  - id: t07.perception-vs-measurement
    title: Perception vs measurement 的落差：为什么自我感觉不可靠
    summary: 等待时间、上下文切换、审查成本被忽略；需要实测
