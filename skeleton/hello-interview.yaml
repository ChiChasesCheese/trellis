- id: lld
  order: 4
  title: 低层设计（Low-Level Design）
  summary: Hello Interview 的低层设计（Low-Level Design）课程，结构与原站一致。
  children:
  - id: lld.cross
    title: 跨题模式（Patterns across questions）
    summary: 多道题共用的机制：在每道题里怎么用、为什么不同、新题该选哪种。
    children:
    - id: lld.cross.strategy-pattern
      title: 策略模式：把变化点做成可替换部件 (Strategy Pattern)
      summary: 把会变化的规则（分配、计费、淘汰、调度、限流算法）抽成接口后注入，核心流程不变，扩展新规则不改主流程。（涉及 7 题）
    - id: lld.cross.lld-concurrency-locking
      title: 类设计中的并发：锁粒度与线程模型 (Locking / Thread-safety)
      summary: 识别唯一需要保护的共享状态，选择合适的锁粒度（全局锁、分段锁、每用户锁、读写锁）或单线程模型，不持锁调用慢操作，并避免死锁。（涉及 8 题）
    - id: lld.cross.ordered-structures-lru
      title: 数据结构选型：哈希表加链表、堆与有序结构 (LRU / Heap / Ordered Structures)
      summary: 用哈希表加双向链表（有序字典）做到 O(1) 的查找与摘除重排，用堆或有序集合做到按时间或优先级取最小，并说清各自的惰性删除和内存代价。（涉及 6 题）
    - id: lld.cross.injected-clock-testability
      title: 时间注入与可测试性 (Injected Clock / Deterministic Tests)
      summary: 把时间做成构造参数注入，用单调时钟而不是墙钟，测试里用可手动拨动的假时钟，避免 sleep，得到快且确定的测试。（涉及 6 题）
    - id: lld.cross.money-value-objects-rounding
      title: 金额、取整与不可变值对象 (Money / Rounding / Immutable Value Objects)
      summary: 金额用整数或定点小数，取整只在边界一次，吸收误差的位置明确，对象不可变，使任何一行金额都能被复现并通过守恒检查。（涉及 6 题）
  - id: lld.in-a-hurry
    title: 速成（In a Hurry）
    summary: 低层设计（Low-Level Design） · 速成（In a Hurry），按 Hello Interview 的顺序。
    children:
    - id: lld.in-a-hurry.introduction
      title: 低层设计速成：总览
      summary: Hello Interview：Low Level Design in a Hurry。
      children:
      - id: lld.in-a-hurry.introduction.notes
