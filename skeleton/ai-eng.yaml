    core: true
  - id: t01.embedding
    title: Embedding
    summary: 把一段文本变成一串数字（向量），意思相近的文本向量也相近；RAG 和语义检索的基础。
    core: true
  - id: t01.model-size-parameters-scaling-law
    title: Model size、parameters 与 scaling law
    summary: 参数量、训练数据量、算力三者的关系；为什么大模型更强也更贵。
    core: false
  - id: t01.foundation-model-model-api
    title: Foundation model 与 model API
    summary: 自己不训练模型，通过 API 调用别人训练好的模型；输入输出按 token 计费。
    core: false
