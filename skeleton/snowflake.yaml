# Snowflake 原理：源自实地调研（ADR 0002）——综合官方文档指南目录、
# SIGMOD 2016 论文《Snowflake Elastic Data Warehouse》、SnowPro Core（COF-C03）
# 考试大纲、Snowflake-Labs 的 awesome-snowflake 精选列表、近期工程博客文章
# （Execution Anchor、FoundationDB、Optima/自适应连接），以及现有的
# vault/interviews/companies/snowflake 面试资料——从不只依赖其中任何单一来源。
# 完整调研过程与大纲标题到叶子节点的映射见 vault/snowflake/BUILD.md。
domain: snowflake
title: Snowflake 原理
lang: zh
nodes:
  - id: architecture
    order: 1
    title: 核心架构
    summary: 三层、多集群共享数据（shared-data）模型——平台上其他一切都是这个模型的结果。
    children:
      - id: architecture.three-layer-model
        title: 三层架构
        summary: 存储、虚拟仓库（virtual warehouse，计算层）与云服务（Cloud Services）在物理和逻辑上彼此分离，仅通过元数据相互通信。
      - id: architecture.storage-compute-separation
        title: 存储与计算分离（storage/compute separation）
        summary: 为何将持久化存储与瞬时计算解耦，能让二者独立伸缩、独立失败，以及这种解耦在网络往返上的代价。
      - id: architecture.multi-cluster-shared-data
        title: 多集群共享数据模型
        summary: 该模型与无共享架构（shared-nothing，每个节点拥有自己的数据）以及共享磁盘架构（shared-disk，所有节点共享一块磁盘）的区别——每个仓库都在同一份共享的、带版本的数据存储之上拥有自己独立的计算资源。
      - id: architecture.cloud-services-layer
        title: 云服务（Cloud Services，GS）层
        summary: 这个无状态服务层做什么——身份认证、查询解析/优化、事务管理、元数据管理——但从不直接接触表的字节数据。
      - id: architecture.cloud-agnostic-multi-region
        title: 跨云与多区域部署
        summary: 在 AWS、Azure、GCP 上运行同一套代码与账户模型，以及区域/账户边界对数据迁移意味着什么。
      - id: architecture.elasticity-multitenancy
        title: 弹性与多租户
        summary: 秒级增减计算资源而无需重新分区数据，以及众多独立租户如何安全地共享同一个元数据/控制平面。

  - id: storage
    order: 2
    title: 存储引擎与微分区（micro-partition）
    summary: 不可变的列式文件格式——剪枝（pruning）、克隆（cloning）、时间旅行（Time Travel）、流（Streams）等一切功能都构建于其上。
    children:
      - id: storage.micro-partition-format
        title: 微分区（micro-partition）格式
        summary: 每张表在物理上都以 50-500MB 的不可变列式文件单元存储，以及为何不可变性是下游一切功能的前提条件。
        requires: [architecture.storage-compute-separation]
      - id: storage.micro-partition-metadata
        title: 微分区元数据
        summary: 每个微分区的头部记录了什么（每列的最小值/最大值、去重计数、空值计数），以及这些元数据实际存放在哪里。
        requires: [storage.micro-partition-format]
      - id: storage.columnar-compression-encoding
        title: 列式压缩与编码
        summary: 按列选择编码方式并压缩，以及为何列式布局是让压缩和剪枝都变得廉价的根本原因。
        requires: [storage.micro-partition-format]
      - id: storage.clustering-keys
        title: 聚簇键（clustering key）
        summary: 选择聚簇键以让相关的微分区聚集在一起，以及真正能从中受益的访问模式。
        requires: [storage.micro-partition-metadata]
      - id: storage.automatic-reclustering
        title: 自动重新聚簇（automatic reclustering）
        summary: 在 DML 操作使聚簇状态漂移后，负责重写微分区以恢复聚簇的后台服务，以及它消耗的信用点（credit）成本。
        requires: [storage.clustering-keys]
      - id: storage.natural-vs-explicit-clustering
        title: 自然聚簇与显式聚簇
        summary: 为何按插入顺序形成的自然聚簇往往已经足够好，以及重叠度/深度（overlap/depth）指标何时提示它不再够用。
        requires: [storage.clustering-keys]
      - id: storage.table-types
        title: 表类型
        summary: 永久表、瞬态表（transient）、临时表（temporary）与外部表——各自享有怎样的时间旅行（Time Travel）与故障保护（Fail-safe）能力，以及原因。
        requires: [storage.micro-partition-format]
      - id: storage.object-storage-backend
        title: 对象存储后端
        summary: 为何每个微分区都是云对象存储（S3/Blob/GCS）中的一个 blob 而不是本地磁盘文件，以及这样做的收益与代价。
        requires: [architecture.storage-compute-separation]

  - id: metadata
    order: 3
    title: 元数据与云服务
    summary: 无状态服务层，以及它据以做出每一个控制面决策的单一元数据存储。
    children:
      - id: metadata.foundationdb-role
        title: FoundationDB 作为元数据存储
        summary: 为何所有表/模式（schema）/事务元数据都存放在一个强一致的分布式键值（KV）存储中，而不是一个定制的目录服务（catalog service）。
        requires: [architecture.cloud-services-layer]
      - id: metadata.execution-anchor
        title: 执行锚点（Execution Anchor）
        summary: 一个查询在其整个生命周期内如何被绑定到唯一一个云服务（Cloud Services）实例，以及当该实例繁忙或崩溃时，主动转移与被动转移这两条路径。
        requires: [metadata.foundationdb-role]
      - id: metadata.query-compiler-pipeline
        title: 查询编译流水线
        summary: 在分配任何计算资源之前，于云服务（Cloud Services）中运行的解析（parse）、绑定（bind）、优化（optimize）阶段。
        requires: [architecture.cloud-services-layer]
      - id: metadata.optimizer-statistics
        title: 优化器统计信息
        summary: 优化器从微分区元数据中提取哪些统计信息（基数、去重值）来选择执行计划，且无需扫描数据本身。
        requires: [storage.micro-partition-metadata]
      - id: metadata.ddl-metadata-versioning
        title: DDL 即元数据版本化
        summary: 为何 ALTER/CREATE/DROP 都是仅涉及元数据的操作，它们创建一个新的表版本，而不是就地修改数据。
        requires: [metadata.foundationdb-role]
      - id: metadata.metadata-scaling-consistency
        title: 元数据层的伸缩与一致性
        summary: 元数据层如何在同时服务一个账户内所有仓库的情况下保持强一致性，以及它在何处会成为瓶颈。
        requires: [metadata.foundationdb-role]

  - id: warehouse
    order: 4
    title: 虚拟仓库（virtual warehouse）
    summary: 计算层——真正运行查询的集群的规格选择、伸缩与计费方式。
    children:
      - id: warehouse.sizing-t-shirt
        title: 仓库规格（T 恤尺码式）
        summary: 从 XS 到 6XL 实际改变的是什么（节点数量，而非单节点算力），以及规格选择如何在延迟与成本之间权衡。
        requires: [architecture.storage-compute-separation]
      - id: warehouse.multi-cluster-scaling-policy
        title: 多集群伸缩策略
        summary: 标准（standard）与经济（economy）两种伸缩策略在并发负载下如何增减集群，以及各自产生的排队行为。
        requires: [warehouse.sizing-t-shirt]
      - id: warehouse.auto-suspend-resume
        title: 自动挂起与自动恢复
        summary: 在最后一条查询结束后的数秒内停止计费的空闲超时机制，以及恢复时的冷启动代价。
        requires: [warehouse.sizing-t-shirt]
      - id: warehouse.isolation-workload-separation
        title: 工作负载隔离
        summary: 将 ETL、BI 与临时查询（ad hoc）工作负载分别运行在独立的仓库上，使某个负载的突增不会抢占另一个负载的计算资源。
        requires: [warehouse.sizing-t-shirt]
      - id: warehouse.query-queuing
        title: 查询排队
        summary: 查询何时会排队而不是立即执行、队列深度如何被暴露出来，以及可以缓解排队的调节手段。
        requires: [warehouse.multi-cluster-scaling-policy]
      - id: warehouse.scaling-up-vs-out
        title: 纵向扩展与横向扩展
        summary: 针对单条高开销查询选择更大的仓库（纵向扩展/scale up），还是针对并发选择更多集群（横向扩展/scale out）——识别哪种症状需要哪种手段。
        requires: [warehouse.multi-cluster-scaling-policy]
      - id: warehouse.resource-monitors
        title: 资源监控器（resource monitor）
        summary: 附加在仓库或账户上的信用点配额，可在达到阈值时通知、挂起或立即挂起。
        requires: [warehouse.sizing-t-shirt]

  - id: query
    order: 5
    title: 查询编译与执行
    summary: 一条 SQL 语句从提交到输出第一行结果之间发生了什么。
    children:
      - id: query.compilation-pipeline
        title: 编译流水线
        summary: 解析（parse）→ 绑定（bind）→ 优化（optimize）→ 代码生成（codegen）的顺序，以及每个阶段运行在哪里。
        requires: [metadata.query-compiler-pipeline]
      - id: query.dag-execution-model
        title: DAG 执行模型
        summary: 编译后的查询会变成一个由算子（operator）组成的有向无环图（DAG），并被分发给仓库各节点上的工作进程执行。
        requires: [query.compilation-pipeline]
      - id: query.vectorized-columnar-execution
        title: 向量化列式执行
        summary: 按批次、面向列的算子执行方式，以及为何它在分析型负载上优于逐行解释执行。
        requires: [storage.columnar-compression-encoding]
      - id: query.join-strategies-broadcast-shuffle
        title: 连接（join）策略
        summary: 广播连接（broadcast join）与洗牌连接（shuffle/hash-repartition join）的对比，以及优化器据以选择其一的数据量启发式规则。
        requires: [query.dag-execution-model]
      - id: query.spilling-to-remote-disk
        title: 溢出（spilling）到本地与远程磁盘
        summary: 当一个算子的工作集超出仓库内存、进而超出本地 SSD、最终溢出到远程存储时会发生什么，以及每一步所对应的延迟悬崖。
        requires: [query.dag-execution-model, warehouse.sizing-t-shirt]
      - id: query.reading-query-profile
        title: 解读查询画像（query profile）
        summary: 在查询画像图中定位开销最大的算子节点、已扫描字节数与被剪枝字节数的对比，以及溢出（spilling）指标。
        requires: [query.dag-execution-model]
      - id: query.explain-plan-interpretation
        title: EXPLAIN 执行计划解读
        summary: 在运行查询之前读取逻辑/物理执行计划，以预测剪枝效果与连接策略。
        requires: [query.compilation-pipeline]
      - id: query.adaptive-runtime-optimizations
        title: 自适应运行时优化
        summary: 基于运行时信息做出的决策（例如自适应连接策略选择），利用实际观测到的基数在执行过程中修订计划，而不仅依赖编译期估算。
        requires: [query.join-strategies-broadcast-shuffle]

  - id: pruning
    order: 6
    title: 剪枝与查询优化
    summary: 读取比查询字面含义所暗示的更少的数据，以及比单纯剪枝走得更远的、持续维护的访问路径。
    children:
      - id: pruning.min-max-zone-maps
        title: 最小/最大值剪枝（zone map）
        summary: 在不打开文件的情况下，跳过那些最小/最大值范围无法满足谓词条件的整个微分区。
        requires: [storage.micro-partition-metadata]
      - id: pruning.partition-elimination
        title: 分区消除（partition elimination）
        summary: 剪枝决策如何仅凭元数据在编译期做出，从而把一次全表扫描变成对存活微分区集合的扫描。
        requires: [pruning.min-max-zone-maps]
      - id: pruning.clustering-depth-metric
        title: 聚簇深度（clustering depth）
        summary: 量化一张表的微分区在聚簇键上重叠程度的指标，以及该值偏高时对剪枝效果的预示。
        requires: [storage.clustering-keys]
      - id: pruning.search-optimization-service
        title: 搜索优化服务（Search Optimization Service）
        summary: 一种持续维护的访问路径（并非 B 树索引），用于加速非聚簇列上高选择性的点查（point lookup）。
        requires: [pruning.partition-elimination]
      - id: pruning.materialized-views-maintenance
        title: 物化视图（materialized view）
        summary: 预先计算并自动维护的结果集，以及抵消其读取加速收益的后台刷新成本。
        requires: [pruning.partition-elimination]
      - id: pruning.query-acceleration-service
        title: 查询加速服务（Query Acceleration Service）
        summary: 借用无服务器（serverless）计算资源，将异常耗时查询中的扫描/过滤部分并行化到超出其所属仓库自身节点数的规模。
        requires: [query.dag-execution-model]

  - id: cache
    order: 7
    title: 缓存层
    summary: 介于"已经算好"与"从微分区重新计算"之间的各层缓存——以及哪种症状指向哪一层。
    children:
      - id: cache.result-cache
        title: 持久化结果缓存
        summary: 当 SQL 文本与底层数据均未改变时，零计算成本地返回此前的结果，有效期最长 24 小时。
        requires: [metadata.foundationdb-role]
      - id: cache.result-cache-invalidation
        title: 结果缓存失效
        summary: 什么样的变化（针对数据本身，而非单纯的时间流逝）会使缓存结果失效，以及为何一个毫不相关的会话也能命中该缓存。
        requires: [cache.result-cache]
      - id: cache.warehouse-local-disk-cache
        title: 仓库本地 SSD 缓存
        summary: 每个节点上缓存近期扫描过的微分区的本地磁盘缓存，仓库一旦挂起就会丢失该缓存。
        requires: [warehouse.sizing-t-shirt]
      - id: cache.metadata-cache-pruning-stats
        title: 用于剪枝的元数据缓存
        summary: 直接缓存最小值/最大值/计数等统计信息本身，使剪枝和简单聚合运算完全无需接触数据文件。
        requires: [storage.micro-partition-metadata]
      - id: cache.cache-layer-tradeoffs
        title: 各缓存层的权衡
        summary: 比较每一层缓存的收益（延迟 vs 陈旧风险 vs 预热成本），以及给定症状究竟指向哪一层。
        requires: [cache.result-cache, cache.warehouse-local-disk-cache]

  - id: txn
    order: 8
    title: 事务与并发控制
    summary: 平台围绕并发读写者所做出的承诺，这一切完全建立在不可变文件之上。
    children:
      - id: txn.acid-guarantees
        title: ACID 保证
        summary: 在一个不可变、带版本的存储层上，原子性、一致性、隔离性与持久性具体意味着什么。
        requires: [architecture.three-layer-model]
      - id: txn.snapshot-isolation
        title: 隔离级别：READ COMMITTED 与一致性读
        summary: 普通表只支持 READ COMMITTED——每条语句看到语句开始时已提交的数据；读不阻塞写，基于不可变微分区的多版本读取；Stream 在事务内提供可重复读（repeatable read）。
        requires: [txn.acid-guarantees]
      - id: txn.mvcc-immutable-partitions
        title: 基于不可变微分区的 MVCC
        summary: 一次写入从不就地修改微分区，而是生成一个新的表版本，引用新写入的分区与未变化的分区。
        requires: [storage.micro-partition-format, txn.snapshot-isolation]
      - id: txn.optimistic-concurrency-conflicts
        title: 写并发：表级锁与写冲突
        summary: 普通表上 UPDATE、DELETE、MERGE 会加锁，通常阻塞同表上其他 UPDATE/DELETE/MERGE，而 INSERT 与 COPY 一般可以并行；锁等待超时与死锁如何表现。
        requires: [txn.mvcc-immutable-partitions]
      - id: txn.ddl-as-transaction
        title: DDL 即事务
        summary: 为何模式（schema）变更从读者的视角看是原子且瞬时的——它构建在与 DML 相同的元数据版本化机制之上。
        requires: [metadata.ddl-metadata-versioning]
      - id: txn.multi-statement-transactions
        title: 多语句事务
        summary: 用显式的 BEGIN/COMMIT 将多条语句纳入同一事务范围、默认的自动提交（autocommit）行为，以及隐式事务容易带来麻烦的地方。
        requires: [txn.snapshot-isolation]

  - id: continuity
    order: 9
    title: 时间旅行、故障保护与克隆
    summary: 从错误中恢复、并以低成本派生出新环境——这一切之所以可能，是因为存储层从不就地覆写任何内容。
    children:
      - id: continuity.retention-vs-failsafe
        title: 时间旅行与故障保护对比
        summary: 默认 1 天（Enterprise 及以上版本最长 90 天）的可查询保留窗口，与随后紧接着的、不可查询的 7 天故障保护（Fail-safe）恢复窗口的对比，以及各自能由谁来发起恢复。
        requires: [txn.mvcc-immutable-partitions]
      - id: continuity.at-before-statement-syntax
        title: AT / BEFORE 查询语法
        summary: 按时间戳、偏移量或语句 ID 查询某个历史版本的表，以及决定被引用的版本是否仍然存在的因素。
        requires: [continuity.retention-vs-failsafe]
      - id: continuity.undrop-recovery
        title: UNDROP 恢复
        summary: 在保留窗口内将已删除的表、模式（schema）或数据库恢复回来，这是一次元数据操作，而不是从备份中还原。
        requires: [continuity.retention-vs-failsafe]
      - id: continuity.zero-copy-clone
        title: 零拷贝克隆（zero-copy clone）
        summary: 克隆一张表、一个模式（schema）或一个数据库时，只复制指向已有微分区的元数据指针，而不复制实际字节数据。
        requires: [continuity.retention-vs-failsafe]
      - id: continuity.clone-storage-billing
        title: 克隆的存储计费
        summary: 为何一个克隆在发生分叉之前不产生任何存储成本，以及分叉（任一侧发生新写入）之后如何开始累积存储费用。
        requires: [continuity.zero-copy-clone]
      - id: continuity.replication-and-failover
        title: 数据库复制与故障切换
        summary: 将一个数据库的数据与元数据持续复制到另一个区域或云，并在故障切换时把从库提升为主库。
        requires: [metadata.foundationdb-role]
      - id: continuity.client-redirect
        title: 客户端重定向
        summary: 一种连接层面的 DNS/URL 间接寻址机制，使客户端驱动能够跟随账户的故障切换而无需重新配置。
        requires: [continuity.replication-and-failover]

  - id: semistructured
    order: 10
    title: 半结构化数据
    summary: 将 JSON/Avro/Parquet 当作一等公民的列式数据来处理，而不是一个不透明的二进制大对象（blob）。
    children:
      - id: semistructured.variant-type-storage
        title: VARIANT 类型与存储
        summary: JSON/Avro/Parquet/XML 如何在加载时被一次性解析，转换为同一种微分区格式内部的自描述列式表示。
        requires: [storage.micro-partition-format]
      - id: semistructured.schema-on-read-parsing
        title: 读时模式解析（schema-on-read）
        summary: 在查询时通过路径表达式从 VARIANT 中提取带类型的列，以及由此带来的类型推断开销。
        requires: [semistructured.variant-type-storage]
      - id: semistructured.flatten-lateral-joins
        title: FLATTEN 与 LATERAL 连接
        summary: 用 FLATTEN 将嵌套的数组或对象展开成多行，以及为何这需要一次 LATERAL 连接。
        requires: [semistructured.variant-type-storage]
      - id: semistructured.schema-evolution-tables
        title: 半结构化数据源上的模式演进
        summary: 随着导入的 JSON/Parquet 中出现新字段而让表的列自动增长，以及约束这一过程的兼容性规则。
        requires: [semistructured.variant-type-storage]

  - id: ingestion
    order: 11
    title: 数据加载与摄取
    summary: 把平台外部的数据以批量、微批量和行级延迟等不同粒度导入表中。
    children:
      - id: ingestion.bulk-copy-into
        title: 批量加载（COPY INTO）
        summary: 从暂存区（stage）批量加载文件、防止同一文件被重复加载的加载元数据，以及跨文件的并行加载。
        requires: [storage.table-types]
      - id: ingestion.file-formats-and-stages
        title: 文件格式与暂存区（stage）
        summary: 内部暂存区与外部暂存区的区别、具名文件格式，以及 COPY INTO 如何同时利用二者来解析导入的文件。
        requires: [ingestion.bulk-copy-into]
      - id: ingestion.snowpipe-auto-ingest
        title: Snowpipe 自动摄取
        summary: 由事件通知触发、无服务器（serverless）的微批量加载——文件一到达暂存区就被加载，延迟为分钟级。
        requires: [ingestion.file-formats-and-stages]
      - id: ingestion.snowpipe-streaming-offset-tokens
        title: Snowpipe Streaming 与偏移量令牌（offset token）
        summary: 基于通道（channel）的行级摄取，由客户端提供偏移量令牌（offset token），在无需暂存文件的情况下提供恰好一次（exactly-once）语义。
        requires: [ingestion.snowpipe-auto-ingest]
      - id: ingestion.datastream-kafka-compatible
        title: Datastream（兼容 Kafka 协议的摄取）
        summary: 一个原生流式服务，直接用 Kafka 线上协议（wire protocol）向表中写入数据，并继承 RBAC、血缘（lineage）与时间旅行（Time Travel）能力。
        requires: [ingestion.snowpipe-streaming-offset-tokens]
      - id: ingestion.external-tables-over-lake
        title: 数据湖之上的外部表
        summary: 直接原地查询对象存储中的文件而无需加载，以及让外部表保持最新的元数据刷新机制。
        requires: [storage.object-storage-backend]
      - id: ingestion.unload-export
        title: 数据卸载（COPY INTO location）
        summary: 将查询结果或表数据以文件形式导出回暂存区，以及影响下游消费者的格式/压缩选择。
        requires: [ingestion.bulk-copy-into]

  - id: pipelines
    order: 12
    title: 流（Stream）、任务（Task）与动态表（Dynamic Table）
    summary: Snowflake 原生的变更捕获与编排能力，从最底层的偏移量书签到声明式的新鲜度（freshness）SLA。
    children:
      - id: pipelines.stream-offset-bookmark
        title: 作为偏移量书签的流（Stream）
        summary: 一个 Stream 是指向表版本历史中某一点的指针，而不是数据的副本；查询它返回的是自上次消费以来的净变化。
        requires: [txn.mvcc-immutable-partitions]
      - id: pipelines.stream-types
        title: 流类型（标准 / 仅追加 / 仅插入）
        summary: 每种流类型分别追踪什么——所有 DML、仅插入，还是不可变数据源上的插入——以及何时该选哪一种。
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.stream-consumption-and-offset-advance
        title: 偏移量仅在消费 DML 内前移
        summary: 为何偏移量只有在读取该 Stream 的事务同时提交时才会前移，这使得一个崩溃的消费者会重新尝试完全相同的一组变更。
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.stream-staleness-and-retention-extension
        title: 流的陈旧化与保留期延长
        summary: 是什么让一个 Stream 变得陈旧（超过源表保留期仍未被消费），以及延迟这一情况发生的自动保留期延长机制。
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.task-scheduling-cron-and-dag
        title: 任务调度与 DAG
        summary: 由 CRON 表达式或固定间隔调度的 Task，可组合成最多包含 100 个任务的依赖图（task graph）。
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.task-conditional-execution
        title: 条件式任务执行
        summary: 使用 SYSTEM$STREAM_HAS_DATA() 在上游 Stream 为空时完全跳过一次 Task 运行。
        requires: [pipelines.task-scheduling-cron-and-dag]
      - id: pipelines.task-serverless-vs-warehouse
        title: 无服务器任务与仓库支持型任务
        summary: 让 Snowflake 按每次运行自动调整计算规模（无服务器/serverless），还是将 Task 绑定到固定的仓库，以及这一选择隐含的成本/延迟权衡。
        requires: [pipelines.task-scheduling-cron-and-dag, warehouse.sizing-t-shirt]
      - id: pipelines.task-failure-handling
        title: 任务失败处理
        summary: SUSPEND_TASK_AFTER_NUM_FAILURES 参数、重试次数，以及当某个节点失败时 DAG 的行为——是仅该分支停止，还是整个图都停止？
        requires: [pipelines.task-scheduling-cron-and-dag]
      - id: pipelines.dynamictable-target-lag
        title: 动态表（Dynamic Table）与 TARGET_LAG
        summary: 声明一个新鲜度 SLA，而不必手写过去用来实现它的 Stream+Task+MERGE 组合，以及调度器如何据此推导出刷新节奏。
        requires: [pipelines.stream-offset-bookmark, pipelines.task-scheduling-cron-and-dag]
      - id: pipelines.dynamictable-incremental-vs-full-refresh
        title: 增量刷新与全量刷新
        summary: 动态表何时能仅凭增量数据计算出下一个状态，何时又必须从头重新计算。
        requires: [pipelines.dynamictable-target-lag]
      - id: pipelines.dynamictable-adaptive-refresh
        title: 自适应刷新
        summary: 检测到上游变化大到增量刷新反而比重新初始化更慢时，自动切换刷新策略。
        requires: [pipelines.dynamictable-incremental-vs-full-refresh]

  - id: security
    order: 13
    title: 安全与治理
    summary: 谁能通过身份认证、认证后又能看到什么，以及事后如何证明这两件事。
    children:
      - id: security.authn-mfa-sso
        title: 身份认证（MFA、SSO、密钥对）
        summary: 密码/多因素认证（MFA）、联合单点登录（SSO，基于 SAML/OAuth），以及密钥对认证——这几种方式在机器人/自动化场景下的适配程度各不相同。
        requires: [architecture.cloud-services-layer]
      - id: security.rbac-role-hierarchy
        title: RBAC 角色层级
        summary: 角色构成一个有向无环图（DAG，而非树），权限沿着继承关系向上流动，以及为何一个角色可以有多个父角色。
        requires: [metadata.foundationdb-role]
      - id: security.rbac-ownership-and-grants
        title: 所有权与授权传播
        summary: OWNERSHIP 作为包含其他一切权限的权限、GRANT/REVOKE 的传播方式，以及模式（schema）上的未来授权（future grant）。
        requires: [security.rbac-role-hierarchy]
      - id: security.network-policies-private-connectivity
        title: 网络策略与私有连接
        summary: 账户或用户级别的 IP 白名单/黑名单，以及完全绕开公网的云原生私有连接（PrivateLink/Private Service Connect）。
        requires: [security.authn-mfa-sso]
      - id: security.encryption-key-hierarchy
        title: 加密密钥层级
        summary: 分层的密钥结构（根密钥 → 账户密钥 → 表密钥 → 文件密钥），以及对用户完全透明的自动密钥轮换/重新加密。
        requires: [architecture.cloud-services-layer]
      - id: security.row-access-policies
        title: 行级访问策略（row access policy）
        summary: 给表附加一个行过滤谓词，使不同角色看到同一批行的不同子集，该谓词在查询时被求值。
        requires: [security.rbac-role-hierarchy]
      - id: security.column-masking-policies
        title: 动态数据脱敏（dynamic data masking）
        summary: 给列附加一个脱敏函数，使其未脱敏的原始值只对策略允许的角色可见。
        requires: [security.rbac-role-hierarchy]
      - id: security.data-classification-and-tagging
        title: 数据分类与对象标签
        summary: 自动化的敏感数据分类，以及基于标签（tag）的策略挂载，使脱敏/行级策略能够规模化应用，而不必逐列配置。
        requires: [security.column-masking-policies]
      - id: security.data-lineage-and-access-history
        title: 数据血缘与访问历史
        summary: 通过视图和 CTAS 追踪一列数据的来源，以及 ACCESS_HISTORY 作为记录谁实际读取或写入了哪些列的审计轨迹。
        requires: [security.rbac-role-hierarchy]
      - id: security.trust-center-posture
        title: 信任中心（Trust Center）安全态势
        summary: 一个内置扫描器，将错误配置（公开的网络策略、过度授权等）汇总为一份按优先级排序的风险清单，无需借助外部工具。
        requires: [security.network-policies-private-connectivity]

  - id: sharing
    order: 14
    title: 数据共享与协作
    summary: 在不复制数据的前提下，让另一个账户（或公众）访问实时数据。
    children:
      - id: sharing.secure-data-sharing-mechanics
        title: 安全数据共享（Secure Data Sharing）机制
        summary: 通过元数据指针授予另一个账户对实时微分区的读取权限——无需复制数据、无需 ETL，消费方看到的始终是当前数据。
        requires: [metadata.foundationdb-role, security.rbac-role-hierarchy]
      - id: sharing.data-marketplace-listings
        title: 数据市场（Data Marketplace）挂牌
        summary: 将一个共享发布为可被发现的挂牌（免费或付费），与将其作为私有直接共享指定给某个具名账户，这两种方式的对比。
        requires: [sharing.secure-data-sharing-mechanics]
      - id: sharing.reader-accounts
        title: 只读账户（reader account）
        summary: 让没有自己 Snowflake 账户的组织，通过一个由提供方管理、费用计入提供方的账户来消费某个共享。
        requires: [sharing.secure-data-sharing-mechanics]
      - id: sharing.clean-rooms-privacy
        title: 数据洁净室（Data Clean Room）
        summary: 让双方在受治理策略约束下，对彼此的数据进行连接或聚合计算，而任何一方都看不到对方的原始行数据。
        requires: [sharing.secure-data-sharing-mechanics]

  - id: openplatform
    order: 15
    title: 开放格式与工作负载扩展
    summary: 平台不再是一个封闭仓库的边界所在——开放表格式、外部引擎与 OLTP 工作负载。
    children:
      - id: openplatform.iceberg-tables
        title: Iceberg 表
        summary: 将由 Snowflake 管理的数据以开放的 Iceberg 格式存储在客户自有的对象存储中，并可被外部引擎查询。
        requires: [storage.object-storage-backend]
      - id: openplatform.polaris-catalog
        title: Polaris（开放目录）
        summary: 一个开源的、与引擎无关的 Iceberg 表 REST 目录服务，将"谁写入了表"与"谁可以查询表"这两件事解耦。
        requires: [openplatform.iceberg-tables]
      - id: openplatform.external-engine-commit-protocol
        title: 外部引擎写入与提交协议
        summary: 先写入数据、再原子更新目录指针、最后提交治理元数据的顺序，使非 Snowflake 引擎也能安全地写入一张 Iceberg 表。
        requires: [openplatform.polaris-catalog, txn.snapshot-isolation]
      - id: openplatform.hybrid-tables-oltp
        title: 混合表（Hybrid Table，Unistore）
        summary: 一种行存储表类型，具有强制主键与行锁，支持毫秒级点查，并异步镜像到列式存储中以支持分析查询。
        requires: [metadata.foundationdb-role, storage.table-types]
      - id: openplatform.snowflake-postgres
        title: Snowflake Postgres
        summary: 平台内置的、协议兼容的托管 Postgres 实例，面向需要混合表（Hybrid Table）尚不提供的事务语义的 OLTP 工作负载。
        requires: [openplatform.hybrid-tables-oltp]
      - id: openplatform.snowpark-udf-udtf
        title: Snowpark 用户自定义函数（UDF）与表函数（UDTF）
        summary: 在仓库的沙箱环境中以标量函数或表函数的形式运行用户代码（Python/Java/Scala），以及由此带来的逐行调用开销。
        requires: [architecture.cloud-services-layer]
      - id: openplatform.stored-procedure-sandboxing
        title: 存储过程沙箱化
        summary: 围绕用户提供的存储过程代码建立的隔离边界，以及为何它默认无法访问网络或文件系统。
        requires: [openplatform.snowpark-udf-udtf]

  - id: cost
    order: 16
    title: 成本、计量与可观测性
    summary: 使用量如何转化为账单，以及去哪里查看以解释或质疑一份账单。
    children:
      - id: cost.credit-model-per-second-billing
        title: 信用点模型与按秒计费
        summary: 仓库按秒以信用点（credit）计费（最低 60 秒起计），与任何固定的实例价格脱钩。
        requires: [architecture.storage-compute-separation]
      - id: cost.warehouse-billing-60s-minimum
        title: 仓库最低计费时长
        summary: 每次恢复运行至少收取 60 秒费用，以及这对调优自动挂起超时时间的影响。
        requires: [cost.credit-model-per-second-billing, warehouse.sizing-t-shirt]
      - id: cost.serverless-feature-billing
        title: 无服务器功能计费
        summary: 为何 Snowpipe、无服务器 Task 与搜索优化服务（Search Optimization）各自按自己的信用点费率计费，而不计入某个仓库。
        requires: [cost.credit-model-per-second-billing]
      - id: cost.cloud-services-free-tier
        title: 云服务免费额度
        summary: 云服务（Cloud Services）每日的免费用量额度（相当于仓库计算量的 10%），超出后才会作为单独的计费项出现。
        requires: [cost.credit-model-per-second-billing]
      - id: cost.ai-token-metering
        title: AI/Cortex 令牌计量
        summary: Cortex AI 函数按令牌（token）计费，与计算信用点分开单独追踪，并可设置账户级别的支出上限。
        requires: [cost.credit-model-per-second-billing]
      - id: cost.resource-monitors-and-budgets
        title: 用资源监控器强制执行预算
        summary: 利用资源监控器（Resource Monitor）的通知/挂起/立即挂起动作，将其作为真正的支出上限，而不仅仅是一个提醒。
        requires: [warehouse.resource-monitors]
      - id: cost.query-history-and-account-usage
        title: QUERY_HISTORY 与 ACCOUNT_USAGE
        summary: 该去哪里查看一条查询的成本与性能——INFORMATION_SCHEMA、ACCOUNT_USAGE 还是 Snowsight——以及三者之间在延迟与保留期上的权衡。
        requires: [metadata.foundationdb-role]
      - id: cost.access-history-lineage-for-cost
        title: 将成本归因到查询模式
        summary: 连接 ACCESS_HISTORY 与 QUERY_HISTORY，找出究竟是哪些表、仓库或用户在驱动支出——这是在优化任何东西之前的诊断步骤。
        requires: [cost.query-history-and-account-usage]
