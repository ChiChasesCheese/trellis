# Snowflake Internals: authored from the field (ADR 0002) — the union of the
# official docs guide TOC, the SIGMOD 2016 "Snowflake Elastic Data Warehouse"
# paper, the SnowPro Core (COF-C03) exam domain blueprint, the Snowflake-Labs
# awesome-snowflake curated list, recent engineering-blog posts (Execution
# Anchor, FoundationDB, Optima/adaptive joins), and the existing
# vault/interviews/companies/snowflake kit material — never derived from any
# one of them alone. See vault/snowflake/BUILD.md for the full survey and the
# outline-heading -> leaf mapping.
domain: snowflake
title: Snowflake Internals
nodes:
  - id: architecture
    order: 1
    title: Core Architecture
    summary: The three-layer, multi-cluster shared-data model everything else in the platform is a consequence of.
    children:
      - id: architecture.three-layer-model
        title: Three-Layer Architecture
        summary: Storage, virtual warehouses (compute), and Cloud Services as physically and logically separate layers that talk only through metadata.
      - id: architecture.storage-compute-separation
        title: Storage/Compute Separation
        summary: Why decoupling durable storage from ephemeral compute lets each scale and fail independently, and what it costs in network round trips.
      - id: architecture.multi-cluster-shared-data
        title: Multi-cluster, Shared-Data Model
        summary: How this differs from shared-nothing (each node owns its data) and shared-disk (all nodes share one disk) — every warehouse gets its own compute over one shared, versioned data store.
      - id: architecture.cloud-services-layer
        title: Cloud Services (GS) Layer
        summary: What the stateless services layer does — authentication, query parsing/optimization, transaction management, metadata — never touching table bytes itself.
      - id: architecture.cloud-agnostic-multi-region
        title: Cross-Cloud & Multi-Region Deployment
        summary: Running the same codebase and account model across AWS, Azure, and GCP, and what region/account boundaries mean for data movement.
      - id: architecture.elasticity-multitenancy
        title: Elasticity & Multi-tenancy
        summary: Adding or removing compute in seconds without repartitioning data, and how many independent tenants share one metadata/control plane safely.

  - id: storage
    order: 2
    title: Storage Engine & Micro-partitions
    summary: The immutable columnar file format everything — pruning, cloning, Time Travel, Streams — is built on top of.
    children:
      - id: storage.micro-partition-format
        title: Micro-partition Format
        summary: The 50-500MB immutable, columnar file unit every table is physically stored as, and why immutability is the precondition for everything downstream.
        requires: [architecture.storage-compute-separation]
      - id: storage.micro-partition-metadata
        title: Micro-partition Metadata
        summary: What the header of every micro-partition tracks (min/max per column, distinct counts, null counts) and where that metadata actually lives.
        requires: [storage.micro-partition-format]
      - id: storage.columnar-compression-encoding
        title: Columnar Compression & Encoding
        summary: Per-column encoding choice and compression, and why columnar layout is what makes both compression and pruning cheap.
        requires: [storage.micro-partition-format]
      - id: storage.clustering-keys
        title: Clustering Keys
        summary: Choosing a clustering key to keep correlated micro-partitions together, and the access patterns that actually benefit.
        requires: [storage.micro-partition-metadata]
      - id: storage.automatic-reclustering
        title: Automatic Reclustering
        summary: The background service that rewrites micro-partitions to restore clustering after DML drifts it, and its credit cost.
        requires: [storage.clustering-keys]
      - id: storage.natural-vs-explicit-clustering
        title: Natural vs Explicit Clustering
        summary: Why insertion-order (natural) clustering is often good enough, and the overlap/depth signal that says when it isn't.
        requires: [storage.clustering-keys]
      - id: storage.table-types
        title: Table Types
        summary: Permanent, transient, temporary, and external tables — what Time Travel and Fail-safe each one gets and why.
        requires: [storage.micro-partition-format]
      - id: storage.object-storage-backend
        title: Object Storage Backend
        summary: Why every micro-partition is a blob in cloud object storage (S3/Blob/GCS) instead of local disk, and what that buys and costs.
        requires: [architecture.storage-compute-separation]

  - id: metadata
    order: 3
    title: Metadata & Cloud Services
    summary: The stateless services layer and the single metadata store it runs every control-plane decision against.
    children:
      - id: metadata.foundationdb-role
        title: FoundationDB as the Metadata Store
        summary: Why all table/schema/transaction metadata lives in one strongly-consistent distributed KV store instead of a bespoke catalog service.
        requires: [architecture.cloud-services-layer]
      - id: metadata.execution-anchor
        title: Execution Anchor
        summary: How a query is bound to exactly one Cloud Services instance for its lifetime, and the voluntary vs involuntary transfer paths when that instance is busy or crashes.
        requires: [metadata.foundationdb-role]
      - id: metadata.query-compiler-pipeline
        title: Query Compiler Pipeline
        summary: Parse, bind, and optimize stages that run in Cloud Services before a single byte of compute is provisioned.
        requires: [architecture.cloud-services-layer]
      - id: metadata.optimizer-statistics
        title: Optimizer Statistics
        summary: What statistics the optimizer pulls from micro-partition metadata (cardinality, distinct values) to choose a plan, without scanning data.
        requires: [storage.micro-partition-metadata]
      - id: metadata.ddl-metadata-versioning
        title: DDL as Metadata Versioning
        summary: Why ALTER/CREATE/DROP are metadata-only operations that create a new table version rather than mutating data in place.
        requires: [metadata.foundationdb-role]
      - id: metadata.metadata-scaling-consistency
        title: Metadata Layer Scaling & Consistency
        summary: How the metadata layer stays strongly consistent while serving every warehouse in an account concurrently, and where it becomes the bottleneck.
        requires: [metadata.foundationdb-role]

  - id: warehouse
    order: 4
    title: Virtual Warehouses
    summary: The compute layer — sizing, scaling, and billing for the clusters that actually run queries.
    children:
      - id: warehouse.sizing-t-shirt
        title: Warehouse Sizing (T-shirt Sizes)
        summary: What XS through 6XL actually changes (node count, not per-node power) and how size choice trades latency for cost.
        requires: [architecture.storage-compute-separation]
      - id: warehouse.multi-cluster-scaling-policy
        title: Multi-cluster Scaling Policy
        summary: Standard vs economy scaling policies for adding/removing clusters under concurrent load, and the queueing behavior each produces.
        requires: [warehouse.sizing-t-shirt]
      - id: warehouse.auto-suspend-resume
        title: Auto-suspend & Auto-resume
        summary: The idle-timeout mechanism that stops billing within seconds of the last query, and the cold-start cost of resuming.
        requires: [warehouse.sizing-t-shirt]
      - id: warehouse.isolation-workload-separation
        title: Workload Isolation
        summary: Running ETL, BI, and ad hoc workloads on separate warehouses so one workload's spike can't starve another's compute.
        requires: [warehouse.sizing-t-shirt]
      - id: warehouse.query-queuing
        title: Query Queuing
        summary: When a query queues instead of running, how queue depth is surfaced, and the knobs that relieve it.
        requires: [warehouse.multi-cluster-scaling-policy]
      - id: warehouse.scaling-up-vs-out
        title: Scaling Up vs Scaling Out
        summary: Bigger warehouse (up) for one expensive query vs more clusters (out) for concurrency — recognizing which symptom calls for which lever.
        requires: [warehouse.multi-cluster-scaling-policy]
      - id: warehouse.resource-monitors
        title: Resource Monitors
        summary: Credit quotas attached to warehouses or accounts that can notify, suspend, or suspend-immediately at a threshold.
        requires: [warehouse.sizing-t-shirt]

  - id: query
    order: 5
    title: Query Compilation & Execution
    summary: What happens to a SQL statement between submission and its first row of output.
    children:
      - id: query.compilation-pipeline
        title: Compilation Pipeline
        summary: The parse -> bind -> optimize -> codegen sequence and where each pass runs.
        requires: [metadata.query-compiler-pipeline]
      - id: query.dag-execution-model
        title: DAG Execution Model
        summary: A compiled query becomes a DAG of operators handed to worker processes across the warehouse's nodes.
        requires: [query.compilation-pipeline]
      - id: query.vectorized-columnar-execution
        title: Vectorized Columnar Execution
        summary: Batch-at-a-time, column-oriented operator execution and why it beats row-at-a-time interpretation on analytical workloads.
        requires: [storage.columnar-compression-encoding]
      - id: query.join-strategies-broadcast-shuffle
        title: Join Strategies
        summary: Broadcast join vs shuffle (hash-repartition) join, and the size heuristic the optimizer uses to pick one.
        requires: [query.dag-execution-model]
      - id: query.spilling-to-remote-disk
        title: Spilling to Local & Remote Disk
        summary: What happens when an operator's working set exceeds warehouse memory, then local SSD, and finally spills to remote storage — and the latency cliff at each step.
        requires: [query.dag-execution-model, warehouse.sizing-t-shirt]
      - id: query.reading-query-profile
        title: Reading a Query Profile
        summary: Locating the most-expensive operator node, bytes scanned vs pruned, and spilling indicators in the query profile graph.
        requires: [query.dag-execution-model]
      - id: query.explain-plan-interpretation
        title: EXPLAIN Plan Interpretation
        summary: Reading a logical/physical plan before running a query to predict pruning and join strategy.
        requires: [query.compilation-pipeline]
      - id: query.adaptive-runtime-optimizations
        title: Adaptive Runtime Optimizations
        summary: Runtime-informed decisions (e.g. adaptive join selection) that revise a plan mid-execution using observed cardinalities instead of only compile-time estimates.
        requires: [query.join-strategies-broadcast-shuffle]

  - id: pruning
    order: 6
    title: Pruning & Query Optimization
    summary: Reading less data than the query would naively imply, and the maintained access paths that go further than pruning alone.
    children:
      - id: pruning.min-max-zone-maps
        title: Min/Max Pruning (Zone Maps)
        summary: Skipping whole micro-partitions whose min/max range can't satisfy a predicate, without opening the file.
        requires: [storage.micro-partition-metadata]
      - id: pruning.partition-elimination
        title: Partition Elimination
        summary: How the pruning decision is made at compile time from metadata alone, turning a full scan into a scan of the surviving micro-partition set.
        requires: [pruning.min-max-zone-maps]
      - id: pruning.clustering-depth-metric
        title: Clustering Depth
        summary: The metric that quantifies how much a table's micro-partitions overlap on its clustering key, and what a high value predicts about pruning.
        requires: [storage.clustering-keys]
      - id: pruning.search-optimization-service
        title: Search Optimization Service
        summary: A maintained access path (not a B-tree index) that accelerates highly selective point lookups on non-clustered columns.
        requires: [pruning.partition-elimination]
      - id: pruning.materialized-views-maintenance
        title: Materialized Views
        summary: Precomputed, automatically-maintained result sets and the background refresh cost that offsets their read speedup.
        requires: [pruning.partition-elimination]
      - id: pruning.query-acceleration-service
        title: Query Acceleration Service
        summary: Serverless compute borrowed to parallelize the scan/filter portion of an outlier query beyond its warehouse's own node count.
        requires: [query.dag-execution-model]

  - id: cache
    order: 7
    title: Caching Layers
    summary: The layers between "already computed" and "recompute from micro-partitions" — and which symptom points at which one.
    children:
      - id: cache.result-cache
        title: Persisted Result Cache
        summary: Returning a prior result with zero compute when the SQL text and underlying data are unchanged, for up to 24 hours.
        requires: [metadata.foundationdb-role]
      - id: cache.result-cache-invalidation
        title: Result Cache Invalidation
        summary: What change (to data, not just wall-clock time) invalidates a cached result, and why an unrelated session can still hit it.
        requires: [cache.result-cache]
      - id: cache.warehouse-local-disk-cache
        title: Warehouse-local SSD Cache
        summary: The per-node local disk cache of recently-scanned micro-partitions that a warehouse loses on suspend.
        requires: [warehouse.sizing-t-shirt]
      - id: cache.metadata-cache-pruning-stats
        title: Metadata Cache for Pruning
        summary: Caching the min/max/count statistics themselves so pruning and simple aggregates never touch data files.
        requires: [storage.micro-partition-metadata]
      - id: cache.cache-layer-tradeoffs
        title: Cache Layer Trade-offs
        summary: Comparing what each cache layer buys (latency vs staleness risk vs warm-up cost) and which one a given symptom points at.
        requires: [cache.result-cache, cache.warehouse-local-disk-cache]

  - id: txn
    order: 8
    title: Transactions & Concurrency Control
    summary: What the platform promises around concurrent readers and writers, built entirely on immutable files.
    children:
      - id: txn.acid-guarantees
        title: ACID Guarantees
        summary: What atomicity, consistency, isolation, and durability specifically mean on an immutable, versioned storage layer.
        requires: [architecture.three-layer-model]
      - id: txn.snapshot-isolation
        title: Snapshot Isolation
        summary: Every statement or transaction sees a consistent point-in-time view of the table without blocking readers or writers.
        requires: [txn.acid-guarantees]
      - id: txn.mvcc-immutable-partitions
        title: MVCC via Immutable Micro-partitions
        summary: A write never mutates a micro-partition in place; it produces a new table version referencing new and unchanged partitions.
        requires: [storage.micro-partition-format, txn.snapshot-isolation]
      - id: txn.optimistic-concurrency-conflicts
        title: Optimistic Concurrency & Write Conflicts
        summary: Two concurrent writers to overlapping data detect conflict at commit time rather than locking rows up front.
        requires: [txn.mvcc-immutable-partitions]
      - id: txn.ddl-as-transaction
        title: DDL as a Transaction
        summary: Why schema changes are atomic and instantaneous from a reader's perspective, layered on the same metadata versioning as DML.
        requires: [metadata.ddl-metadata-versioning]
      - id: txn.multi-statement-transactions
        title: Multi-statement Transactions
        summary: Explicit BEGIN/COMMIT scoping across multiple statements, autocommit default, and where implicit transactions bite.
        requires: [txn.snapshot-isolation]

  - id: continuity
    order: 9
    title: Time Travel, Fail-safe & Cloning
    summary: Recovering from mistakes and forking environments cheaply, because the storage layer never overwrites anything in place.
    children:
      - id: continuity.retention-vs-failsafe
        title: Time Travel vs Fail-safe
        summary: The default 1-day (up to 90-day, Enterprise+) queryable retention window versus the following non-queryable 7-day Fail-safe recovery window, and who can invoke each.
        requires: [txn.mvcc-immutable-partitions]
      - id: continuity.at-before-statement-syntax
        title: AT / BEFORE Query Syntax
        summary: Querying a table as of a timestamp, offset, or statement id, and what determines whether the referenced version still exists.
        requires: [continuity.retention-vs-failsafe]
      - id: continuity.undrop-recovery
        title: UNDROP Recovery
        summary: Restoring a dropped table, schema, or database within its retention window as a metadata operation, not a restore-from-backup.
        requires: [continuity.retention-vs-failsafe]
      - id: continuity.zero-copy-clone
        title: Zero-copy Clone
        summary: Cloning a table, schema, or database by copying only the metadata pointer to existing micro-partitions, not the bytes.
        requires: [continuity.retention-vs-failsafe]
      - id: continuity.clone-storage-billing
        title: Clone Storage Billing
        summary: Why a clone costs nothing until it diverges, and how divergence (new writes on either side) starts accruing storage.
        requires: [continuity.zero-copy-clone]
      - id: continuity.replication-and-failover
        title: Database Replication & Failover
        summary: Continuously replicating a database's data and metadata to another region or cloud, and promoting a secondary on failover.
        requires: [metadata.foundationdb-role]
      - id: continuity.client-redirect
        title: Client Redirect
        summary: A connection-level DNS/URL indirection that lets client drivers follow an account failover without reconfiguration.
        requires: [continuity.replication-and-failover]

  - id: semistructured
    order: 10
    title: Semi-structured Data
    summary: Treating JSON/Avro/Parquet as first-class columnar data instead of an opaque blob.
    children:
      - id: semistructured.variant-type-storage
        title: VARIANT Type & Storage
        summary: How JSON/Avro/Parquet/XML is parsed once at load time into a self-describing columnar representation inside the same micro-partition format.
        requires: [storage.micro-partition-format]
      - id: semistructured.schema-on-read-parsing
        title: Schema-on-read Parsing
        summary: Extracting typed columns from VARIANT at query time via path expressions, and the type-inference cost that implies.
        requires: [semistructured.variant-type-storage]
      - id: semistructured.flatten-lateral-joins
        title: FLATTEN & Lateral Joins
        summary: Exploding nested arrays or objects into rows with FLATTEN, and why it requires a LATERAL join.
        requires: [semistructured.variant-type-storage]
      - id: semistructured.schema-evolution-tables
        title: Schema Evolution on Semi-structured Sources
        summary: Letting a table's columns grow as new fields appear in ingested JSON/Parquet, and the compatibility rules that govern it.
        requires: [semistructured.variant-type-storage]

  - id: ingestion
    order: 11
    title: Data Loading & Ingestion
    summary: Getting bytes from outside the platform into a table, at batch, micro-batch, and row-level latency.
    children:
      - id: ingestion.bulk-copy-into
        title: Bulk Loading (COPY INTO)
        summary: Batch file loading from a stage, load metadata that prevents reloading the same file twice, and parallelism across files.
        requires: [storage.table-types]
      - id: ingestion.file-formats-and-stages
        title: File Formats & Stages
        summary: Internal vs external stages, named file formats, and how COPY INTO uses both to parse incoming files.
        requires: [ingestion.bulk-copy-into]
      - id: ingestion.snowpipe-auto-ingest
        title: Snowpipe Auto-ingest
        summary: Event-notification-triggered, serverless micro-batch loading of files as they land in a stage, at minute-level latency.
        requires: [ingestion.file-formats-and-stages]
      - id: ingestion.snowpipe-streaming-offset-tokens
        title: Snowpipe Streaming & Offset Tokens
        summary: Row-level, channel-based ingestion with client-supplied offset tokens providing exactly-once semantics without a staged file.
        requires: [ingestion.snowpipe-auto-ingest]
      - id: ingestion.datastream-kafka-compatible
        title: Datastream (Kafka Wire-compatible Ingestion)
        summary: A native streaming service that speaks the Kafka wire protocol directly into a table, inheriting RBAC, lineage, and Time Travel.
        requires: [ingestion.snowpipe-streaming-offset-tokens]
      - id: ingestion.external-tables-over-lake
        title: External Tables over a Data Lake
        summary: Querying files in place in object storage without loading them, and the metadata refresh that keeps the external table current.
        requires: [storage.object-storage-backend]
      - id: ingestion.unload-export
        title: Unloading Data (COPY INTO location)
        summary: Exporting query results or table data back to a stage as files, and the format/compression choices that affect downstream consumers.
        requires: [ingestion.bulk-copy-into]

  - id: pipelines
    order: 12
    title: Streams, Tasks & Dynamic Tables
    summary: Snowflake-native change capture and orchestration, from a raw offset bookmark to a declarative freshness SLA.
    children:
      - id: pipelines.stream-offset-bookmark
        title: Streams as Offset Bookmarks
        summary: A Stream is a pointer into a table's version history, not a copy of data; querying it returns the net change since the last consumption.
        requires: [txn.mvcc-immutable-partitions]
      - id: pipelines.stream-types
        title: Stream Types (Standard / Append-only / Insert-only)
        summary: What each stream type tracks — all DML vs inserts-only vs inserts on immutable sources — and when to pick which.
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.stream-consumption-and-offset-advance
        title: Offset Advance Only Inside the Consuming DML
        summary: Why the offset moves only when a transaction that reads the Stream also commits, making a crashed consumer retry the exact same change set.
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.stream-staleness-and-retention-extension
        title: Stream Staleness & Retention Extension
        summary: What makes a Stream stale (unconsumed past the source table's retention) and the automatic retention extension that delays it.
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.task-scheduling-cron-and-dag
        title: Task Scheduling & DAGs
        summary: CRON- or interval-scheduled Tasks composed into a dependency graph (task graph) of up to 100 tasks.
        requires: [pipelines.stream-offset-bookmark]
      - id: pipelines.task-conditional-execution
        title: Conditional Task Execution
        summary: Using SYSTEM$STREAM_HAS_DATA() to skip a Task run entirely when its upstream Stream is empty.
        requires: [pipelines.task-scheduling-cron-and-dag]
      - id: pipelines.task-serverless-vs-warehouse
        title: Serverless vs Warehouse-backed Tasks
        summary: Letting Snowflake auto-size compute per run (serverless) versus binding a Task to a fixed warehouse, and the cost/latency trade it implies.
        requires: [pipelines.task-scheduling-cron-and-dag, warehouse.sizing-t-shirt]
      - id: pipelines.task-failure-handling
        title: Task Failure Handling
        summary: SUSPEND_TASK_AFTER_NUM_FAILURES, retry attempts, and how a DAG behaves when one node fails — does the branch stop or does the whole graph?
        requires: [pipelines.task-scheduling-cron-and-dag]
      - id: pipelines.dynamictable-target-lag
        title: Dynamic Tables & TARGET_LAG
        summary: Declaring a freshness SLA instead of hand-writing the Stream+Task+MERGE that used to implement it, and how the scheduler derives a refresh cadence from it.
        requires: [pipelines.stream-offset-bookmark, pipelines.task-scheduling-cron-and-dag]
      - id: pipelines.dynamictable-incremental-vs-full-refresh
        title: Incremental vs Full Refresh
        summary: When a Dynamic Table can compute its next state from just the delta versus needing to recompute from scratch.
        requires: [pipelines.dynamictable-target-lag]
      - id: pipelines.dynamictable-adaptive-refresh
        title: Adaptive Refresh
        summary: Detecting an upstream change large enough that incremental refresh would be slower than reinitializing, and switching strategy automatically.
        requires: [pipelines.dynamictable-incremental-vs-full-refresh]

  - id: security
    order: 13
    title: Security & Governance
    summary: Who can authenticate, what they can then see, and how both facts are proven after the fact.
    children:
      - id: security.authn-mfa-sso
        title: Authentication (MFA, SSO, Key-pair)
        summary: Password/MFA, federated SSO (SAML/OAuth), and key-pair authentication as alternatives with different bot/automation fit.
        requires: [architecture.cloud-services-layer]
      - id: security.rbac-role-hierarchy
        title: RBAC Role Hierarchy
        summary: Roles as a DAG (not a tree) that privileges flow up through via inheritance, and why a role can have multiple parents.
        requires: [metadata.foundationdb-role]
      - id: security.rbac-ownership-and-grants
        title: Ownership & Grant Propagation
        summary: OWNERSHIP as the privilege that includes all others, GRANT/REVOKE propagation, and future grants on a schema.
        requires: [security.rbac-role-hierarchy]
      - id: security.network-policies-private-connectivity
        title: Network Policies & Private Connectivity
        summary: IP allow/block lists at account or user scope, and cloud-native private connectivity (PrivateLink/Private Service Connect) that avoids the public internet entirely.
        requires: [security.authn-mfa-sso]
      - id: security.encryption-key-hierarchy
        title: Encryption Key Hierarchy
        summary: The tiered key structure (root -> account -> table -> file) and automatic key rotation/rekeying, all invisible to the user.
        requires: [architecture.cloud-services-layer]
      - id: security.row-access-policies
        title: Row Access Policies
        summary: Attaching a row-filtering predicate to a table so different roles see different subsets of the same rows, evaluated at query time.
        requires: [security.rbac-role-hierarchy]
      - id: security.column-masking-policies
        title: Dynamic Data Masking
        summary: Attaching a masking function to a column so its unmasked value is visible only to roles the policy allows.
        requires: [security.rbac-role-hierarchy]
      - id: security.data-classification-and-tagging
        title: Data Classification & Object Tagging
        summary: Automatic sensitive-data classification and tag-based policy attachment, so masking/row policies can be applied at scale instead of per-column.
        requires: [security.column-masking-policies]
      - id: security.data-lineage-and-access-history
        title: Data Lineage & Access History
        summary: Tracing a column's provenance through views and CTAS, and ACCESS_HISTORY as the audit trail of who actually read or wrote which columns.
        requires: [security.rbac-role-hierarchy]
      - id: security.trust-center-posture
        title: Trust Center Security Posture
        summary: A built-in scanner surfacing misconfigurations (public network policy, excess grants) as a prioritized risk list rather than needing an external tool.
        requires: [security.network-policies-private-connectivity]

  - id: sharing
    order: 14
    title: Data Sharing & Collaboration
    summary: Giving another account (or the public) access to live data without copying it.
    children:
      - id: sharing.secure-data-sharing-mechanics
        title: Secure Data Sharing Mechanics
        summary: Granting another account read access to live micro-partitions via metadata pointers — no data copy, no ETL, and the consumer always sees current data.
        requires: [metadata.foundationdb-role, security.rbac-role-hierarchy]
      - id: sharing.data-marketplace-listings
        title: Data Marketplace Listings
        summary: Publishing a share as a discoverable listing (free or monetized) versus a private direct share to a named account.
        requires: [sharing.secure-data-sharing-mechanics]
      - id: sharing.reader-accounts
        title: Reader Accounts
        summary: Letting an organization without its own Snowflake account consume a share through a provider-managed, billed-to-provider account.
        requires: [sharing.secure-data-sharing-mechanics]
      - id: sharing.clean-rooms-privacy
        title: Data Clean Rooms
        summary: Letting two parties compute joins or aggregates over each other's data under a governed policy without either seeing the other's raw rows.
        requires: [sharing.secure-data-sharing-mechanics]

  - id: openplatform
    order: 15
    title: Open Formats & Workload Expansion
    summary: Where the platform stops being a closed warehouse — open table formats, external engines, and OLTP workloads.
    children:
      - id: openplatform.iceberg-tables
        title: Iceberg Tables
        summary: Storing Snowflake-managed data in the open Iceberg format in customer-owned object storage, queryable by external engines.
        requires: [storage.object-storage-backend]
      - id: openplatform.polaris-catalog
        title: Polaris (Open Catalog)
        summary: An open-source, engine-agnostic REST catalog for Iceberg tables, decoupling who wrote the table from who can query it.
        requires: [openplatform.iceberg-tables]
      - id: openplatform.external-engine-commit-protocol
        title: External Engine Writes & Commit Protocol
        summary: The write-data, then atomically-update-catalog-pointer, then commit-governance-metadata sequence that lets a non-Snowflake engine write an Iceberg table safely.
        requires: [openplatform.polaris-catalog, txn.snapshot-isolation]
      - id: openplatform.hybrid-tables-oltp
        title: Hybrid Tables (Unistore)
        summary: A row-store table type with enforced primary keys and row locks for millisecond point lookups, asynchronously mirrored into the columnar store for analytics.
        requires: [metadata.foundationdb-role, storage.table-types]
      - id: openplatform.snowflake-postgres
        title: Snowflake Postgres
        summary: A managed, wire-compatible Postgres instance inside the platform for OLTP workloads that need transaction semantics Hybrid Tables don't provide.
        requires: [openplatform.hybrid-tables-oltp]
      - id: openplatform.snowpark-udf-udtf
        title: Snowpark UDFs & UDTFs
        summary: Running user code (Python/Java/Scala) inside the warehouse's sandbox as scalar or table functions, and the per-row invocation overhead that implies.
        requires: [architecture.cloud-services-layer]
      - id: openplatform.stored-procedure-sandboxing
        title: Stored Procedure Sandboxing
        summary: Isolation boundaries around user-supplied procedure code, and why it can't reach the network or filesystem by default.
        requires: [openplatform.snowpark-udf-udtf]

