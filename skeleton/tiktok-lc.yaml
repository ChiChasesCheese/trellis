- id: python
  order: 1
  title: Python 面试工具箱
  summary: 刷题时最常用的标准库与写法：什么时候用、复杂度多少、哪里会踩坑。
  core: true
  children:
  - id: python.collections
    title: collections：Counter、defaultdict、deque、OrderedDict
    summary: 计数、分组、双端队列、有序字典在面试题里的地道用法，以及它们各自的复杂度和坑（Counter 相减丢负数、defaultdict 读也会插入、deque 随机访问是 O(n)）。
  - id: python.heapq
    title: heapq：最小堆、Top-K、多路归并
    summary: heapq 只有最小堆：最大堆取负、元组比较与平局、heapify 是 O(n)、nlargest/nsmallest、merge 多路归并、懒删除；什么时候堆不如排序或 quickselect。
  - id: python.bisect-sorted
    title: bisect 与有序容器
    summary: bisect_left/right 的语义与边界、key 参数、在有序列表上维护插入的代价；sortedcontainers.SortedList 在 LeetCode 可用时的 O(log n) 增删查。
  - id: python.itertools-functools
    title: itertools 与 functools
    summary: accumulate 做前缀和、pairwise、groupby 的前提、product/combinations/permutations、chain、islice；functools.cache 记忆化、reduce、cmp_to_key 自定义排序。
  - id: python.idioms
    title: 地道的 Python 写法
    summary: 解包与交换、enumerate/zip、推导式与生成器表达式、海象运算符、切片与反转、sorted 的 key 与稳定性、字符串 join、any/all、divmod、math.inf 与哨兵值。
  - id: python.pitfalls
    title: Python 刷题的性能与正确性陷阱
    summary: 递归深度上限（sys.setrecursionlimit 与改迭代）、[[0]*n]*m 的别名、可变默认参数、list.pop(0)、字符串反复拼接、浮点比较、整数除法与负数取整、大输入下的常数。
  - id: python.recursion-memo
    title: 递归、记忆化与迭代改写
    summary: '@cache 记忆化搜索的写法与内存、cache_clear、把递归 DFS 改写成显式栈、nonlocal 与闭包、生成器递归。'
  - id: python.dp-space-compression
    title: DP 降维：滚动数组与空间压缩
    summary: 题目卡片里的二维 DP 一律用完整的二维表；这里集中学怎样把它压成一维：依赖方向决定能否降维、两行滚动、单行原地、0-1 背包倒序与完全背包正序、左上角依赖要多存一个变量、什么时候不该降维。
  - id: python.classes-design
    title: 设计题的 Python 写法
    summary: 类设计题（LRU、迭代器、数据流）里的 __init__ 组织、dataclass、__slots__、__lt__ 让对象进堆、OrderedDict 实现 LRU、类型注解让代码更清楚。
