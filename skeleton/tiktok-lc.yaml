  children:
  - id: patterns.signals
    title: 从题面信号到模式：总览
    summary: 看到数据范围、输入形态、问法（最值 / 计数 / 存在性 / 构造）时分别该想到什么；n 的大小倒推复杂度。
  - id: patterns.hashing
    title: 哈希：查找、计数与分组
    summary: 补数查找、频次统计、签名分组、去重；什么时候用 set、dict、Counter；哈希的代价与有序需求。
  - id: patterns.prefix-sum
    title: 前缀和与差分
    summary: '前缀和 + 哈希求子数组和、前缀异或、二维前缀和、差分数组做区间加；为什么要先放入 {0: 1}。'
  - id: patterns.two-pointers
    title: 双指针
    summary: 相向双指针（有序数组、夹逼）、同向快慢指针（去重、链表环）、分区；正确性来自哪个单调性。
  - id: patterns.sliding-window
    title: 滑动窗口
    summary: 可变窗口求最长 / 最短、固定窗口、「至多 k 个」减「至多 k-1 个」得「恰好 k 个」；窗口能用的前提是单调性。
  - id: patterns.monotonic-stack
    title: 单调栈与单调队列
    summary: 下一个更大 / 更小元素、柱状图最大矩形、接雨水、滑动窗口最大值；每个元素进出一次所以 O(n)。
  - id: patterns.binary-search
    title: 二分查找：在下标上与在答案上
    summary: 左闭右开模板、旋转数组、找边界；对答案二分（最小化最大值、能否在 x 内完成）的判断条件与单调性。
  - id: patterns.heap-patterns
    title: 堆：Top-K、多路归并与双堆
    summary: Top-K 用大小为 k 的堆、K 路归并、双堆求中位数、按时间调度（会议室、任务）；懒删除。
  - id: patterns.intervals-sweep
    title: 区间与扫描线
    summary: 按左端点排序合并、按右端点排序的贪心选择、扫描线计数重叠、差分数组；端点相等时的处理。
  - id: patterns.linked-list
    title: 链表技巧
    summary: 哑节点、快慢指针找中点与环、原地反转、合并与拆分、深拷贝带随机指针；画图防止断链。
  - id: patterns.tree-dfs
    title: 二叉树 DFS：返回值与全局量
    summary: 后序返回子树信息（高度、路径和、是否平衡）、前序带参数下传、用全局最优记录跨节点路径；LCA 的三种情况。
  - id: patterns.tree-bfs-bst
    title: 二叉树 BFS 与 BST 性质
    summary: 层序遍历、按层统计、右视图；BST 中序有序、上下界验证、第 k 小、序列化与反序列化。
  - id: patterns.graph-traversal
    title: 图与网格的 BFS / DFS
    summary: 建图方式、网格四邻域、多源 BFS、最短步数用 BFS、连通分量计数、访问标记放在入队时。
  - id: patterns.topo-sort
    title: 拓扑排序
    summary: Kahn 入度法与 DFS 三色法、环检测、按字典序或分层输出、课程表与外星字典。
  - id: patterns.union-find
    title: 并查集
    summary: 路径压缩 + 按秩合并、连通分量、动态加边、等价关系；和 BFS/DFS 的取舍。
  - id: patterns.shortest-path
    title: 最短路：Dijkstra 与其变体
    summary: 非负权 Dijkstra 的堆实现、0-1 BFS、带状态的最短路（剩余次数、方向）、Bellman-Ford 限制边数。
  - id: patterns.backtracking
    title: 回溯
    summary: 子集、组合、排列、分割、N 皇后的统一模板；选择 / 撤销、剪枝、去重（排序后跳过同层相同值）。
  - id: patterns.dp-linear
    title: 动态规划：线性与状态机
    summary: 爬楼梯、打家劫舍、最大子数组、买卖股票的状态机；定义状态、转移、初值、遍历顺序四步。
  - id: patterns.dp-grid-string
    title: 动态规划：网格、双串与区间
    summary: 路径计数、最长公共子序列、编辑距离、回文子串、区间 DP；二维状态的空间压缩。
  - id: patterns.dp-knapsack
    title: 动态规划：背包与计数
    summary: 0-1 背包与完全背包的遍历方向、组合数与排列数的区别、零钱兑换、目标和；记忆化搜索与递推的互换。
  - id: patterns.greedy
    title: 贪心
    summary: 交换论证、按某个键排序后一次扫描、跳跃游戏、分发糖果；怎样判断贪心是否成立、什么时候要退回 DP。
  - id: patterns.trie
    title: 字典树
    summary: 前缀查询、单词搜索 II、按前缀自动补全、异或最大值的位字典树；用 dict 嵌套的 Python 写法。
  - id: patterns.design
    title: 数据结构设计题
    summary: LRU / LFU、带过期的缓存、时间相关的键值存储、随机集合 O(1)、迭代器设计；先定接口与复杂度目标。
  - id: patterns.string-parsing
    title: 字符串处理与表达式解析
    summary: 计算器（栈处理优先级与括号）、解码字符串、比较版本号、KMP / 滚动哈希的使用场景。
  - id: patterns.math-bit-sim
    title: 数学、位运算与模拟
    summary: 取模与溢出、最大公约数、快速幂、位运算技巧（lowbit、异或去重）、矩阵螺旋与旋转、按规则模拟。
