    - id: b.distributed.multi-region
      title: 多区域：数据驻留与归属区域写入（Multi-Region, Home Region）
      summary: 跨区域部署时写到哪里，延迟和合规怎么取舍。
  - id: b.scenario
    title: 场景题
    summary: 把基础知识放进一个业务系统：秒杀、直播、排行榜、短链、消息可靠下发、海量数据。
    children:
    - id: b.scenario.short-link
      title: 短链接系统设计（ID 生成、跳转、热点）
      summary: 短链接：长短链映射、ID 生成与 Base62、重定向、热点缓存与防穷举。
    - id: b.scenario.follow-feed
      title: 关注关系与 Feed 流（大 V 问题）
      summary: 关注关系存储与 Feed 流：推模式、拉模式与混合，大 V 问题。
    - id: b.scenario.im-delivery
      title: IM 与消息可靠下发（断网重连、去重、群聊通知）
      summary: IM 与消息可靠下发：消息 ID、ack、离线存储、去重、顺序与群聊扩散。
    - id: b.scenario.delayed-task
      title: 定时调度与订单超时自动取消
      summary: 定时调度与延时任务：时间轮、延迟队列、分布式调度、订单超时取消与幂等。
    - id: b.scenario.massive-data-topk
      title: 海量数据：Top K、去重、中位数与外部排序
      summary: 海量数据题：分治、哈希分桶、堆、位图、外部排序求 Top K、去重与中位数。
    - id: b.scenario.distributed-kv
      title: 分布式 KV / 分布式缓存 / 文件存储设计（分片、副本、故障）
      summary: 分布式 KV / 缓存 / 文件存储设计：分片、副本、故障转移、范围查询与数据丢失风险。
    - id: b.scenario.api-security
      title: 接口安全与鉴权：JWT、SSO、密码存储、防刷与防抓包
      summary: 接口安全与鉴权：JWT、SSO、密码存储（加盐慢哈希）、防刷与防抓包。
    - id: b.scenario.oral-playbook
      title: 八股面的节奏与答不出来时怎么说
      summary: 八股面的一小时怎么走：先说判断顺序，再展开机制、数字与取舍；答不出来时怎么说。
    - id: b.scenario.ledger-design
      title: 复式账本：借贷分录、余额派生与不可变（Double-Entry Ledger）
      summary: 账本怎么建模，为什么余额是算出来的。
    - id: b.scenario.card-tokenization-pci
      title: 卡号令牌化与 PCI 范围（Tokenization, PCI DSS）
      summary: 怎么让绝大多数系统碰不到卡号。
    - id: b.scenario.request-signing-keys
      title: 请求签名与密钥轮换（HMAC, KMS, HSM）
      summary: 接口和回调怎么防伪造、防重放，密钥怎么换。
    - id: b.scenario.webhook-ssrf
      title: Webhook 的 SSRF 防护（SSRF for Merchant URLs）
      summary: 商户填的回调地址为什么危险。
    - id: b.scenario.waiting-room
      title: 排队室与抽签准入（Waiting Room, Lottery）
      summary: 秒杀时怎么在入口削峰，并公平地放人。
    - id: b.scenario.timeseries-cardinality
      title: 时序基数与降采样（Cardinality, Downsampling）
      summary: 监控系统为什么怕高基数，分位数怎么聚合。
    - id: b.scenario.matchmaking-clock
      title: 匹配与服务端时钟（Elo Matchmaking, Server Clock）
      summary: 实时对战怎么匹配，时间由谁说了算。
  - id: b.agent
    title: Agent 与 RAG
    summary: Agent 循环与工具、记忆与上下文、Harness、评测、安全；RAG 流水线、向量索引与 LLM 应用工程。
    children:
    - id: b.agent.context-compression
      title: 上下文工程与压缩：Token 预算、裁剪、隔离
      summary: 上下文工程：Token 预算分配、裁剪、摘要压缩、子 Agent 隔离与结构化笔记。
    - id: b.agent.harness
      title: Harness Engineering：Agent = Model + Harness，断点续跑
      summary: Harness Engineering：任务状态、工具反馈、验证与错误恢复，断点续跑。
    - id: b.agent.multi-agent-workflow
      title: 多 Agent 协作与 Workflow / Graph 编排
      summary: 多 Agent 协作的编排模式、状态共享、冲突与失败恢复，Workflow/Graph/Loop 的关系。
    - id: b.agent.eval
      title: Agent 与 LLM 应用评测：Golden Set、LLM-as-Judge、回归
      summary: Agent 与 LLM 应用评测：Golden Set、三类 grader、LLM-as-Judge、回归与线上灰度。
    - id: b.agent.safety-sandbox
      title: Agent 安全：Prompt 注入、权限与沙箱
      summary: Agent 安全：Prompt 注入、权限最小化、沙箱隔离与审计。
    - id: b.agent.rag-vector-index
      title: 向量索引与向量数据库：Embedding、HNSW、IVF、千亿向量
      summary: Embedding 与向量检索，HNSW、IVF 等 ANN 索引取舍，向量库选型与千亿向量。
    - id: b.agent.rag-eval-update
      title: RAG 评测与知识库更新
      summary: RAG 评测（检索质量与生成质量分开）与知识库更新（增量、重建、版本）。
    - id: b.agent.llm-api-gateway
      title: LLM 调用工程：流式、限流（RPM/TPM）、结构化输出与模型网关
      summary: LLM 调用工程：流式 SSE、限流（RPM/TPM）、可重试错误、结构化输出与模型网关。
    - id: b.agent.llm-basics
      title: LLM 运行机制：Token、上下文窗口、采样参数与幻觉
      summary: Token、上下文窗口、Temperature/Top-P、幻觉与 Lost in the Middle。
