    children:
    - id: a.redis.single-thread-fast
      title: Redis 单线程为什么快（Single Thread, I/O Multiplexing）与为什么选 Redis
      summary: Redis 命令执行是单线程，快在内存、I/O 多路复用和简单数据结构；6.0 起网络 I/O 可多线程。
      core: true
    - id: a.redis.zset-skiplist
      title: ZSet 与跳表（Skip List）
      summary: ZSet 由跳表加哈希表实现，支持按分数范围和排名查询，是排行榜的基础。
      core: true
    - id: a.redis.rdb-aof
      title: RDB、AOF 与混合持久化（Persistence）
      summary: RDB 快照与 AOF 日志的原理、写回策略、重写与混合持久化，决定宕机时丢多少数据。
      core: true
    - id: a.redis.expire-eviction
      title: 过期键删除与内存淘汰（Expiration & Eviction，含 LRU/LFU）
      summary: 过期键的惰性加定期删除，内存满时按 maxmemory-policy 淘汰（LRU/LFU/TTL/随机）。
      core: true
    - id: a.redis.ha-overview
      title: 主从、哨兵与 Cluster 怎么保证高可用（High Availability）
      summary: 主从、哨兵、Cluster 三层高可用的职责与异步复制带来的丢写风险。
      core: true
  - id: a.mysql
    title: MySQL
    summary: 索引、事务与锁、日志、SQL 优化、分库分表、主从。
    children:
    - id: a.mysql.bplus-tree
      title: 为什么 MySQL 索引用 B+ 树（B+ Tree vs Hash/BST/B Tree）
      summary: B+ 树高扇出、叶子链表适合范围查询，是 InnoDB 索引选择它的原因。
      core: true
    - id: a.mysql.leftmost-index-failure
      title: 联合索引、最左前缀与索引失效（含索引设计）
      summary: 联合索引遵循最左前缀，函数、隐式转换、左模糊、OR 等会使索引失效；索引顺序怎么设计。
      core: true
    - id: a.mysql.isolation-levels
      title: 四个事务隔离级别与 ACID（Isolation Levels）
      summary: 四个隔离级别解决脏读、不可重复读、幻读的不同层次，InnoDB 默认可重复读。
      core: true
    - id: a.mysql.mvcc
      title: MVCC：隐藏列、undo 链与 ReadView
      summary: MVCC 用隐藏列、undo 链和 ReadView 实现无锁一致性读，RC 与 RR 的 ReadView 生成时机不同。
      core: true
    - id: a.mysql.gap-deadlock
      title: 间隙锁、next-key 锁与死锁排查（Gap Lock, Deadlock）
      summary: 间隙锁与 next-key 锁在 RR 下防幻读，范围更新易死锁；死锁排查与避免。
      core: true
    - id: a.mysql.redo-undo-binlog
      title: redo log、undo log、binlog 与两阶段提交（含 Buffer Pool）
      summary: redo log 保证崩溃恢复，undo log 支撑回滚与 MVCC，binlog 用于复制，两阶段提交保证两者一致。
      core: true
    - id: a.mysql.slow-sql-triage
      title: 一条 SQL 变慢怎么排查与优化（Slow Query）
      summary: 慢 SQL 的排查路径：慢日志、EXPLAIN、索引与改写、数据量与锁等待。
      core: true
    - id: a.mysql.sharding
      title: 分库分表：时机、分片键、全局 ID 与迁移（Sharding）
      summary: 什么时候分库分表、怎么选分片键与算法、全局 ID、跨分片查询与平滑迁移。
      core: true
  - id: a.cache
