      core: true
    - id: a.mq.no-loss
      title: 消息不丢失：生产端、Broker、消费端三端（Reliability）
      summary: 消息不丢要生产端 acks=all、Broker 副本与 min.insync、消费端先处理后提交位移三端同时保证。
      core: true
    - id: a.mq.backlog
      title: 消息积压怎么办（Message Backlog）
      summary: 消息积压的止血、定位根因与扩容消费（含分区不足时的临时转发）。
