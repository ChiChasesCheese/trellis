      summary: 用 EXPLAIN 看 type、key、rows、Extra 判断查询是否高效。
    - id: b.mysql.phantom-read
      title: 幻读与 RR 下怎么解决（Phantom Read）
      summary: 幻读在 RR 下靠 MVCC（快照读）加 next-key lock（当前读）解决，但仍有特例。
    - id: b.mysql.lock-types
      title: MySQL 锁分类：表锁、元数据锁、意向锁、行锁与乐观/悲观锁
      summary: 全局锁、表锁、元数据锁、意向锁、行锁与乐观锁/悲观锁的区别。
    - id: b.mysql.deep-pagination
      title: 深分页为什么慢、怎么优化（Deep Pagination, Keyset）
      summary: LIMIT 大偏移扫描并丢弃大量行，用游标分页、延迟关联或覆盖索引优化。
    - id: b.mysql.replication-lag
      title: 读写分离、主从延迟与读到旧数据（Replication Lag）
      summary: 主从复制延迟的成因、读写分离下读到旧数据的应对。
    - id: b.mysql.count-ddl
      title: count(*) 为什么慢，大表怎么加字段（Online DDL）
      summary: count(*) 为什么慢、怎么近似或维护计数；大表加字段用在线 DDL 工具。
    - id: b.mysql.exec-flow-engines
      title: 一条 SQL 的执行流程与存储引擎（Executor, InnoDB vs MyISAM）
      summary: 一条 SQL 从连接器到执行器的流程，InnoDB 与 MyISAM 的区别。
    - id: b.mysql.sql-handwrite
      title: SQL 手撕与常见写法（分组、连接、窗口函数）
      summary: 手写 SQL 的常见题型：分组过滤、多表连接、窗口函数、行转列。
    - id: b.mysql.schema-money-backup
      title: 表设计规范：金额、时间、范式与外键；备份与冷热分离
      summary: 表设计规范：金额用 DECIMAL 或整数分、时间类型、外键取舍；备份与冷热分离。
  - id: b.cache
    title: 缓存问题
    summary: 缓存与数据库一致性、穿透击穿雪崩、热 key 大 key、多级缓存、LRU。
    children:
    - id: b.cache.bloom-filter
      title: 布隆过滤器原理与误判（Bloom Filter）
      summary: 布隆过滤器用位数组加多个哈希，不会漏判但会误判，不能删除。
    - id: b.cache.breakdown
      title: 缓存击穿（Hotspot Invalid）：互斥重建、逻辑过期、singleflight
      summary: 热点 key 过期瞬间大量请求击穿到数据库，用互斥重建、逻辑过期或永不过期解决。
    - id: b.cache.avalanche
      title: 缓存雪崩（Cache Avalanche）
      summary: 大量 key 同时过期或缓存整体故障，请求涌向数据库；TTL 加随机、多级缓存、限流降级。
    - id: b.cache.big-key
      title: 大 key 的危害与处理（Big Key）
      summary: 大 key 的危害（阻塞、网络、迁移）与拆分、压缩、UNLINK 渐进删除。
    - id: b.cache.multilevel
      title: 多级缓存设计与冷启动（Local + Redis, Cold Start）
      summary: 本地缓存加 Redis 加数据库的多级缓存设计、短 TTL、失效广播与冷启动。
    - id: b.cache.hit-rate
      title: 缓存命中率与容量估算
      summary: 缓存命中率与容量估算：数据库压力 = QPS × (1 − 命中率)。
    - id: b.cache.lru
      title: LRU 缓存的实现（LRU Cache, LinkedHashMap, TTL, LFU）
      summary: LRU 的数据结构（哈希表加双向链表）与 Redis 的近似 LRU / LFU；手写编码题已由 LeetCode 与 LLD 题库覆盖。
  - id: b.mq
    title: 消息队列
    summary: Kafka 为主，RabbitMQ / RocketMQ 对照：可靠性、顺序、积压、重试、延迟消息。
    children:
    - id: b.mq.kafka-throughput
      title: Kafka 为什么吞吐这么高（顺序写、零拷贝、批量、压缩）
      summary: 顺序写、page cache、零拷贝、批量与压缩让 Kafka 吞吐极高。
    - id: b.mq.partition-count
      title: 分区数怎么确定（Partition Count）
      summary: 分区数按目标吞吐除以单分区吞吐估算，只增不减，改分区会打乱 key 映射。
    - id: b.mq.no-duplicate
      title: 重复消费与恰好一次（Exactly Once）
      summary: 消息至少一次投递导致重复，消费端幂等；Kafka 恰好一次只覆盖 Kafka 内部。
    - id: b.mq.rebalance
      title: 消费者组重平衡（Rebalance）为什么卡、怎么避免
      summary: 消费者组重平衡的触发条件、为什么会卡顿，以及静态成员、协作式分配和控制处理时长来避免。
    - id: b.mq.dlq-retry
      title: 死信队列与重试设计（Dead Letter Queue）
      summary: 分级重试 topic 加死信 topic，要可告警、可回放，并防止重试风暴。
    - id: b.mq.delay-message
      title: 延迟消息怎么实现（Delayed Message）
      summary: 延迟消息的实现：RabbitMQ TTL+DLX、RocketMQ 定时消息、时间轮、分级 topic。
    - id: b.mq.selection
      title: Kafka、RabbitMQ、RocketMQ 怎么选（含 RocketMQ 架构）
      summary: Kafka、RabbitMQ、RocketMQ 的定位与选型，含 RocketMQ 的架构与事务消息。
    - id: b.mq.why-mq
      title: 为什么用消息队列：削峰、解耦、异步与代价（Why MQ）
      summary: 用 MQ 的收益（削峰、解耦、异步）与代价（可用性、一致性、复杂度）。
    - id: b.mq.rabbitmq
      title: RabbitMQ 模型与可靠性（Exchange, Confirm, Ack）
      summary: RabbitMQ 的 Exchange、Queue、Binding、ack 与 confirm，以及可靠性与高可用。
  - id: b.idem
    title: 幂等与分布式事务
    summary: 幂等键、支付幂等、2PC / TCC / SAGA / outbox / 事务消息与对账。
    children:
    - id: b.idem.two-pc-at
      title: 2PC / 3PC / XA 与 Seata AT 模式
      summary: 2PC/3PC/XA 的阻塞与单点问题，Seata AT 模式用前后镜像与全局锁自动回滚。
    - id: b.idem.saga
      title: SAGA：本地事务序列与补偿
      summary: Saga 把长事务拆成本地事务序列，失败时按反序补偿，缺少隔离性。
    - id: b.idem.tx-message
      title: 事务消息（半消息）怎么工作
      summary: 事务消息（半消息）：先发半消息，执行本地事务后提交或回滚，Broker 回查。
  - id: b.protect
    title: 服务保护
    summary: 限流、熔断、降级、重试、超时、隔离与流量突增。
    children:
    - id: b.protect.why-protect
      title: 为什么要做服务保护：雪崩与重试放大（Cascading Failure）
      summary: 过载会引发雪崩：慢请求占满线程、重试放大流量；服务保护要在入口、依赖与资源三层设防。
    - id: b.protect.distributed-limit
      title: 分布式限流怎么实现（Redis + Lua、本地配额）
      summary: 分布式限流：Redis+Lua 计数、本地配额分片、网关层限流。
    - id: b.protect.limiter-handwrite
      title: 手写限流器（令牌桶 / 滑动窗口）
      summary: 手写令牌桶或滑动窗口限流器的细节；完整追问链已并入「限流算法」的最后一层。
    - id: b.protect.breaker
      title: 熔断器的三态与触发条件（Circuit Breaker）
      summary: 熔断器关闭、打开、半开三态，触发条件（失败率/慢调用）与恢复探测。
    - id: b.protect.degrade
      title: 降级怎么做（Degradation, Fallback）
      summary: 降级：按优先级关闭次要功能或返回兜底数据，配合降级开关与预案。
    - id: b.protect.timeout
      title: 超时时间怎么设置（Timeout, Deadline Propagation）
      summary: 超时基于 p99 设置，上游大于下游之和，传递截止时间。
    - id: b.protect.bulkhead
      title: 隔离（Bulkhead）：线程池隔离与信号量
      summary: 舱壁隔离：每个依赖独立线程池或信号量，避免单点拖垮全局。
    - id: b.protect.ha-redundancy
      title: 高可用架构：冗余、容灾、多活与故障转移（RTO/RPO）
      summary: 高可用架构：冗余、故障转移、同城/异地多活与 RTO、RPO。
    - id: b.protect.observability-loadtest
      title: 可观测性与压测：Metrics / Trace / Log、全链路压测
      summary: 指标、日志、链路追踪三支柱，P99 口径，全链路压测与容量水位。
  - id: b.runtime
    title: 语言运行时与并发
    summary: Java、Go、Python 各自的集合、并发、GC 与调度模型。
    children:
    - id: b.runtime.java-sync-lock
