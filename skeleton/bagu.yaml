      summary: ThreadLocal 的 ThreadLocalMap 结构、弱引用 key 导致的内存泄漏与线程池中必须 remove。
    - id: b.runtime.java-aqs-juc
      title: AQS 与并发工具类（CountDownLatch, Semaphore, CompletableFuture, 并发容器）
      summary: AQS 队列同步器、CountDownLatch、Semaphore、CompletableFuture 与并发容器。
    - id: b.runtime.java-jvm-memory-classload
      title: JVM 内存区域、对象布局与类加载（双亲委派）
      summary: 运行时数据区、对象创建与布局、类加载过程与双亲委派。
    - id: b.runtime.java-virtual-threads
      title: 虚拟线程（Virtual Thread, JDK 21）与现代 Java 特性
      summary: JDK 21 虚拟线程的调度、Pinning 与适用场景，以及现代 Java 特性。
    - id: b.runtime.java-reflection-proxy-spi
      title: 反射、动态代理、SPI 与序列化
      summary: 反射、JDK 与 CGLIB 动态代理、SPI 与序列化协议的取舍。
    - id: b.runtime.java-language-basics
      title: Java 语言基础：String、equals/hashCode、异常、泛型、IO 模型
