# The System Design skeleton: study order top-to-bottom, `requires` edges
# mark real cross-topic prerequisites. Cards attach to leaf ids.
domain: system-design
title: System Design
lang: en
nodes:
  - id: foundations
    order: 1
    title: Foundations
    summary: How to run a design conversation and reason in numbers before touching any component.
    children:
      - id: foundations.method
        title: Interview Method
        summary: Requirements clarification, scoping functional vs non-functional needs, driving the 40-minute structure yourself.
      - id: foundations.estimation
        title: Back-of-Envelope Estimation
        summary: QPS, storage, and bandwidth sizing from DAU and access patterns; when an estimate changes the design.
      - id: foundations.numbers
        title: Latency Numbers
        summary: Orders of magnitude every engineer should know — memory vs SSD vs disk vs same-DC network vs cross-region.
      - id: foundations.tradeoffs
        title: Core Trade-offs
        summary: Performance vs scalability, latency vs throughput, availability vs consistency — the axes every later choice moves along.

  - id: networking
    order: 2
    title: Networking & APIs
    summary: How clients reach services and how services talk to each other.
    children:
      - id: networking.protocols
        title: Transport & HTTP
        summary: TCP vs UDP guarantees and costs; HTTP semantics, keep-alive, HTTP/2 and 3 in one breath.
      - id: networking.dns
        title: DNS
        summary: Resolution path, record types, TTL as a blunt failover and traffic-steering instrument.
      - id: networking.api-styles
        title: REST, gRPC & GraphQL
        summary: Choosing an API style by coupling, payload shape, streaming needs, and who owns the clients.
      - id: networking.realtime
        title: Realtime Delivery
        summary: Long polling vs SSE vs WebSockets; connection state as the scaling cost.
      - id: networking.cdn
        title: CDN
        summary: Push vs pull CDNs, cache keys, and what belongs at the edge.

  - id: traffic
    order: 3
    title: Load Balancing & Traffic
    summary: Spreading, shaping, and protecting request flow at the front door.
    children:
      - id: traffic.load-balancing
        title: Load Balancers
        summary: L4 vs L7, balancing algorithms, health checks, and LB high availability itself.
      - id: traffic.gateways
        title: Reverse Proxies & API Gateways
        summary: What a gateway centralizes — TLS termination, auth, routing, quotas — and the single-point risks it adds.
      - id: traffic.rate-limiting
        title: Rate Limiting
        summary: Token bucket vs sliding window, local vs distributed enforcement, and what to return when you shed.

  - id: caching
    order: 4
    title: Caching
    summary: The highest-leverage latency tool, and the consistency debt it creates.
    children:
      - id: caching.strategies
        title: Write & Read Strategies
        summary: Cache-aside, read-through, write-through, write-behind, refresh-ahead — who populates the cache and when.
      - id: caching.invalidation
        title: Invalidation & Eviction
        summary: TTLs, eviction policies, stale reads, and cache stampede protection.
      - id: caching.placement
        title: Cache Placement
        summary: Client, CDN, gateway, application, and database layers — what each layer can and cannot absorb.

  - id: storage
    order: 5
    title: Storage
    summary: Choosing and operating the systems of record.
    children:
      - id: storage.relational
        title: Relational Databases
        summary: The default system of record — used well before being scaled.
        children:
          - id: storage.relational.indexing
            title: Indexing
            summary: B-tree indexes, composite and covering indexes, leftmost-prefix rule, when indexes hurt.
          - id: storage.relational.operations
            title: Operating at Scale
            summary: Connection pooling, read replicas, federation, MVCC maintenance, and when a single Postgres is the right answer.
      - id: storage.internals
        title: Storage Engine Internals
        summary: How the write path actually hits disk — the two engine families beneath every database choice.
        children:
          - id: storage.internals.btree
            title: B-tree Mechanics
            summary: Fixed-size pages, splits, the WAL and crash recovery, in-place updates and their concurrency cost.
          - id: storage.internals.lsm
            title: LSM-tree Mechanics
            summary: Memtable to SSTables, compaction strategies (size-tiered vs leveled), Bloom filters, tombstones.
          - id: storage.internals.tradeoffs
            title: Engine Trade-offs
            summary: Read, write, and space amplification; when B-trees beat LSM-trees and vice versa; in-memory engines.
      - id: storage.nosql
        title: NoSQL Families
        summary: Key-value, document, wide-column, graph — the access patterns each one exists to serve.
      - id: storage.record-modeling
        title: Record Modeling
        summary: Shaping the records themselves — one table with a discriminating dimension versus separate stores, and vocabulary collision as a schema hazard.
      - id: storage.object
        title: Object Storage & Separation
        summary: S3-style object stores, storage-compute separation, and the modern default of parking cold and big data there.
      - id: storage.search
        title: Search Indexes
        summary: Inverted indexes, relevance basics, and keeping a search cluster in sync with the source of truth.
      - id: storage.encoding
        title: Encoding & Evolution
        summary: Data formats as contracts between code versions — JSON, Protobuf, Avro; forward and backward compatibility rules.

  - id: distributed
    order: 6
    title: Distributed Data
    summary: What happens to data when one machine is no longer enough — the deep end of the interview.
    children:
      - id: distributed.cap
        title: CAP & PACELC
        summary: What the theorem actually constrains during a partition, and the latency trade-off the rest of the time.
      - id: distributed.consistency
        title: Consistency Models
        summary: Linearizability, causal, read-your-writes, eventual — as contracts you promise the client.
      - id: distributed.replication
        title: Replication
        summary: Keeping copies of the same data on multiple nodes — and what each topology costs.
        requires: [distributed.consistency]
        children:
          - id: distributed.replication.leader
            title: Leader-Based
            summary: Single-leader replication, log shipping formats, sync vs async, lag and its anomalies, failover mechanics.
          - id: distributed.replication.multi-leader
            title: Multi-Leader
            summary: Multi-datacenter writes, conflict detection and resolution, why LWW loses data.
          - id: distributed.replication.leaderless
            title: Leaderless & Quorums
            summary: Dynamo-style quorums, sloppy quorums and hinted handoff, read repair and anti-entropy.
      - id: distributed.partitioning
        title: Partitioning
        summary: Splitting data across nodes — scheme choice, movement, and the skew that breaks both.
        children:
          - id: distributed.partitioning.schemes
            title: Hash vs Range
            summary: Hash and range partitioning trade-offs; consistent hashing and virtual nodes.
          - id: distributed.partitioning.rebalancing
            title: Rebalancing & Routing
            summary: Moving partitions without downtime; who knows where a key lives — routing tiers and coordination services.
          - id: distributed.partitioning.skew
            title: Hot Keys & Skew
            summary: Detecting and defusing hot partitions — key salting, splitting, and request-level caches.
          - id: distributed.partitioning.indexes
            title: Partitioned Secondary Indexes
            summary: Local vs global secondary indexes — scatter-gather reads vs write amplification.
      - id: distributed.transactions
        title: Transactions
        summary: What the database promises around concurrent access — and what it charges for the promise.
        requires: [storage.relational]
        children:
          - id: distributed.transactions.isolation
            title: Isolation Levels & Anomalies
            summary: Read committed to serializable through the anomalies each level permits — dirty/non-repeatable reads, write skew, phantoms.
          - id: distributed.transactions.concurrency-control
            title: Concurrency Control
            summary: 2PL vs MVCC vs SSI — how databases actually enforce isolation, and their contention behavior.
          - id: distributed.transactions.distributed
            title: Distributed Transactions
            summary: 2PC mechanics and blocking, why it's avoided at scale, and what replaces it.
      - id: distributed.consensus
        title: Consensus
        summary: Why single-leader systems need election, what Raft guarantees, fencing tokens, and the cost of quorum writes.
        requires: [distributed.replication]
      - id: distributed.time
        title: Clocks & Ordering
        summary: Why wall clocks lie, logical clocks, and detecting failure with timeouts you can defend.
        children:
          - id: distributed.time.clocks
            title: Clocks & Timestamps
            summary: Time-of-day vs monotonic clocks, NTP drift, timestamp ordering hazards, confidence intervals, logical clocks.
          - id: distributed.time.failure
            title: Failure Detection & Pauses
            summary: Timeouts as the only failure detector, process pauses (GC, VM suspend), system models, and defending a chosen timeout.
      - id: distributed.crdt
        title: CRDTs & Local-First
        summary: Conflict-free replicated data types, merge semantics, and offline-capable multi-writer apps.
        requires: [distributed.replication]

  - id: async
    order: 7
    title: Async & Streaming
    summary: Decoupling producers from consumers, and the delivery semantics that come with it.
    children:
      - id: async.queues
        title: Message Queues
        summary: Queues vs pub-sub, backpressure, consumer scaling, and when async is the wrong call.
      - id: async.log
        title: The Log & Kafka
        summary: The append-only log as system of record; partitions, consumer groups, offsets, retention.
        requires: [storage.internals]
      - id: async.delivery
        title: Delivery Semantics
        summary: What "delivered" actually promises — and how to engineer the strongest practical guarantee.
        children:
          - id: async.delivery.guarantees
            title: Delivery Guarantees
            summary: At-most-once vs at-least-once, ordering scope, dead-letter queues and poison pills.
          - id: async.delivery.exactly-once
            title: Effectively Exactly-Once
            summary: Idempotent producers, transactional consume-process-produce, and why end-to-end exactly-once is a composition, not a feature.
      - id: async.streaming
        title: Stream Processing & CDC
        summary: Change data capture, materialized views, windows, and keeping derived data fresh.
        children:
          - id: async.streaming.cdc
            title: CDC & Event Sourcing
            summary: Change data capture mechanics, initial snapshots, log compaction, and event sourcing as a contrast.
          - id: async.streaming.processing
            title: Stream Processing
            summary: Event time vs processing time, windows and watermarks, stream joins, and fault-tolerant state.

  - id: analytics
    order: 8
    title: Analytics & Derived Data
    summary: The OLAP side of the house — batch, warehouses, and every dataset derived from a system of record.
    children:
      - id: analytics.olap
        title: OLTP vs OLAP & Columnar
        summary: Why analytical scans want column layout, compression, and vectorized execution instead of B-trees.
        requires: [storage.internals]
      - id: analytics.warehouse
        title: Warehouses & Lakehouses
        summary: Warehouse vs data lake vs lakehouse; open table formats (Iceberg/Delta) over object storage.
        requires: [storage.object]
      - id: analytics.batch
        title: Batch Processing
        summary: MapReduce lineage to Spark; shuffles, distributed joins, idempotent reruns, and batch vs stream boundaries.
      - id: analytics.derived
        title: Derived Data & Materialized Views
        summary: Treating caches, indexes, and views as recomputable projections of a log — and keeping them fresh.
        requires: [async.log]

  - id: correctness
    order: 9
    title: Correctness Patterns
    summary: Patterns that keep money and state right when calls retry and services fail mid-flight.
    children:
      - id: correctness.idempotency
        title: Idempotency
        summary: Idempotency keys, dedup windows, and designing every mutation to survive a retry.
        requires: [async.delivery]
      - id: correctness.outbox
        title: Dual Writes & Outbox
        summary: Why writing DB-then-publish loses events, and how the transactional outbox closes the gap.
        requires: [distributed.transactions, async.queues]
      - id: correctness.saga
        title: Sagas
        summary: Long-running workflows via compensating actions when a distributed transaction is off the table.
        requires: [distributed.transactions]
      - id: correctness.ledger
        title: Ledgers & Reconciliation
        summary: Double-entry design, immutability, balance derivation, and reconciliation as the payments-grade safety net.
        requires: [correctness.idempotency]

  - id: architecture
    order: 10
    title: Architecture
    summary: Slicing a system into deployable parts, and the coordination tax of each cut.
    children:
      - id: architecture.services
        title: Monoliths & Microservices
        summary: When to split, service boundaries by data ownership, and the operational bill microservices arrive with.
      - id: architecture.discovery
        title: Service Discovery & Contracts
        summary: Registries, health checking, API versioning, and evolving schemas without breaking consumers.
        requires: [storage.encoding]
      - id: architecture.serverless
        title: Serverless
        summary: FaaS execution model, cold starts, and where per-request pricing beats owning servers.

  - id: reliability
    order: 11
    title: Reliability & Operations
    summary: Staying up, degrading gracefully, and proving it with numbers.
    children:
      - id: reliability.availability
        title: Availability Math
        summary: Nines, serial vs parallel composition, redundancy patterns, failover modes and their data-loss windows.
      - id: reliability.resilience
        title: Resilience Patterns
        summary: Degrading gracefully instead of collapsing — client discipline and failure containment.
        children:
          - id: reliability.resilience.retries
            title: Timeouts & Retries
            summary: Timeout budgets, deadline propagation, exponential backoff with jitter, retry storms and retry budgets.
          - id: reliability.resilience.containment
            title: Failure Containment
            summary: Circuit breakers, bulkheads, load shedding, chaos engineering, and safe deployment strategies.
      - id: reliability.slo
        title: SLOs & Error Budgets
        summary: SLIs worth measuring, percentiles over averages, and error budgets as a release throttle.
      - id: reliability.observability
        title: Observability
        summary: Structured logs, metrics, distributed traces; correlation ids and cardinality costs.
      - id: reliability.multi-region
        title: Multi-Region
        summary: Active-passive vs active-active, data residency, RPO/RTO, and why failover you never test doesn't exist.
        requires: [distributed.replication, distributed.consensus]

  - id: infra
    order: 12
    title: Platform & Infrastructure
    summary: The layer designs run on — containers, meshes, and the road to production.
    children:
      - id: infra.containers
        title: Containers & Orchestration
        summary: Containers vs VMs, Kubernetes primitives (pods, services, autoscaling) at design-conversation depth.
      - id: infra.mesh
        title: Service Mesh
        summary: Sidecars and ambient meshes — mTLS, retries, and traffic policy moved out of application code, at a latency cost.
        requires: [reliability.resilience.retries]
      - id: infra.delivery
        title: CI/CD & Progressive Delivery
        summary: Pipelines, canary and blue-green automation, feature flags, and config/schema changes as deploys.
        requires: [reliability.resilience.containment]

  - id: security
    order: 13
    title: Security
    summary: The authn/authz layer every design gets asked about once.
    children:
      - id: security.authn
        title: Authentication
        summary: Proving who's calling — session mechanics, delegation flows, and credentials themselves.
        children:
          - id: security.authn.tokens
            title: Sessions & Tokens
            summary: Server sessions vs JWTs, access/refresh pairs, rotation and reuse detection, sender-constrained tokens.
          - id: security.authn.oauth
            title: OAuth2 & OIDC
            summary: Authorization-code + PKCE flow, what OIDC adds on top, which flow for which client.
          - id: security.authn.credentials
            title: Passwords & Passkeys
            summary: Credential storage, phishing resistance, and the WebAuthn/passkey model.
      - id: security.authz
        title: Authorization & API Security
        summary: RBAC vs ABAC, API keys vs user tokens, TLS everywhere, secrets handling.

  - id: ai
    order: 14
    title: AI Systems
    summary: The data-infrastructure side of AI — from zero, in system-design terms, to serving and evaluating LLM backends.
    children:
      - id: ai.foundations
        title: LLM Foundations for Engineers
        summary: What an LLM actually does at serving time — tokens, context windows, embeddings, prefill/decode — no ML math required.
      - id: ai.vector-search
        title: Vector Search
        summary: Embeddings as vectors, ANN indexes (HNSW/IVF), hybrid retrieval, and freshness of the indexed corpus.
        requires: [storage.search, ai.foundations]
      - id: ai.rag
        title: RAG Pipelines
        summary: Chunking, retrieval, reranking, and grounding as a data pipeline — where quality is won and lost.
        requires: [ai.vector-search]
      - id: ai.inference
        title: Inference Serving
        summary: GPU batching, KV-cache reuse, streaming responses, and cost/latency levers unique to LLM backends.
        requires: [ai.foundations]
      - id: ai.evals
        title: Evals & AI Observability
        summary: Offline vs online evaluation, LLM-as-judge, regression suites for prompts, and tracing AI pipelines.
