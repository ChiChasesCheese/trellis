      - functions.first-class
    - id: craft.patterns.dependency-graph-cycle-detection
      title: 依赖图与环检测：拓扑排序、可达性、祖先链
      summary: 依赖关系都是图：Kahn 算法给出执行序并报出具体的环；改动前用可达性拒绝成环的赋值；遍历时用祖先链检测环。
      requires:
      - runtime.stdlib-map
      - model.dict-set-internals
    - id: craft.patterns.recursive-descent-parsing
      title: 递归下降解析：优先级 = 调用层次，分词与求值分离
      summary: 词法（正则切 token）→ 语法（每个优先级一个函数，低优先级先调用）→ 语法树（frozen 节点）→ 求值。
      requires:
      - iteration.pattern-matching
      - classes.dataclasses
    - id: craft.patterns.rule-chain-pipeline
      title: 规则链/流水线：统一接口，引擎只负责按序跑
      summary: 每个步骤/规则/折扣实现同一个小接口；引擎遍历、钳位、记账；加新规则不改引擎。
      requires:
      - functions.first-class
      - iteration.generators
    - id: craft.patterns.policy-seam
      title: 策略接缝：把会变的规则做成注入的纯函数/对象
      summary: 核心流程固定，变化点（超售、涨价、匹配、淘汰、找零、叠加）在构造时注入；默认值是策略的下界。
      requires:
      - functions.first-class
      - classes.abc-protocols
    - id: craft.patterns.effective-dated-versions
      title: 生效时间版本表：按事件发生时刻取规则（effective-dated lookup）
      summary: 规则/价格/政策按生效时间排成升序版本；用事件时间二分取版本，而不是当前配置，历史交易可精确重算。
      requires:
      - runtime.stdlib-map
      - engineering.money-time
    - id: craft.patterns.single-flight-coalescing
      title: 单飞/请求合并：同一件事只做一次，后到者等结果
      summary: 热点 key 同时未命中时只回源一次；重复请求并入第一个请求；占了坑但没结果时返回「进行中」。
      requires:
      - concurrency.locks-races
      - concurrency.executors
    - id: craft.patterns.bounded-containers-every-dict-has-an-exit
      title: 每个只增不减的容器都要有出口：purge / sweep / compact / maxlen
      summary: 任何随 key 数、请求数增长的容器都要有回收机制和可观测的大小指标，否则是保证会发生的 OOM。
      requires:
      - memory.leaks-tracemalloc
      - memory.weakref
      - performance.containers
    - id: craft.patterns.backpressure-overflow-policy
      title: 背压与溢出策略：丢最旧 / 阻塞 / 拒绝，必须当场选并可观测
      summary: 有界队列满了怎么办是一等设计决策：丢弃（要计数）、阻塞（反压上游）、拒绝（让调用方决定）。
      requires:
      - concurrency.queues
      - concurrency.locks-races
    - id: craft.patterns.retry-backoff-dead-letter
      title: 重试、退避与死信：可靠性写一份，渠道只管怎么发
      summary: 区分可重试与不可重试；指数退避带上限；重试用尽进死信；订阅者的故障不能拖垮发布者。
      requires:
      - runtime.exceptions
      - engineering.robustness
    - id: craft.patterns.derived-not-stored
      title: 派生状态不存储：算出来，不要存一份第二真相
      summary: 能从事实算出来的就算：sunk = len(hits) == len(cells)、started_at 从状态轨迹读、车辆位置从行程链算。
      requires:
      - classes.properties-descriptors
      - classes.pythonic-object
    - id: craft.patterns.conservation-invariant-reconcile
      title: 守恒不变量与对账：总和恒为零、钞票守恒、缓存可核对
      summary: 把「钱/货只搬运不产生」写成可随时验证的函数；缓存（余额）与真相（账本）之间有 reconcile。
      requires:
      - engineering.testing
      - engineering.robustness
    - id: craft.patterns.make-unmake-undo-log
      title: 可逆变更：make/unmake、撤销日志、Edit.invert
      summary: 每次真正改动之前记下「怎么变回去」：撤销闭包栈（kv-store）、对调字段的逆操作（text-editor）、落子/撤子（connect-four、chess）。
      requires:
      - functions.scope-closure
      - classes.dataclasses
    - id: craft.patterns.boundary-slicing-and-marginal-tiers
      title: 边界切分与边际阶梯：沿规则变化点切段，每段单价固定
      summary: 阶梯价只对落在本档的那部分收本档的价；跨高峰/跨日的区间在边界处切开，各算各的，最后一次取整。
      requires:
      - iteration.itertools
      - model.numbers
    - id: craft.patterns.prefix-sum-bisect-timeline
      title: 前缀和 + 二分：把「某一时刻/某一站的累计值」变成 O(log n)/O(1)
      summary: 事件只追加，所以累计值数组也只追加；查询用 bisect 找位置，再读前缀。
      requires:
      - performance.containers
      - iteration.itertools
    - id: craft.patterns.predicate-algebra-three-valued
      title: 谓词代数与三值逻辑：可组合的小对象 + NULL 传播
      summary: 每个条件是一个只会 matches(row) 的小对象；& | ~ 组合；NULL 参与的比较是「未知」，只留结果为 True 的行。
      requires:
      - classes.abc-protocols
      - model.dunder-protocols
      - classes.operator-overloading
    - id: craft.patterns.deterministic-tie-break
      title: 确定性 tie-break：排序键里写全规则，输出可复现
      summary: 所有「选一个」的地方都把平局规则写进键：(-可售数, 仓库名)、(容量, 桌号)、(到期时间, 发放时间, id)、首次出现序号。
      requires:
      - model.dict-set-internals
      - model.hash-eq
    - id: craft.patterns.half-open-intervals
      title: 区间一律左闭右开：[start, end)
      summary: 时间窗口、入住日期、到期时刻都用半开区间：相邻区间首尾相接不重叠，到点即过期。
      requires:
      - engineering.money-time
      - model.sequences
  - id: craft.idioms
    title: 高级写法（Idioms）
    summary: 真实代码里的 Python 用法：底层做了什么、朴素写法的代价、什么时候不该用。
    children:
    - id: craft.idioms.frozen-value-objects
      title: 不可变值对象（frozen + slots dataclass as value object）
      summary: 事件、配置、快照、键都写成 @dataclass(frozen=True, slots=True)：免费得到 ==、hash 和只读。
      requires:
      - classes.dataclasses
      - model.hash-eq
      - model.mutability
    - id: craft.idioms.exception-family
      title: 异常家族：基类 + 多重继承 + 携带数据（typed errors）
      summary: 每个模块一个基类；再混入 ValueError/LookupError/KeyError 保持标准库兼容；异常带字段，不让调用方去解析消息。
      requires:
      - runtime.exceptions
      - engineering.robustness
    - id: craft.idioms.protocol-callable-abc
      title: 策略接口三选一：Callable / Protocol / ABC
      summary: 只有一个行为用函数别名；多方法但不共享代码用 Protocol；共享算法骨架或操作符混入才用 ABC。
      requires:
      - classes.abc-protocols
      - types.protocols-generics
      - functions.first-class
    - id: craft.idioms.validated-construction
      title: 构造即校验与规范化（__post_init__ + object.__setattr__）
      summary: 让「存在的实例一定合法」：校验和规范化放进构造，下游不再重复检查。
      requires:
      - classes.dataclasses
      - classes.pythonic-object
      - runtime.exceptions
    - id: craft.idioms.read-only-views-and-snapshots
      title: 只读视图与快照返回（MappingProxyType / tuple / frozenset）
      summary: 内部容器永不外交：对外给 tuple 快照或只读视图，模块级常量表用 MappingProxyType 包住。
      requires:
      - model.mutability
      - model.copy
      - classes.dataclasses
    - id: craft.idioms.context-managers-for-invariants
      title: 上下文管理器守不变量：@contextmanager 与 ExitStack
      summary: 把「获取—使用—善后」写成 with：每个出口都做对的收尾，调用方不用记得 try/finally。
      requires:
      - iteration.context-managers
      - concurrency.locks-races
    - id: craft.idioms.heapq-tuple-ordering
      title: heapq 的元组序与 tie-break：计数器、负号、dataclass(order=True)
      summary: 堆元素是 (主键, 次键, 序号, 载荷)：序号保证稳定与不比较载荷，负号做大顶堆，None 要包一层。
      requires:
      - runtime.stdlib-map
      - performance.containers
      - classes.dataclasses
    - id: craft.idioms.event-wait-and-handoff
      title: Event / Condition 的惯用法：中断式睡眠、结果交接、截止时间
      summary: Event.wait(interval) 当可中断的 sleep；一次性结果交接用 Event；等待永远写 while 谓词 + 剩余时间。
      requires:
      - concurrency.locks-races
      - concurrency.queues
      - concurrency.threads
    - id: craft.idioms.money-types
      title: 金额类型选型：整数分 / 基点 / Decimal / Fraction
      summary: 钱不用 float：整数最小单位做存储，比例用整数基点，需要精确中间值时用 Decimal 或 Fraction。
      requires:
      - model.numbers
      - engineering.money-time
    - id: craft.idioms.round-once-at-the-boundary
      title: 取整点：Decimal.quantize、ROUND_HALF_EVEN 与整数四舍五入
      summary: 全精度算到最后一步，在唯一的取整函数里舍入一次；知道各舍入模式的差别。
      requires:
      - model.numbers
      - engineering.money-time
    - id: craft.idioms.time-types
      title: 时间类型选型：monotonic / aware datetime / 整数时间戳
      summary: 持续时间与租约用 monotonic；日历、账单、静默时段用带时区的 datetime；纯逻辑用调用方给的整数时间戳。
      requires:
      - engineering.money-time
      - runtime.stdlib-map
    - id: craft.idioms.match-structural
      title: 结构化模式匹配：对 dataclass 与枚举的 match / case
      summary: 用 case Bin(op, l, r)、case Grant() 一行完成「判类型 + 取字段」，每个分支一条规则。
      requires:
      - iteration.pattern-matching
      - classes.dataclasses
    - id: craft.idioms.exhaustive-match-assert-never
      title: 穷尽性：match 加 assert_never（解法没用，应该用）
      summary: 所有 match/if-elif 都没有穷尽性保护；加一个新枚举成员时，漏处理的分支会静默通过。
      requires:
      - iteration.pattern-matching
      - types.gradual-typing
    - id: craft.idioms.replace-for-state-change
      title: 用 dataclasses.replace 整体替换，而不是原地改（immutable record swap）
      summary: 状态变化 = 造新对象换进字典；交出去的旧快照永远不变，「检查再替换」可以做成锁内比较并交换。
      requires:
      - classes.dataclasses
      - model.mutability
    - id: craft.idioms.decorators-for-cross-cutting-locks
      title: 装饰器做横切关注点：@_synchronized / @_op 与 functools.wraps
      summary: 整个方法体都是临界区时，把锁（和「先结清过期」）写在方法头的装饰器里，不会漏一个方法。
      requires:
      - functions.decorators
      - functions.decorator-patterns
      - concurrency.locks-races
    - id: craft.idioms.bisect-sorted-lists
      title: bisect 与有序列表：floor/ceiling、key=、只查邻居
      summary: 有序列表 + bisect 回答「最后一个 ≤ x」「第一个 ≥ x」；key= 参数省掉并行列表；区间冲突只需检查两个邻居。
      requires:
      - performance.containers
      - runtime.stdlib-map
      - model.sequences
    - id: craft.idioms.generators-lazy-traversal
      title: 生成器管线与显式栈：惰性遍历 + pairwise / islice
      summary: 遍历写成 yield 的生成器，用显式栈替代递归：取第一个结果不必走完整棵树，深目录不撞递归上限。
      requires:
      - iteration.generators
      - iteration.itertools
      - iteration.iterator-protocol
    - id: craft.idioms.default-forms
      title: 省掉标志变量：next(…, None) / min(default=) / for-else / 海象运算符
      summary: 用带默认值的内置函数表达「找不到」，用 for-else 表达「没 break」，用 := 表达「取值并判断」。
      requires:
      - iteration.comprehensions
      - iteration.generators
      - functions.first-class
    - id: craft.idioms.closure-factory-policies
      title: 闭包工厂做策略（closure factory）
      summary: 工厂函数接收配置、返回策略函数：配置只处理一次，调用时只剩纯计算。
      requires:
      - functions.scope-closure
      - functions.first-class
      - functions.functools
    - id: craft.idioms.enum-behaviour
      title: Enum 的行为：IntEnum 排序、属性、StrEnum 与生命周期顺序
      summary: IntEnum 让优先级/严重度/舱位可以直接比较；Enum 上挂 @property 代替每个状态一个子类。
      requires:
      - classes.enums
    - id: craft.idioms.id-generation
      title: ID 生成：itertools.count、next 与生成器表达式的陷阱
      summary: 用 next(itertools.count(1)) 生成单调 ID；不要把它包进生成器表达式在锁外共享。
      requires:
      - iteration.generators
      - concurrency.locks-races
      - concurrency.gil
    - id: craft.idioms.dunder-protocols-that-pay
      title: 值得写的特殊方法：__bool__ / __len__ / __contains__ / __and__ / __call__ / __enter__
      summary: 只在它让调用点更自然或让升级无感时才写：Decision 的 __bool__、Filter 的 & | ~、观察者的 __call__。
      requires:
      - model.dunder-protocols
      - classes.operator-overloading
      - classes.pythonic-object
    - id: craft.idioms.sentinels
      title: 哨兵值：object()、math.inf、毒丸与「None 是合法值」
      summary: 当 None 本身是合法取值时，用模块级 object() 或枚举单例做哨兵；队列里的哨兵任务叫毒丸。
      requires:
      - model.names-objects
      - model.numbers
    - id: craft.idioms.dispatch-tables
      title: 数据驱动的分派表：operator 表、方向表、转换表
      summary: 把「若干 if 分支」写成 dict：_OPS、_DIRECTIONS、TRANSITIONS、CANCELLABLE_BY、PolicyTable.overrides。
      requires:
      - functions.first-class
      - model.dict-set-internals
      - functions.functools
    - id: craft.idioms.bounded-deque
      title: deque(maxlen) 做有界历史；list 头部删除是 O(n)
      summary: 死信、通知历史、失败记录、滑动窗口都用 deque(maxlen=N)：自动淘汰最旧，内存有上界。
      requires:
      - performance.containers
      - runtime.stdlib-map
    - id: craft.idioms.copy-in-copy-out
      title: 边界拷贝：进来拷、出去拷（deepcopy / tuple / 回放式 copy）
      summary: 可变数据穿过边界时拷贝一次：Table.insert 存副本，select 返回副本；Game.copy 用落子序列回放。
      requires:
      - model.copy
      - model.mutability
    - id: craft.idioms.memoize-on-frozen
      title: 记忆化：lru_cache 要求参数可哈希、结果不可变
      summary: query-condition-parser 把「条件字符串 → 语法树」用 lru_cache 缓存；之所以安全，是因为树节点全是 frozen。
      requires:
      - functions.functools
      - model.hash-eq
      - classes.properties-descriptors
    - id: craft.idioms.kw-only-positional-only
      title: 参数形态：仅位置 `/`、仅关键字 `*`、kw_only dataclass
      summary: 尾随 **kwargs 收用户数据的 API，前面的形参应是仅位置的；一串同类型的配置参数应是仅关键字的。
      requires:
      - functions.arguments
      - classes.dataclasses
    - id: craft.idioms.slots-and-memory
      title: __slots__ 与 slots=True：该用在哪、不能用在哪
      summary: 大量小对象（节点、记录）用 slots 省掉 __dict__；内部可变记录和对外冻结值对象都可以 slots。
      requires:
      - classes.dataclasses
      - memory.object-size
      - performance.less-ram
    - id: craft.idioms.namedtuple-for-keys
      title: NamedTuple 做复合键与轻量返回值
      summary: 需要「仍是 tuple（可作键、可拆包、可比较）但字段有名字」时用 NamedTuple；需要校验或方法时用 dataclass。
      requires:
      - classes.dataclasses
      - model.sequences
      - model.hash-eq
    - id: craft.idioms.literal-and-closed-sets
      title: 封闭取值集：Literal / Enum / StrEnum 的选型
      summary: status 只有两个取值时 Literal 足够；要遍历、带行为、做键时用 Enum；要 JSON 友好用 StrEnum。
      requires:
      - types.typeddict-literal
      - classes.enums
    - id: craft.idioms.generics-and-type-aliases
      title: 泛型与类型别名：Generic/TypeVar、Clock 别名、Self 与 override
      summary: 容器类参数化键值类型；把 Clock = Callable[[], X] 之类的别名统一；copy()/__enter__ 返回 Self；模板方法钩子标 @override。
      requires:
      - types.protocols-generics
      - types.basics
      - types.gradual-typing
    - id: craft.idioms.descriptors-where-they-earn
      title: 描述符：什么时候值得（共享字段规则），什么时候不值得
      summary: 同一条字段规则（正整数、非空、范围）在三个以上的类里重复时，才值得写一个 __set_name__ 描述符。
      requires:
      - classes.properties-descriptors
      - classes.attribute-lookup
    - id: craft.idioms.init-subclass-registry
      title: __init_subclass__ 注册表 vs 手写 dict（create_cache 的取舍）
      summary: 按名字创建实现（'lru'、'file'）时，注册表可以靠 __init_subclass__ 自动维护，也可以手写一个 dict。
      requires:
      - classes.metaprogramming
      - classes.inheritance-mro
  - id: craft.architecture
    title: 架构理解（Architecture）
    summary: 类之上的判断：依赖方向、事务边界、哪里值得抽象，以及同一设计从单进程到分布式怎么变。
    children:
    - id: craft.architecture.functional-core-imperative-shell
      title: 函数式核心 + 命令式外壳（functional core, imperative shell）
      summary: 决策逻辑写成不读实例状态的纯函数；有状态的外壳负责加锁、取时间、改真实状态、发通知。
      requires:
      - functions.first-class
      - engineering.testing
    - id: craft.architecture.lock-lives-with-the-invariant
      title: 锁跟着不变量走：谁拥有不变量，谁拥有锁（aggregate owns its lock）
      summary: 一个不变量涉及哪些数据，就把它们放进同一个对象并由同一把锁保护；服务层只保护目录。
      requires:
      - concurrency.locks-races
    - id: craft.architecture.lock-as-transaction-boundary
      title: 一把锁就是一个事务：临界区边界 = 原子性边界
      summary: 单进程里，一把锁圈住的区间就是数据库事务的替身：检查、修改、写日志要么都在里面，要么都不在。
      requires:
      - concurrency.locks-races
      - concurrency.choosing
    - id: craft.architecture.dependency-direction-consumer-owns-interface
      title: 依赖方向：接口由使用方定义，核心不依赖基础设施
      summary: Watcher 定义自己需要的 FileSystem.scan；业务核心不 import 磁盘/网络/时间；基础设施去适配核心。
      requires:
      - classes.abc-protocols
      - types.protocols-generics
    - id: craft.architecture.source-of-truth-and-derived-caches
      title: 真相与派生缓存：谁是真相、谁是投影、漂移怎么办
      summary: 每份数据只能有一个真相来源；其余是可重建的投影，投影与真相之间要有核对手段。
      requires:
      - model.mutability
      - engineering.robustness
    - id: craft.architecture.interface-only-when-earned
      title: 接口是挣来的：什么时候不抽象
      summary: 只有一个实现、一个方法、想不出第二种的地方，不抽接口、不加抽象基类；真有两种行为不同的实现才抽。
      requires:
      - classes.abc-protocols
      - functions.first-class
    - id: craft.architecture.entity-vs-value-object
      title: 实体 vs 值对象：身份、可变性与谁拥有状态
      summary: 有身份、有生命周期、被锁保护的是实体；只由属性定义、可以随便共享的是值。同一个现实物件常常要拆成两半。
      requires:
      - classes.dataclasses
      - model.names-objects
      - model.hash-eq
    - id: craft.architecture.error-boundaries-and-failure-taxonomy
      title: 错误边界与失败分类：哪些吞、哪些抛、哪些变成值
      summary: 订阅者/回调的异常在边界处隔离；业务拒绝变成带原因的值；可重试与不可重试分类；补偿失败不能被吞。
      requires:
      - runtime.exceptions
      - engineering.robustness
    - id: craft.architecture.seams-for-testing
      title: 测试接缝：时钟、文件系统、sleep、可观测计数器
      summary: 设计时就把「可替换的外部依赖」和「可断言的内部状态」留成接缝，让测试不需要 sleep、不需要猜、不需要私有属性。
      requires:
      - engineering.testing
      - concurrency.threads
    - id: craft.architecture.in-process-to-distributed
      title: 从单进程到分布式：每个原语在生产里换成什么
      summary: 锁、Condition、堆、字典、日志、时钟，各自在分布式里有对应物；哪些保证会丢，用什么补。
      requires:
      - concurrency.choosing
      - concurrency.multiprocessing
    - id: craft.architecture.event-time-vs-processing-time
      title: 事件时间 vs 处理时间：乱序、重复、迟到的事实
      summary: 用事件发生的时间做所有计算，处理时间永远不进业务逻辑；乱序和重复靠存事实 + 重放吸收。
      requires:
      - engineering.money-time
    - id: craft.architecture.order-side-effects-by-reversibility
      title: 按可逆性给副作用排序：先做会失败的、可回滚的，最后做不可撤销的
      summary: 多步操作的顺序不是随意的：把最可能失败、最容易撤销的放前面，把无法撤销（出钞、发货、通知）的放最后。
      requires:
      - runtime.exceptions
    - id: craft.architecture.thin-service-fat-domain
      title: 服务层薄、领域对象厚：编排者不持有不变量
      summary: Service/Facade 管目录、算钱、走生命周期、串步骤；库存、座位、订单簿这类带不变量的状态在领域对象里。
      requires:
      - classes.pythonic-object
    - id: craft.architecture.lock-hierarchy-and-reentrancy
      title: 调用方向与可重入：谁能调谁，回调时手里不能有锁
      summary: 整个调用图画成单向的层次：服务→池→对象，下层从不回调上层；观察者永远在锁外被调用。
      requires:
      - concurrency.locks-races
    - id: craft.architecture.command-event-fact
      title: 命令、事件与事实：过去式、自带全部信息、不可变
      summary: 命令是请求（可被拒绝）；事件是已发生的事实（不可变、过去式、自带上下文）；订阅者永远不需要回头问现状。
      requires:
      - classes.dataclasses
      - engineering.serialization
    - id: craft.architecture.extension-points-worth-paying-for
      title: 扩展点值得付费的地方：数据代替代码、从第一天就预留的字段
      summary: 「加第 N 关不改老代码」是设计质量的检验：把会变的东西做成数据（菜单、政策表），把未来要用的维度从第一天放进数据结构。
      requires:
      - classes.dataclasses
      - functions.first-class
    - id: craft.architecture.unit-of-inventory-modeling
      title: 库存的单位怎么选：房型夜、车的行程段、场次座位、航班实例
      summary: 先问「到底是什么被卖掉了」。选对库存单位，并发、超卖、异地还车、改签都变成这个单位上的同一个不变量。
      requires:
      - model.dict-set-internals
      - classes.dataclasses
    - id: craft.architecture.composition-of-independent-axes
      title: 独立变化轴的组合：N×M 个组合只写 N+M 个小类
      summary: 先找出互相独立的变化方向，每个方向一个接口，互不引用；用配置把名字翻译成对象。
      requires:
      - classes.inheritance-mro
      - classes.abc-protocols
    - id: craft.architecture.explicit-non-goals-and-simplifications
      title: 明说的简化与非目标：说清楚没做什么、接缝在哪
      summary: 每个解法的文件头都应说明刻意没做的部分和换成真实版本时只动哪里。这是 senior 与 mid 在面试里最明显的差别。
    - id: craft.architecture.observability-as-design
      title: 可观测性是设计的一部分：丢弃必须计数，状态变化必须留痕
      summary: 任何会丢、会拒、会重试、会降级的地方都要有计数或事件，否则线上只能靠猜。
      requires:
      - engineering.logging-config
      - engineering.testing
