# Python: authored from the field (ADR 0002) — the union of Fluent Python 2e, Effective Python 3e,
# High Performance Python 2e, CPython Internals, Python Concurrency with asyncio, the official
# Language Reference / HOWTOs / Library reference, CPython's InternalDocs and PEP 703, cross-checked
# against interview question sets (yakimka, Devinterview, the Millennium python_internals bank).
# Survey, mapping table and out-of-scope lines: vault/domains/python/BUILD.md.
# A leaf is one interview probe. `core: true` = the interview cut (what a 45-minute round can ask).
domain: python
title: Python
lang: zh
fold_code: 25
vault: domains/python
study:
  order: core-first
  mix: new-first
  new_per_day: 70
  reviews_per_day: 400
nodes:
- id: model
  core: true
  title: 对象模型：名字、对象与数据模型（data model）
  summary: 建立 Python 的核心心智模型：一切皆对象、名字是绑定而非盒子、特殊方法（dunder）把对象接入语言协议，以及 dict/set 这类内建容器在底层如何工作。
  order: 1
  children:
  - id: model.names-objects
    core: true
    title: 名字绑定、对象身份与 `is` vs `==`
    summary: 理解变量是对对象的引用而非容器，`id()`/`is` 比较身份、`==` 调用 `__eq__` 比较值，以及小整数与短字符串驻留（interning）为何只是实现细节。
  - id: model.mutability
    core: true
    title: 可变与不可变对象：list vs tuple、可变默认参数、别名（aliasing）
    summary: 掌握可变性如何决定函数参数的副作用、`def f(x, acc=[])` 为什么共享状态、tuple 为什么能做字典键，以及 `+=` 在两类对象上的不同行为。
    requires:
    - model.names-objects
  - id: model.copy
    title: 浅拷贝、深拷贝与切片复制
    summary: 理解 `copy.copy`、切片、`list()` 只复制一层，`copy.deepcopy` 递归复制并处理环，以及什么时候别名反而是想要的。
    requires:
    - model.mutability
  - id: model.dunder-protocols
    core: true
    title: 特殊方法与语言协议：`__repr__`、`__len__`、`__getitem__`、`__call__`
    summary: 理解解释器如何通过特殊方法实现 `len()`、`for`、`in`、`+`、调用等语法，`__repr__` 与 `__str__` 的分工，以及为什么应实现协议而不是继承内建类型。
    requires:
    - model.names-objects
  - id: model.hash-eq
    core: true
    title: "`__hash__` 与 `__eq__` 的契约"
    summary: 掌握相等的对象必须有相同哈希、定义 `__eq__` 会让 `__hash__` 变 None、可哈希对象为何必须不可变，以及自定义类做字典键时的常见错误。
    requires:
    - model.dunder-protocols
  - id: model.dict-set-internals
    core: true
    title: dict 与 set 的实现：哈希表、开放寻址、紧凑布局与插入序
    summary: 理解哈希表如何用哈希值定位槽位并处理冲突（开放寻址、扰动探测）、3.6+ 紧凑 dict 为何保序、装载因子触发扩容，以及平均 O(1) 与最坏 O(n) 的来源。
    requires:
    - model.hash-eq
  - id: model.sequences
    title: 序列类型：list、tuple、array、memoryview 与切片语义
    summary: 区分容器序列与扁平序列、可变与不可变序列，掌握切片对象与 `__getitem__` 的交互、`+=` 的就地语义、`array`/`memoryview` 的零拷贝场景。
    requires:
    - model.mutability
  - id: model.text-bytes
    title: str 与 bytes：Unicode、编码与解码
    summary: 理解字符串是 Unicode 码点序列、bytes 是字节序列，编码/解码在 I/O 边界发生，UTF-8 与错误处理策略，以及"Unicode 三明治"原则。
  - id: model.numbers
    title: 数值：int 大整数、float 精度与 Decimal
    summary: 掌握 int 任意精度、float 是 IEEE 754 双精度导致 `0.1+0.2 != 0.3`、金额为什么用 `Decimal` 或整数分并显式指定舍入，以及 `//` 和 `%` 对负数的定义。
- id: functions
  core: true
  title: 函数、闭包与装饰器
  summary: 函数是一等对象：作用域规则、闭包如何捕获变量、参数传递的细节，以及装饰器作为"用函数改写函数"的标准模式。
  order: 2
  children:
  - id: functions.first-class
    title: 一等函数：作为对象传递、高阶函数与 lambda
    summary: 理解函数对象的属性（`__name__`、`__doc__`、`__defaults__`）、把函数当参数与返回值，以及 lambda 只是没有名字的单表达式函数。
  - id: functions.scope-closure
    core: true
    title: 作用域（LEGB）、闭包与 `nonlocal`
    summary: 掌握名字查找顺序 Local→Enclosing→Global→Builtin、闭包如何持有自由变量的 cell、赋值为何让变量变局部（`UnboundLocalError`），以及循环中闭包的迟绑定陷阱。
    requires:
    - model.names-objects
  - id: functions.arguments
    core: true
    title: 参数传递：`*args`/`**kwargs`、仅关键字与仅位置参数、默认值求值时机
    summary: 理解 Python 是"按对象引用传递"、默认值在定义时求值一次、`*` 与 `/` 分隔符的用途，以及解包调用与形参的匹配规则。
    requires:
    - model.mutability
  - id: functions.decorators
    core: true
    title: 装饰器：`@` 语法糖、`functools.wraps` 与执行时机
    summary: 理解 `@d` 等价于 `f = d(f)` 且在模块导入时执行、包装函数如何转发参数与返回值、`wraps` 为何要保留元数据，以及叠加多个装饰器的应用顺序。
    requires:
    - functions.scope-closure
  - id: functions.decorator-patterns
    core: true
    title: 带参数的装饰器、类装饰器与常见实例（retry、memoize、timing、rate limit）
    summary: 掌握三层嵌套的参数化装饰器、用类实现带状态的装饰器、装饰方法时 `self` 的传递，以及缓存/重试/限流装饰器的设计要点与可测试性（注入时钟）。
    requires:
    - functions.decorators
  - id: functions.functools
    title: "`functools`：`lru_cache`、`partial`、`singledispatch`、`cached_property`"
    summary: 掌握标准库提供的函数工具及其陷阱：`lru_cache` 要求参数可哈希且可能泄漏内存、`partial` 固定参数、`singledispatch` 按第一个参数类型分派。
    requires:
    - functions.decorators
- id: iteration
  core: true
  title: 迭代器、生成器与上下文管理器
  summary: 惰性求值是 Python 处理大数据与流的基本手段：迭代协议、生成器函数、`itertools` 组合，以及 `with` 语句保证资源释放的机制。
  order: 3
  children:
  - id: iteration.iterator-protocol
    core: true
    title: 可迭代对象与迭代器：`__iter__`、`__next__`、`StopIteration`
    summary: 区分 iterable（能产生迭代器）与 iterator（有状态、一次性），理解 `for` 循环的展开方式，以及为什么迭代器耗尽后要重新获取。
    requires:
    - model.dunder-protocols
  - id: iteration.generators
    core: true
    title: 生成器函数与生成器表达式：惰性、O(1) 内存与一次性
    summary: 理解 `yield` 让函数变成生成器工厂、执行在 `next()` 时才推进、生成器表达式与列表推导的内存差异，以及生成器只能消费一次的坑。
    requires:
    - iteration.iterator-protocol
  - id: iteration.yield-from
    title: "`yield from` 与生成器的 `send`/`throw`/`close`"
    summary: 掌握 `yield from` 如何委托子生成器并透传值与异常、`send()` 让生成器成为经典协程，以及这套机制为何是 async/await 的前身。
    requires:
    - iteration.generators
  - id: iteration.itertools
    title: "`itertools` 与迭代器组合：`chain`、`groupby`、`islice`、`accumulate`"
    summary: 掌握用迭代器工具组合出流水线而不物化中间列表，`groupby` 要求先排序，以及 `tee` 的内存代价。
    requires:
    - iteration.generators
  - id: iteration.context-managers
    core: true
    title: 上下文管理器：`__enter__`/`__exit__`、`contextlib.contextmanager` 与 `ExitStack`
    summary: 理解 `with` 如何保证 `__exit__` 在异常时也执行、`__exit__` 返回 True 会吞掉异常、用生成器写上下文管理器时 `try/finally` 包住 `yield`，以及 `ExitStack` 管理动态数量的资源。
    requires:
    - iteration.generators
  - id: iteration.comprehensions
    title: 推导式与 `else` 块：可读性边界与作用域
    summary: 掌握推导式有自己的作用域、超过两层控制子表达式应改写为循环、`for/else` 与 `try/else` 的语义，以及何时用 `map/filter`。
  - id: iteration.pattern-matching
    title: 结构化模式匹配：`match`/`case`、捕获、守卫与类模式
    summary: 理解 3.10 的 `match` 不是 switch：模式会解构序列、映射与类实例并绑定名字，`case _` 兜底、`if` 守卫、`__match_args__` 决定位置模式，以及什么时候一串 `if` 反而更清楚。
- id: classes
  core: true
  title: 类、协议与元编程
  summary: 从写出一个"Pythonic 对象"到理解属性查找、描述符、抽象基类与协议、继承与 MRO，直到类装饰器与元类如何在类创建时介入。
  order: 4
  children:
  - id: classes.pythonic-object
    core: true
    title: Pythonic 对象：`__init__`、`__repr__`、`__eq__`、`classmethod` vs `staticmethod`
    summary: 掌握一个类应实现的基本协议、`@classmethod` 作为备选构造器、`@staticmethod` 的定位，以及为什么 `__repr__` 应该能重建对象。
    requires:
    - model.dunder-protocols
  - id: classes.dataclasses
    core: true
    title: "`dataclass`、`NamedTuple` 与 `__slots__`"
    summary: 比较三种数据类构建器的可变性、内存与哈希语义，`frozen=True`、`field(default_factory=)`、`__post_init__` 校验，以及 `__slots__` 省内存并禁止动态属性的代价。
    requires:
    - classes.pythonic-object
    - model.hash-eq
  - id: classes.attribute-lookup
    title: 属性查找：实例字典、类字典、`__getattr__` 与 `__getattribute__`
    summary: 理解 `obj.x` 的查找顺序（数据描述符→实例 `__dict__`→类→非数据描述符→`__getattr__`），`__getattribute__` 拦截一切的风险，以及惰性属性的实现方式。
    requires:
    - classes.pythonic-object
  - id: classes.properties-descriptors
    core: true
    title: "`property` 与描述符协议（`__get__`/`__set__`/`__set_name__`）"
    summary: 掌握 property 是描述符的特例、数据描述符与非数据描述符的优先级差异、用描述符复用校验逻辑，以及 `__set_name__` 如何拿到属性名。
    requires:
    - classes.attribute-lookup
  - id: classes.abc-protocols
    core: true
    title: 鸭子类型、抽象基类（ABC）与 `typing.Protocol`
    summary: 理解鸭子类型靠行为而非继承、`collections.abc` 的虚拟子类与 `register`、`@abstractmethod` 阻止实例化，以及 Protocol 提供的结构化子类型（structural subtyping）。
    requires:
    - classes.pythonic-object
  - id: classes.inheritance-mro
    core: true
    title: 继承、多重继承、MRO（C3 线性化）与 `super()`
    summary: 掌握方法解析顺序如何由 C3 算法决定、`super()` 调用的是 MRO 中的下一个而非父类、mixin 的设计约束，以及为何 Fluent Python 建议优先组合。
    requires:
    - classes.pythonic-object
  - id: classes.operator-overloading
    title: 运算符重载：`__add__`/`__radd__`、就地运算符与比较运算
    summary: 理解二元运算符的分派规则（先左操作数、返回 `NotImplemented` 再试反向方法）、`__iadd__` 缺省时退化为 `__add__`，以及比较运算符的反射对应关系。
    requires:
    - model.dunder-protocols
  - id: classes.metaprogramming
    title: 类装饰器、`__init_subclass__` 与元类（metaclass）
    summary: 理解类本身是 `type` 的实例、类体执行完后由元类创建类对象、`__init_subclass__` 与类装饰器在多数场景下足以替代元类，以及元类的典型用途（注册、校验、ORM）。
    requires:
    - classes.inheritance-mro
  - id: classes.enums
    title: 枚举（Enum）：`Enum`/`IntEnum`/`StrEnum`/`Flag`、`auto()` 与唯一性
    summary: 理解枚举成员是类属性求值后由元类替换成的单例、`auto()` 与 `_generate_next_value_` 的取值规则、`@unique` 与别名、`Flag` 的位运算组合，以及什么时候该用 `StrEnum`/`IntEnum` 而不是裸常量。
- id: memory
  core: true
  title: 内存管理与垃圾回收
  summary: CPython 如何分配与回收对象：引用计数即时释放、分代式循环垃圾回收、pymalloc 的 arena/pool/block 分层，以及长驻进程中内存增长的来源与诊断。
  order: 5
  children:
  - id: memory.refcounting
    core: true
    title: 引用计数：`ob_refcnt`、即时释放与 `sys.getrefcount`
    summary: 理解每个对象头部的引用计数如何随赋值/作用域退出增减、归零即释放的确定性，以及引用计数无法处理循环引用的原因。
    requires:
    - model.names-objects
  - id: memory.cyclic-gc
    core: true
    title: 循环垃圾回收：分代（generations）、阈值与增量回收
    summary: 掌握 `gc` 模块如何追踪容器对象、通过"试减引用"找出不可达环、分代假设与触发阈值，3.12+ 增量回收的变化，以及 `__del__` 与弱引用在环中的处理。
    requires:
    - memory.refcounting
  - id: memory.allocator
    title: pymalloc：arena / pool / block 与为何内存不还给操作系统
    summary: 理解小对象（≤512 字节）走 pymalloc 的三层分配器、大对象走系统 malloc、arena 只有全空才释放导致 RSS 居高不下，以及碎片化的影响。
    requires:
    - memory.refcounting
  - id: memory.object-size
    title: 对象的真实大小：`sys.getsizeof`、`__slots__`、int/str/list 的开销
    summary: 掌握一个 Python 对象的头部开销、list 的过量分配策略、dict 的键共享，以及百万级小对象为什么该用 `__slots__`、tuple、array 或 NumPy。
    requires:
    - memory.allocator
  - id: memory.leaks-tracemalloc
    core: true
    title: 长驻进程的内存泄漏：来源、`tracemalloc` 与 `gc.get_referrers`
    summary: 掌握泄漏的常见来源（全局缓存、`lru_cache`、闭包与回调持有、循环引用加 `__del__`、C 扩展），用 `tracemalloc` 快照比对定位分配点，以及分块处理与定期重启 worker 的工程手段。
    requires:
    - memory.cyclic-gc
  - id: memory.interning-immortal
    title: 驻留（interning）与不朽对象（immortal objects，PEP 683）
    summary: 理解字符串驻留与小整数缓存如何省内存与加速比较，3.12 引入不朽对象让 `None`/`True`/小整数免于引用计数写入，以及这对多核与写时复制（fork）的意义。
    requires:
    - memory.refcounting
  - id: memory.weakref
    title: 弱引用：`weakref`、`WeakValueDictionary` 与缓存
    summary: 掌握弱引用不增加引用计数、对象被回收后弱引用失效，以及用弱引用字典实现不阻止回收的缓存与观察者列表。
    requires:
    - memory.refcounting
- id: concurrency
  core: true
  title: 并发模型：GIL、线程与进程
  summary: 理解 GIL 决定了线程适合 I/O 而非 CPU，进程绕过 GIL 但付出序列化代价，以及标准库提供的同步原语、执行器与 3.13 自由线程（free-threading）的现状。
  order: 6
  children:
  - id: concurrency.gil
    core: true
    title: 全局解释器锁（GIL）：它保护什么、何时释放、切换间隔
    summary: 理解 GIL 让同一进程内同一时刻只有一个线程执行字节码、I/O 与部分 C 扩展（NumPy 内核）会释放它、5 ms 切换间隔的含义，以及 GIL 保护的是解释器状态而不是你的数据。
    requires:
    - memory.refcounting
  - id: concurrency.threads
    core: true
    title: 线程：`threading.Thread`、守护线程与线程适用的场景
    summary: 掌握用线程隐藏阻塞 I/O 的延迟、CPU 密集下多线程反而更慢的原因（GIL 争用）、守护线程的退出语义，以及线程创建的开销。
    requires:
    - concurrency.gil
  - id: concurrency.locks-races
    core: true
    title: 竞态条件与同步原语：`Lock`、`RLock`、`Condition`、`Event`、`Semaphore`
    summary: 理解 `x += 1` 不是原子操作、内建容器的单个方法在 GIL 下原子但复合操作不是、死锁的四个条件与锁顺序，以及线程安全的单例/计数器实现。
    requires:
    - concurrency.threads
  - id: concurrency.queues
    title: "`queue.Queue` 与生产者-消费者：用队列把状态收敛到一个线程"
    summary: 掌握线程安全队列的阻塞语义、`join()`/`task_done()`、哨兵值关闭，以及"无共享状态"比加锁更可靠的设计原则。
    requires:
    - concurrency.locks-races
  - id: concurrency.multiprocessing
    core: true
    title: 多进程：`multiprocessing`、fork vs spawn、pickle 边界与共享内存
    summary: 理解进程绕过 GIL 实现真并行、参数与返回值必须可 pickle、fork 在多线程程序中的危险与 3.14 起 POSIX 默认 forkserver（Windows/macOS 仍是 spawn）、`shared_memory` 与 `Manager` 的取舍。
    requires:
    - concurrency.gil
  - id: concurrency.executors
    core: true
    title: "`concurrent.futures`：`ThreadPoolExecutor` vs `ProcessPoolExecutor`、`map` 与 `as_completed`"
    summary: 掌握执行器的统一接口、`submit` 返回 Future、`map` 保序而 `as_completed` 先完成先出、异常在 `.result()` 时抛出，以及如何按 I/O 或 CPU 密集选执行器。
    requires:
    - concurrency.threads
    - concurrency.multiprocessing
  - id: concurrency.free-threading
    title: 自由线程（PEP 703，3.13 实验版）与子解释器（PEP 734）
    summary: 理解 `--disable-gil` 构建如何用偏向引用计数与每对象锁替代 GIL、单线程约 1–8% 开销与 C 扩展兼容问题，以及子解释器提供的另一条多核路径。
    requires:
    - concurrency.gil
  - id: concurrency.choosing
    core: true
    title: 选型：I/O 密集 vs CPU 密集、线程 / 进程 / asyncio 的决策树
    summary: 能在面试里用一句话给出结论：阻塞库 + I/O 用线程，CPU 用进程或换成 NumPy/DuckDB，高并发 I/O 且有 async 库用 asyncio，并说出每种选择的代价。
    requires:
    - concurrency.executors
- id: asyncio
  core: true
  title: asyncio 异步编程
  summary: 单线程事件循环上的协作式多任务：协程、任务与 Future 的关系，`await` 让出控制权的机制，取消与超时，以及与线程和阻塞代码的交界。
  order: 7
  children:
  - id: asyncio.event-loop
    core: true
    title: 事件循环：单线程协作式多任务如何工作
    summary: 理解事件循环维护就绪队列与 I/O 选择器（selectors）、协程在 `await` 处让出、CPU 密集代码会卡住整个循环，以及 `asyncio.run()` 创建并关闭循环。
    requires:
    - iteration.yield-from
  - id: asyncio.coroutines-tasks
    core: true
    title: 协程、`await` 与 `Task`：调用协程函数只得到协程对象
