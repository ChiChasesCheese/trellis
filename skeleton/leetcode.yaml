  - id: strings.string
    title: 字符串（String）
    summary: Buddy Strings：如何用 O(n) 判断能否通过一次交换让 s 变成 goal？
  - id: strings.subsequence-automaton
    title: 子序列自动机（subsequence-automaton）
    summary: 固定文本面对大量“某串是否为其子序列”的查询时，建立 子序列自动机。
  - id: strings.suffix-array
    title: 后缀数组（suffix-array）
    summary: 题目核心是“所有后缀的字典序”或最长重复子串时，考虑 后缀数组。
  - id: strings.suffix-automaton
    title: 后缀自动机（suffix-automaton）
    summary: 要在线处理一个字符串的全部子串、不同子串数或出现次数时，考虑 后缀自动机。
  - id: strings.trie-and-xor-trie
    title: Trie（trie-and-xor-trie）
    summary: 大量字符串共享前缀并需查询前缀或完整词时，用 Trie。
  - id: strings.trie-prefix-tree
    title: Trie 字典树（trie-prefix-tree）
    summary: 大量字符串需要反复按公共前缀查询或计数时，使用 Trie 字典树。
  - id: strings.z-function-lcp
