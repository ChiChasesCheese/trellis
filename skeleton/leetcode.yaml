    summary: 两个数组可各自重排，目标为配对乘积和时，使用 排序不等式。
  - id: greedy-sorting.regret-greedy-heap
    title: 堆维护反悔贪心（regret-greedy-heap）
    summary: 按序选择但后来的元素可能替换旧选择，并且需快速删掉最差旧选择时，用 堆维护反悔贪心。
  - id: greedy-sorting.regret-greedy-with-heap
    title: 反悔贪心（regret-greedy-with-heap）
    summary: 先选局部最优、后续可能以更好候选替换历史最差选择时，用 反悔贪心。
  - id: greedy-sorting.separate-identical-items
