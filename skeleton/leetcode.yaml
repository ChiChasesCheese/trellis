  - id: strings.palindrome-enumeration
    title: 镜像前半部分（palindrome-enumeration）
    summary: 候选必须是回文数时，应通过 镜像前半部分 构造，而非扫描全部整数。
  - id: strings.polynomial-string-hash
    title: 字符串哈希（polynomial-string-hash）
