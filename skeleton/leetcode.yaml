  - id: math-number-theory.inclusion-exclusion
    title: 容斥原理（inclusion-exclusion）
    summary: 多个条件集合有重叠，要求“至少满足一个”时，使用 容斥原理。
  - id: math-number-theory.lagrange-interpolation
    title: 拉格朗日插值（lagrange-interpolation）
    summary: 已知函数是低次数多项式且给出足够样本点时，可用 拉格朗日插值 外推。
  - id: math-number-theory.linear-algebra
    title: 线性代数（Linear Algebra）
    summary: 如何计算两个稀疏矩阵 mat1 (m1×n1) 和 mat2 (m2×n2) 的乘积？（暴力做法）。
  - id: math-number-theory.manhattan-chebyshev-transform
    title: 曼哈顿距离转切比雪夫距离（manhattan-chebyshev-transform）
    summary: 二维点集的最大曼哈顿距离，可转化为维护 x+y 与 x-y 的极差。
  - id: math-number-theory.math
    title: 数学（Math）
    summary: 脑筋急转弯类构造题：题目问「能否构造出某种数组」时，先想清楚极端情况——是否无论输入什么都恒成立？
  - id: math-number-theory.mobius-inversion
    title: 莫比乌斯反演（mobius-inversion）
    summary: 已知“被 d 整除”的统计，想得到 gcd 恰为 1 的统计时，可使用 莫比乌斯反演。
  - id: math-number-theory.mod-add-mul-identity
    title: 取模的加乘同余律（mod-add-mul-identity）
    summary: 当题目要求结果对 1e9+7 取模，且计算过程含有连续的加法或乘法时，应该在循环内部的每一步取模，而不是等到最后再取模。
  - id: math-number-theory.modular-combinatorics
    title: 模意义下的组合计数（modular-combinatorics）
    summary: 相同球分到 k 个可为空的盒子且总数为 n，方案数是 C(n+k-1,k-1)。
  - id: math-number-theory.modular-inverse-fermat
    title: 费马小定理（modular-inverse-fermat）
    summary: 推导出的公式包含除法且模数是质数（如 1e9+7）时，应联想到用费马小定理求模逆元，把除法转换成乘法。
  - id: math-number-theory.modular-residue-enumeration
    title: 同余类（modular-residue-enumeration）
    summary: 条件只依赖个位或余数、而模数很小时，应枚举 同余类 而不是枚举目标值。
  - id: math-number-theory.monotone-chain-convex-hull
    title: Andrew 单调链（monotone-chain-convex-hull）
    summary: 需要二维点集的最小凸包边界时，可用 Andrew 单调链。
  - id: math-number-theory.negative-mod-normalization
    title: 负数取模规范化（negative-mod-normalization）
    summary: 在 C++/Java 等语言中，对负数取模可能得到负结果，此时应使用 (x mod m + m) mod m 将结果规范到 [0, m-1]。
  - id: math-number-theory.number-theory
    title: 数论（Number Theory）
    summary: 如何用 BFS 求解“通过质数传送到达终点的最少跳数”问题（如 LC 3629）？
  - id: math-number-theory.prime-exponent-prefix-sums
    title: 质因子指数前缀和（prime-exponent-prefix-sums）
    summary: 乘积目标能按元素拆成质因子幂之和时，用 质因子指数前缀和。
  - id: math-number-theory.prime-factorization
    title: 质因数指数（prime-factorization）
    summary: 题目中的乘积、整除关系能按质数独立处理时，应转成 质因数指数。
  - id: math-number-theory.prime-factorization-sieve
    title: 质因数分解（prime-factorization-sieve）
    summary: 整除、互质或乘积的因子性质是核心时，考虑 质因数分解。
  - id: math-number-theory.prime-sieve-and-divisor-enumeration
    title: 埃氏筛（prime-sieve-and-divisor-enumeration）
    summary: 需要批量判断 0..n 中的质数时，用 埃氏筛。
  - id: math-number-theory.prime-test
    title: 试除到平方根（prime-test）
    summary: 判断单个整数是否为质数且 n 不大时，可使用 试除到平方根。
- id: bitwise-tricks
  title: 位运算技巧（bitwise tricks / bitmask）
  summary: 用位掩码枚举子集、按位贡献法与线性基等技巧处理位运算相关的计数与构造问题。
  order: 17
  children:
  - id: bitwise-tricks.and-or-logtrick
    title: 按右端点维护去重后缀聚合值（and-or-logtrick）
    summary: 需要处理所有子数组的不同 AND/OR 值，且 n² 枚举过慢时，用 按右端点维护去重后缀聚合值。
  - id: bitwise-tricks.binary-trie-xor
    title: 异或最大（binary-trie-xor）
    summary: 需要在数集合中寻找与 x 异或最大 的元素时，用 0-1 字典树。
  - id: bitwise-tricks.bit-contribution-counting
    title: 按位贡献法（bit-contribution-counting）
    summary: 当答案是大量 AND/OR/XOR 结果的总和，并且每一位可独立判断时，用 按位贡献法 把问题拆成计数。
  - id: bitwise-tricks.bit-manipulation
    title: 位运算（Bit Manipulation）
    summary: 如何求一个整数 num 的按位补数（Number Complement）？核心技巧是什么？
  - id: bitwise-tricks.bit-mask-operations
    title: 位掩码（bit-mask-operations）
    summary: 当状态只是多个“是否选择”的布尔量，且需要快速合并或修改时，优先考虑用 位掩码 表示状态。
  - id: bitwise-tricks.bitmask
    title: 状态压缩（Bitmask）
    summary: 回溯解决「划分为k个相等的子集」(LC 698) 时，如何用状态压缩剪枝减少无效搜索？
  - id: bitwise-tricks.bitmask-enumeration-and-bitwise-window
    title: 二进制掩码枚举（bitmask-enumeration-and-bitwise-window）
    summary: 当选取对象数量很小且每个对象只有选/不选两种状态时，可用 二进制掩码枚举。
  - id: bitwise-tricks.bitwise-and-or-monotonicity
    title: 减少（bitwise-and-or-monotonicity）
    summary: 不断向区间加入数并聚合时，累计 AND 的 1 位只会 减少，累计 OR 的 1 位只会 增加。
  - id: bitwise-tricks.bitwise-greedy-and-bitmask-parity
    title: XOR 位掩码（bitwise-greedy-and-bitmask-parity）
    summary: 属性出现次数只影响奇偶性时，可用 XOR 位掩码 压缩状态。
  - id: bitwise-tricks.bitwise-greedy-construction
    title: 从高位到低位的试填贪心（bitwise-greedy-construction）
    summary: 要最大化一个按位定义的整数，且能验证候选掩码是否可行时，用 从高位到低位的试填贪心。
  - id: bitwise-tricks.bitwise-prefix-xor
    title: 前缀异或频次（bitwise-prefix-xor）
    summary: 统计子数组 XOR 为零的数量时，用 前缀异或频次。
  - id: bitwise-tricks.enumerate-nonempty-subsets-of-mask
    title: 枚举子集的非空子集（enumerate-nonempty-subsets-of-mask）
    summary: 当需要枚举一个具体集合 s（而非全集）的所有非空子集时，应使用 sub = (sub - 1) & s 这一跳转公式，而不是对全集逐个整数枚举再。
  - id: bitwise-tricks.enumerate-subsets-including-empty
    title: 之后（enumerate-subsets-including-empty）
    summary: 当题目要求枚举集合 s 的所有子集且明确包含空集时，应在非空子集枚举模板基础上，把空集判断放在处理逻辑之后再决定是否退出循环。
  - id: bitwise-tricks.enumerate-supersets-of-mask
    title: 枚举掩码的超集（enumerate-supersets-of-mask）
    summary: 当需要枚举某个集合 t 的所有超集（在大小为 n 的全集范围内）时，应使用 s = (s + 1) | t 递推公式，而不是对全集所有子集逐一过。
  - id: bitwise-tricks.iterate-set-bits
    title: lowbit 剥离法（t & -t）（iterate-set-bits）
    summary: 当集合是稀疏的（全集范围很大但集合内元素很少）时，遍历集合元素应优先选择 lowbit 剥离法（t & -t），而不是对 0..n-1 逐位扫描。
  - id: bitwise-tricks.lowbit-and-bit-library-functions
    title: lowbit 与位运算库函数（lowbit-and-bit-library-functions）
    summary: 看到需要反复剥离整数二进制表示的最低位 1（例如逐一取出集合最小元素）时，应联想到 lowbit = s & -s 这一固定写法。
  - id: bitwise-tricks.set-bitwise-set-operations
    title: 位运算做集合运算（set-bitwise-set-operations）
    summary: 当问题涉及判断两个用整数表示的集合是否存在交集、并集或子集关系时，应联想到直接用 按位与(&)/按位或(|)/按位异或(^) 对二进制表示运算，。
  - id: bitwise-tricks.set-element-bitwise-ops
    title: 位运算判断集合成员（set-element-bitwise-ops）
    summary: 当需要判断整数 i 是否属于位压缩集合 s 时，应使用 (s >> i) & 1 而不是遍历集合逐一比较。
  - id: bitwise-tricks.xor-linear-basis
    title: XOR 线性基（xor-linear-basis）
    summary: 从很多数中任选子集并最大化 XOR，且位数远小于元素数时，使用 XOR 线性基。
  - id: bitwise-tricks.xor-parity-cancellation
    title: 全部元素的 XOR（xor-parity-cancellation）
    summary: 数组中其余数都出现偶数次、只有一个数未配对时，用 全部元素的 XOR 可直接得到该数。
  - id: bitwise-tricks.xor-range-construction
    title: 严格大于 n 的最小 2 的幂（xor-range-construction）
    summary: 在 XOR 值域构造问题中，若 n >= 3，可能的 XOR 结果集合恰好覆盖 严格大于 n 的最小 2 的幂 减一为止的完整区间；这是因为所有。
- id: strings
