    summary: 最大化不相交区间数或最少点刺穿区间时，标准排序键是 右端点升序。
  - id: greedy-sorting.lexicographic-greedy
    title: 最早能不同的位置（lexicographic-greedy）
    summary: 目标优化字典序时，优先优化 最早能不同的位置。
  - id: greedy-sorting.median-minimize-l1
    title: 中位数（median-minimize-l1）
    summary: 目标为最小化 sum(abs(x-target)) 时，target 取 中位数。
  - id: greedy-sorting.merge-intervals
    title: 左端点升序（merge-intervals）
    summary: 要求合并重叠区间或求区间并集时，先按 左端点升序 排序。
  - id: greedy-sorting.minimum-interval-cover
    title: 右端点最远（minimum-interval-cover）
    summary: 最少区间连续覆盖目标线段时，在所有左端点不超过当前前沿的区间中选 右端点最远 的。
  - id: greedy-sorting.palindrome-frequency-greedy
    title: 奇偶性（palindrome-frequency-greedy）
    summary: 可重排字符构造回文时，先关注每个字符频次的 奇偶性。
  - id: greedy-sorting.product-and-inequality-greedy
    title: 尽量均衡（product-and-inequality-greedy）
    summary: 固定正数总和并最大化乘积时，优先让各部分 尽量均衡。
  - id: greedy-sorting.rearrangement-inequality
