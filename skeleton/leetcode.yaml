    summary: 已能表示的目标是连续前缀，且要最少补资源扩张覆盖时，用 区间覆盖贪心。
  - id: greedy-sorting.heap-regret-lazy-and-dual
    title: 反悔堆（heap-regret-lazy-and-dual）
