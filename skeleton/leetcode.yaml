- id: greedy-sorting
  title: 贪心与排序构造（greedy / sorting constructions）
  summary: 用交换论证证明贪心的正确性，涵盖区间调度、反悔堆、字典序构造与排序不等式等贪心套路。
  order: 15
  children:
