    summary: 相邻不同重排可行当且仅当 m <= n-m+1。
  - id: greedy-sorting.sorted-extremal-pairing
    title: 最小或最大元素（sorted-extremal-pairing）
    summary: 极值配对贪心的核心不变式是：已处理的 最小或最大元素 已在某个最优解中完成处理。
  - id: greedy-sorting.sorting
