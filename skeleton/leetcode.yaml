  - id: greedy-sorting.induction-greedy-proof
    title: 数学归纳法（induction-greedy-proof）
    summary: 贪心每步移除一个对象且剩余问题同构时，可用 数学归纳法 证明正确性。
  - id: greedy-sorting.interval-grouping-heap
