domain: leetcode
title: LeetCode
lang: zh
vault: interviews/rounds/leetcode
nodes:
- id: fundamentals
  title: 刷题方法论与复杂度预估（problem-solving meta）
  summary: 建立数据范围反推复杂度、专题螺旋刷题、卡壳后暂离等元认知习惯，作为后续所有专题的思维框架。
  order: 1
  children:
  - id: fundamentals.complexity-budget-from-constraints
    title: 数据范围反推允许的时间复杂度（complexity-budget-from-constraints）
    summary: 题目给出数据范围但不确定用什么复杂度算法时，应先用数据范围反推允许的时间复杂度来缩小候选算法范围。
  - id: fundamentals.equivalence-transformation
    title: 等价转化（equivalence-transformation）
    summary: 原目标难直接优化，但补集或另一种表示更简单时，尝试 等价转化。
  - id: fundamentals.incubation-effect-when-stuck
    title: 十分钟到数小时（incubation-effect-when-stuck）
    summary: 当一道题思考十分钟到数小时仍没有思路时，应该考虑暂离问题而不是持续死磕。
  - id: fundamentals.randomized-algorithms
    title: 随机化（randomized-algorithms）
    summary: 要打散可能对抗的输入顺序或选随机枢轴时，可使用 随机化。
  - id: fundamentals.reverse-thinking
    title: 目标状态倒推前驱（reverse-thinking）
    summary: 正向操作分支大而终态明确时，尝试从 目标状态倒推前驱。
  - id: fundamentals.special-case-to-general
    title: 证明或反例检验（special-case-to-general）
    summary: 从特殊到一般得到的规律，必须经过 证明或反例检验 才能用于算法。
  - id: fundamentals.topic-based-spiral-practice
    title: 不知道从哪道题入手（topic-based-spiral-practice）
    summary: 当发现自己面对新专题不知道从哪道题入手，且题目难度分布悬殊时，应采用专题螺旋式刷题法而非随机刷题。
  - id: fundamentals.topic-to-random-transfer-training
    title: 无法判断题目属于哪种算法类型（topic-to-random-transfer-training）
    summary: 当刷题者已完成专题训练，却在比赛中无法判断题目属于哪种算法类型（例如把动态规划误判为贪心）时，说明需要补充随机训练。
- id: arrays-hash-prefix
  title: 数组、哈希与前缀和（arrays / hashing / prefix sum）
  summary: 用哈希计数、前缀和与贡献法处理数组上的统计与子数组问题，是几乎所有专题的地基。
  order: 2
  children:
  - id: arrays-hash-prefix.array-index-as-hash
    title: 用数组下标充当哈希表（array-index-as-hash）
    summary: 在 442 题的负号标记解法中，遍历到当前槽位的值时必须取 abs(value) 而不能直接用 value，因为该槽位可能早已被之前遇到的某个值。
  - id: arrays-hash-prefix.boyer-moore-majority-vote-algorithm
    title: 摩尔投票算法（Boyer–Moore Majority Vote Algorithm）
    summary: 求数组中出现次数超过 n/2 的多数元素，如何在 O(n) 时间、O(1) 空间内解决？
  - id: arrays-hash-prefix.contribution-counting
    title: 贡献法（contribution-counting）
    summary: 需要统计所有子数组或子串的总值，且单个元素可独立计值时，用 贡献法。
  - id: arrays-hash-prefix.counting
    title: 计数（Counting）
    summary: 给定字符串 s 和整数 k，要求删除最少字符使得剩余字符串中不同字符种类数 ≤ k，如何贪心求解？
  - id: arrays-hash-prefix.difference-array
    title: 差分数组（difference-array）
    summary: 当题目要求对数组的若干个连续子区间分别整体加上某个值，且所有更新可以离线处理、最后统一输出结果时，应使用 差分数组 技巧；若更新和查询交替进行则。
  - id: arrays-hash-prefix.enumerate-middle-and-diagonals
    title: 枚举中间 j（enumerate-middle-and-diagonals）
    summary: i<j<k 的左右计算互不依赖时，优先 枚举中间 j。
  - id: arrays-hash-prefix.enumerate-right-maintain-left
    title: 枚举右端并维护左侧状态（enumerate-right-maintain-left）
    summary: 当约束是 i<j 且右端元素能推出左端所需状态时，用 枚举右端并维护左侧状态。
  - id: arrays-hash-prefix.enumeration
    title: 枚举（Enumeration）
    summary: 数组中，一部分数字之和等于另一部分的固定倍数关系（如“special 数字之和 = outlier 之外所有数的和”），如何枚举求解？
  - id: arrays-hash-prefix.grouping-loop
    title: 分组循环（grouping-loop）
    summary: 当数组按规则被分割成若干组,且每组处理逻辑相同时,应使用分组循环,避免对最后一组做特判。
  - id: arrays-hash-prefix.hash-table
    title: 哈希表（Hash Table）
    summary: 如何在 O(n) 时间、O(1) 空间内求数组中缺失的最小正整数（First Missing Positive）？
  - id: arrays-hash-prefix.kadane-maximum-subarray
    title: 连续（kadane-maximum-subarray）
    summary: 求最大 连续 子数组和时，使用 Kadane。
  - id: arrays-hash-prefix.kadane-variant
    title: kadane variant
    summary: 在股票买卖一次求最大利润问题中，将 prices 转化为相邻差分数组后，用 Kadane 思想求最大子数组和；核心递推是 cur = max(0,。
  - id: arrays-hash-prefix.moore-voting
    title: 摩尔投票法（moore-voting）
    summary: 数组中若存在出现次数严格超过一半的元素，可用 摩尔投票法。
  - id: arrays-hash-prefix.prefix-suffix-and-difference
    title: 差分数组（prefix-suffix-and-difference）
    summary: 有大量“给区间统一加值，最后查看数组”的操作时，用 差分数组。
  - id: arrays-hash-prefix.prefix-suffix-and-difference-array
    title: 前后缀分解（prefix-suffix-and-difference-array）
    summary: 切分点答案能写成左侧聚合与右侧聚合组合时，用 前后缀分解。
  - id: arrays-hash-prefix.prefix-suffix-decomposition
    title: 前后缀分解（prefix-suffix-decomposition）
    summary: 每个切分点的答案能由左右两侧独立信息合成时，用 前后缀分解。
  - id: arrays-hash-prefix.prefix-sum
    title: 前缀和（Prefix Sum）
    summary: 给定数组，需要对每个下标 i 同时知道「前缀最值」和「后缀最值」，如何在 O(n) 内完成？
  - id: arrays-hash-prefix.prefix-sum-and-prefix-hash
    title: 前缀和或前缀状态（prefix-sum-and-prefix-hash）
    summary: 子数组条件能写成两个累计状态之差时，用 前缀和或前缀状态。
  - id: arrays-hash-prefix.prefix-sum-difference-array
    title: 差分数组（prefix-sum-difference-array）
    summary: 大量区间加法、最后再读取数组时，用 差分数组。
  - id: arrays-hash-prefix.prefix-sum-hash-counting
    title: 前缀和加哈希计数（prefix-sum-hash-counting）
    summary: 区间条件能改写为两个前缀状态的关系时，用 前缀和加哈希计数。
  - id: arrays-hash-prefix.prefix-sum-parity
    title: ±1（prefix-sum-parity）
    summary: 在计数满足条件子数组的前缀和技巧中，将原数组转化为 ±1 序列（符合条件记为+1，不符合记为-1）后，子数组[i,j]满足条件当且仅当 {{c2。
  - id: arrays-hash-prefix.two-dimensional-prefix-and-difference
    title: 二维前缀和（two-dimensional-prefix-and-difference）
    summary: 静态矩阵的重复矩形求和，用 二维前缀和。
  - id: arrays-hash-prefix.two-dimensional-prefix-sum
    title: 不再被修改（two-dimensional-prefix-sum）
    summary: 当需要对不再被修改的矩阵进行多次子矩阵元素和查询时，应预处理二维前缀和以将每次查询降到O(1)。
  - id: arrays-hash-prefix.two-directional-scans
    title: 从左到右与从右到左各扫描一次（two-directional-scans）
    summary: 每个位置同时依赖左边和右边信息时，使用 从左到右与从右到左各扫描一次。
- id: two-pointers-window
  title: 双指针与滑动窗口（two pointers / sliding window）
  summary: 用相向、同向或背向指针以及定长/变长窗口，把区间统计问题从平方级降到线性级。
  order: 3
  children:
  - id: two-pointers-window.count-subarrays-expand-valid
    title: 越长越合法的计数滑窗（count-subarrays-expand-valid）
    summary: 统计满足条件的子数组个数,且条件满足'子数组越长越合法'时,应使用越长越合法的计数滑窗,每轮累加left。
  - id: two-pointers-window.count-subarrays-shrink-valid
    title: 越短越合法的计数滑窗（count-subarrays-shrink-valid）
    summary: 统计满足条件的子数组个数,且条件满足'子数组越短越合法'时,应使用越短越合法的计数滑窗,每轮累加right - left + 1。
  - id: two-pointers-window.divergent-two-pointers
    title: 背向双指针（divergent-two-pointers）
    summary: 需要以某个中心位置向左右两侧扩展探测(如回文中心扩展法)时,应使用背向双指针。
  - id: two-pointers-window.exactly-k-via-two-at-least
    title: 两个'至少'问题相减（exactly-k-via-two-at-least）
    summary: 当题目要求统计子数组和'恰好等于k'的个数,而直接维护该条件不具有单调性时,应把问题转化为两个'至少'问题相减。
  - id: two-pointers-window.expand-window-for-shortest
    title: 扩张式滑动窗口求最短（expand-window-for-shortest）
    summary: 题目要求'最短/最小的满足某条件的子数组',且窗口越长越容易满足条件时,应使用扩张式(越长越合法)的不定长滑动窗口。
  - id: two-pointers-window.fixed-length-sliding-window
    title: k（fixed-length-sliding-window）
    summary: 定长滑动窗口的核心不变量是:完成入队操作后,窗口[left, right]的长度恒等于k。
  - id: two-pointers-window.opposite-direction-two-pointers
    title: 相向双指针（opposite-direction-two-pointers）
    summary: 数组反转、有序数组两数之和等需要从两端向中间处理的场景,应使用相向双指针。
  - id: two-pointers-window.same-direction-two-pointers
    title: 同向双指针（same-direction-two-pointers）
    summary: 滑动窗口本质上是同向双指针的一种特例,右指针负责扩展、左指针负责收缩。
  - id: two-pointers-window.shrink-window-for-longest
    title: 收缩式滑动窗口求最长（shrink-window-for-longest）
    summary: 题目要求'最长/最大的满足某条件的子数组',且窗口越长越容易破坏条件时,应使用收缩式(越短越合法)的不定长滑动窗口。
  - id: two-pointers-window.sliding-window
    title: 滑动窗口（sliding-window）
    summary: 当连续区间的约束能靠右移左端点恢复，优先考虑 滑动窗口。
  - id: two-pointers-window.sliding-window-frequency-map
    title: 滑动窗口配合频次表（sliding-window-frequency-map）
    summary: 在 Sliding Window With Frequency Map 模板中，right 右移时先 freq[s[right]] += 1，一。
  - id: two-pointers-window.sliding-window-two-pointers
    title: 滑动窗口（sliding-window-two-pointers）
    summary: 连续区间约束可随端点移动增量维护，且失效后收缩左端能恢复条件时，用 滑动窗口。
  - id: two-pointers-window.three-pointer-sliding-window
    title: 三指针滑动窗口（three-pointer-sliding-window）
    summary: 当恰好型滑窗需要调用两次结构相同、仅阈值不同的滑窗函数时,可以合并为一次遍历的三指针滑动窗口。
  - id: two-pointers-window.two-pointers
    title: 双指针（Two Pointers）
    summary: 有序数组原地去重（LeetCode 26），双指针怎么设计？
  - id: two-pointers-window.two-pointers-and-group-scan
    title: 分组循环（two-pointers-and-group-scan）
    summary: 相邻关系决定状态、且每段可独立结算时，用 分组循环 一次扫描极大段。
  - id: two-pointers-window.two-pointers-and-sliding-window
    title: 双指针与可变滑动窗口（two-pointers-and-sliding-window）
    summary: 连续区间问题中，若右端扩张后能靠不断移动左端恢复条件，应考虑 双指针/可变滑动窗口。
  - id: two-pointers-window.two-pointers-sliding-window
    title: 滑动窗口（two-pointers-sliding-window）
    summary: 连续区间约束能通过加入或删除一个元素维护，并且左右端点只前进时，用 滑动窗口。
  - id: two-pointers-window.two-pointers-sorted-array
    title: 有序数组上的双指针（two-pointers-sorted-array）
    summary: 在排序数组上做 Two Pointers 时，循环条件应为 l < r（严格小于），且每次跳过重复元素的检查应该在 移动指针之后。
- id: binary-search
  title: 二分查找与二分答案（binary search）
  summary: 从有序数组上的二分模板扩展到「二分答案」，把最优化问题转化为单调性判定问题。
  order: 4
  children:
  - id: binary-search.binary-search
    title: 二分答案（binary-search）
    summary: 当“答案不超过 x 是否可行”随 x 单调变化时，应使用 二分答案。
  - id: binary-search.binary-search-answer-maximize
    title: x 越小越容易满足（binary-search-answer-maximize）
    summary: 题目形如“求最大的 x 使得某条件成立”，且该条件是x 越小越容易满足时，用二分答案求最大值，check 为真时更新的变量就是最终答。
  - id: binary-search.binary-search-answer-minimize
    title: 单调性（binary-search-answer-minimize）
    summary: 题目形如“求最小的 x 使得某条件成立”，且条件关于 x 具有单调性（越大越容易满足）时，应使用二分答案而非直接搜索。
  - id: binary-search.binary-search-indirect-target
    title: 单调对应（binary-search-indirect-target）
    summary: 当直接对答案设计单调 check 很困难，但存在一个与答案单调对应的中间变量时，应改为二分这个代理值。
  - id: binary-search.binary-search-kth-smallest-largest
    title: 二分答案（binary-search-kth-smallest-largest）
    summary: 题目要求“第 k 小/第 k 大的值”，且能设计出关于 x 单调的计数函数时，可将其转化为二分答案问题，其中第 k 小等价于求满足 count(。
  - id: binary-search.binary-search-lower-bound
    title: 非递减（排序）（binary-search-lower-bound）
    summary: 当数组已经非递减（排序），且题目问某值的第一个/最后一个位置或某比较关系的元素个数时，考虑用 lowerBound 转化。
  - id: binary-search.binary-search-maximize-minimum
    title: 最大化最小值（binary-search-maximize-minimum）
    summary: 题目要求“选取/分配后使最小值尽可能大”时，属于最大化最小值模式，本质是二分答案求最大。
  - id: binary-search.binary-search-minimize-maximum
    title: 最小化最大值（binary-search-minimize-maximum）
    summary: 题目要求“分组/分配后使每组的最大值尽可能小”时，属于最小化最大值模式，本质是二分答案求最小。
  - id: binary-search.binary-search-on-answer
    title: 二分答案（binary-search-on-answer）
    summary: 优化题能在给定阈值时判断可行，并且结果单调时，用 二分答案。
  - id: binary-search.binary-search-red-blue
    title: 红蓝分区二分模板（binary-search-red-blue）
    summary: 在红蓝分区二分模板（while l < r）中，若mid被判断为红色（不满足条件），执行 l = mid + 1；若mid被判断为蓝色（满足条件。
  - id: binary-search.binary-search-sort-then-search
    title: 无序（binary-search-sort-then-search）
    summary: 当数据本身无序，但排序后能建立单调关系以便二分时，应先对数组做 排序 再复用二分查找模板。
  - id: binary-search.ternary-search-unimodal
    title: 单峰（ternary-search-unimodal）
    summary: 当目标函数关于自变量是单峰（先增后减）而非单调时，二分答案的 check 无法直接使用，应改用三分法。
- id: stack-queue-monotonic
  title: 栈、队列与单调结构（stack / queue / monotonic structures）
  summary: 用单调栈、单调队列与普通栈处理「下一个更大/更小元素」「表达式解析」等结构化匹配问题。
  order: 5
  children:
  - id: stack-queue-monotonic.largest-rectangle-histogram
    title: 直方图最大矩形（largest-rectangle-histogram）
    summary: 答案形如“区间最小高度 × 区间宽度”的最大化问题，常转成 直方图最大矩形。
  - id: stack-queue-monotonic.monotonic-queue
    title: 单调双端队列（monotonic-queue）
    summary: 滑动窗口不断右移且每次要最大值或最小值时，用 单调双端队列。
  - id: stack-queue-monotonic.monotonic-stack
    title: 单调栈（monotonic-stack）
    summary: 寻找每个元素左侧或右侧第一个更大/更小元素时，用 单调栈。
  - id: stack-queue-monotonic.monotonic-stack-and-contribution
    title: 单调栈（monotonic-stack-and-contribution）
    summary: 需要每个位置左、右第一个更大或更小边界时，用 单调栈。
  - id: stack-queue-monotonic.monotonic-stack-and-queue
    title: 单调栈（monotonic-stack-and-queue）
    summary: 要求每个位置的“下一个更大/更小元素”时，优先想到 单调栈。
  - id: stack-queue-monotonic.monotonic-stack-boundaries
    title: 单调栈（monotonic-stack-boundaries）
    summary: 要求每个元素的第一个更小或更大邻居、或其贡献边界时，用 单调栈。
  - id: stack-queue-monotonic.monotonic-stack-contribution
    title: 枚举元素贡献（monotonic-stack-contribution）
    summary: 求所有子数组最小值或最大值之和时，应把“枚举子数组”改成 枚举元素贡献。
  - id: stack-queue-monotonic.monotonic-stack-greedy
    title: 单调栈贪心构造（monotonic-stack-greedy）
    summary: 在单调栈贪心构造字典序最小子序列时，只有当栈顶元素 大于当前字符 ch 且 remainings[栈顶元素] > 0 时才能弹出。
  - id: stack-queue-monotonic.monotonic-stack-lexicographic-subsequence
    title: 贪心单调栈（monotonic-stack-lexicographic-subsequence）
    summary: 保持原相对顺序并要求字典序最小、且选择可撤销时，使用 贪心单调栈。
  - id: stack-queue-monotonic.monotonic-stack-nearest-boundary
    title: 单调栈（monotonic-stack-nearest-boundary）
    summary: 当题目要批量求每个元素一侧最近的更大或更小元素时，优先考虑 单调栈。
  - id: stack-queue-monotonic.queue-bfs-and-deque
    title: BFS 队列（queue-bfs-and-deque）
    summary: 无权图中求最少边数最短路，用 BFS 队列。
  - id: stack-queue-monotonic.stack
    title: 栈（Stack）
    summary: 如何在一次遍历中计算含 +、-、*、/ 的表达式（无括号）？
  - id: stack-queue-monotonic.stack-parsing-and-cancellation
