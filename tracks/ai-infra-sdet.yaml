# Role track: AI-infrastructure SDET (testing, integration and release of an AI inference stack).
# The knowledge such interviews probe, 80/20, in reading order: AI from zero first, then the role's core (test strategy,
# release engineering), inference, accelerators, ML/LLM system design, related design questions, Python, debugging,
# coding, reliability, behaviour. Built from one role's skill map (192 points weighted by how likely and how central).
# Reuse it for any company with an overlay (scripts/track_plan.py); sibling tracks reorder the same sections for
# inference-infrastructure or inference-deployment roles.
