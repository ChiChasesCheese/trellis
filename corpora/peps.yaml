# Python Enhancement Proposals (peps.python.org, public domain / open licence): the design
# documents behind the language features the `python` skeleton teaches — each PEP explains the
# motivation and rejected alternatives that interview follow-ups probe.
title: "PEP：语言特性的设计文档"
author: "Python core developers"
license: free-online
domain: python
