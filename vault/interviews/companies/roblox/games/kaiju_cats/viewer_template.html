<title>Kaiju Cats Plan Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef0f7; --panel:#ffffff; --ink:#1b2340; --muted:#5b6485; --line:#d5d9e8;
  --board:#26335f; --board-line:#34457a; --tile:#3a4a80; --grass:#79bf6b; --grass-dark:#5a9e4f;
  --high:#f2c14e; --high-edge:#c9962a; --low:#f6f3ec; --low-edge:#c8c2b5; --plant:#8b5cf6; --plant-edge:#6d3fd8;
  --mud:#8a5a3c; --spike:#1f2847; --rock:#b9bcc6;
  --cat-R:#e5484d; --cat-G:#2f9e67; --cat-B:#3e63dd;
  --badge:#1f4fd8; --badge-ink:#ffffff; --gone:.4; --accent:#1f4fd8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10152a; --panel:#182040; --ink:#e7eaf6; --muted:#9aa3c6; --line:#2a3563;
  --board:#1a2448; --board-line:#26346a; --tile:#2c3a70; --accent:#7ea2ff; --badge:#3b6cff;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10152a; --panel:#182040; --ink:#e7eaf6; --muted:#9aa3c6; --line:#2a3563;
  --board:#1a2448; --board-line:#26346a; --tile:#2c3a70; --accent:#7ea2ff; --badge:#3b6cff;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Nunito Sans",system-ui,sans-serif;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(26px,4vw,38px)/1.05 "Baloo 2",system-ui,sans-serif;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.chip b{font:800 18px "Baloo 2",sans-serif;margin-left:4px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.boardbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:560px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.controls button{font:700 14px "Nunito Sans",sans-serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.controls button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.controls button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#turn{flex:1;min-width:160px;accent-color:var(--accent)}
.turnlabel{font:800 20px "Baloo 2",sans-serif;min-width:92px;font-variant-numeric:tabular-nums}
aside{display:grid;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font:800 17px "Baloo 2",sans-serif;margin:0 0 8px;letter-spacing:.2px}
.cats{display:grid;gap:8px}
.cat{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.dot{width:14px;height:14px;border-radius:50%}
.cat .pw{font:500 14px "JetBrains Mono",monospace}
.cat small{color:var(--muted);display:block;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{white-space:nowrap;padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
tr.fired td{font-weight:700}
tr.fired td:first-child::before{content:"● ";color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.note{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Kaiju Cats 指令摆放图</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="main">
    <section class="boardbox" aria-label="棋盘">
      <svg id="board" viewBox="0 0 800 640" role="img" aria-label="Kaiju Cats 棋盘与指令"></svg>
      <div class="controls">
        <button class="ghost" id="first" type="button">⏮ 开局</button>
        <button class="ghost" id="prev" type="button">◀ 上一回合</button>
        <button id="play" type="button">▶ 播放</button>
        <button class="ghost" id="next" type="button">下一回合 ▶</button>
        <input id="turn" type="range" min="0" max="15" value="0" aria-label="回合">
        <span class="turnlabel" id="turnlabel"></span>
      </div>
    </section>

    <aside>
      <div class="panel">
        <h2>这一回合结束时</h2>
        <div class="cats" id="cats"></div>
      </div>
      <div class="panel">
        <h2>要放的指令（开局前全部放好）</h2>
        <p class="note" id="cost"></p>
        <div style="overflow-x:auto"><table><thead><tr><th>位置 · 楼层</th><th>指令</th><th>谁在第几回合触发</th></tr></thead><tbody id="cmds"></tbody></table></div>
      </div>
    </aside>
  </div>

  <div class="panel legend" id="legend"></div>
</div>

<script>
const DATA = /*DATA*/null;

const S = 100, OX = 70, OY = 50;           // tile size and board origin inside the viewBox
const ICON = {N:"↑", S:"↓", E:"→", W:"←", stomp:"踩"};
const NAME = {N:"向北", S:"向南", E:"向东", W:"向西", stomp:"Stomp"};
const CATN = {R:"红猫", G:"绿猫", B:"蓝猫"};
const KINDN = {H:"高楼", L:"低楼", P:"发电厂"};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const svg = document.getElementById("board");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;(parent||svg).appendChild(e);return e;}
const cx = c => OX + c*S + S/2, cy = r => OY + r*S + S/2;

const planAt = {};
DATA.plan.forEach(([r,c,f,cmd]) => planAt[`${r},${c},${f}`] = cmd);
const fireTurn = {};                         // floor -> turn it is destroyed (and its command fires)
DATA.events.forEach(([turn,color,r,c,f]) => fireTurn[`${r},${c},${f}`] = [turn,color]);

function drawStatic(){
  el("rect",{x:OX-14,y:OY-14,width:7*S+28,height:5*S+28,rx:22,fill:css("--board")});
  for(let c=0;c<7;c++) el("text",{x:cx(c),y:OY-22,"text-anchor":"middle","font-family":"Baloo 2, sans-serif","font-weight":800,"font-size":18,fill:css("--muted")},null,`第${c}列`);
  for(let r=0;r<5;r++) el("text",{x:OX-24,y:cy(r)+6,"text-anchor":"end","font-family":"Baloo 2, sans-serif","font-weight":800,"font-size":18,fill:css("--muted")},null,`第${r+1}行`);
  el("text",{x:cx(0),y:OY+5*S+36,"text-anchor":"middle","font-size":13,fill:css("--muted")},null,"猫的起点列");
  el("text",{x:cx(6),y:OY+5*S+36,"text-anchor":"middle","font-size":13,fill:css("--muted")},null,"猫窝列");
}

let dyn;
function tileBase(r,c,kind){
  const x=OX+c*S+8,y=OY+r*S+8,w=S-16;
  if(kind==null) return;
  el("rect",{x,y,width:w,height:w,rx:12,fill:css("--tile")},dyn);
  const g = (fill)=>el("rect",{x:x+6,y:y+6,width:w-12,height:w-12,rx:8,fill},dyn);
  if(kind==="grass"||kind.startsWith("start")) g(css("--grass"));
  else if(kind==="mud"){g(css("--mud"));el("text",{x:cx(c),y:cy(r)+6,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"#fff"},dyn,"泥地");}
  else if(kind==="spike"){g(css("--spike"));el("text",{x:cx(c),y:cy(r)+6,"text-anchor":"middle","font-size":15,"font-weight":700,fill:"#fff"},dyn,"尖刺");}
  else if(kind==="boulder"){el("ellipse",{cx:cx(c),cy:cy(r),rx:32,ry:26,fill:css("--rock")},dyn);el("text",{x:cx(c),y:cy(r)+5,"text-anchor":"middle","font-size":14,"font-weight":700,fill:"#333"},dyn,"巨石");}
  else if(kind.startsWith("bed")){const col=kind.slice(-1);el("circle",{cx:cx(c),cy:cy(r),r:30,fill:css("--cat-"+col)},dyn);el("circle",{cx:cx(c),cy:cy(r)+4,r:17,fill:css("--board")},dyn);el("text",{x:cx(c),y:y+w+2,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"#fff"},dyn,CATN[col]+"的窝");}
}

function building(r,c,kind,left){
  const x=OX+c*S+14,w=S-28, floors = kind==="P"?1:2;
  const fill = css(kind==="H"?"--high":kind==="L"?"--low":"--plant"), edge = css(kind==="H"?"--high-edge":kind==="L"?"--low-edge":"--plant-edge");
  const fh = floors===2? 36:52, top = OY+r*S + (S - fh*floors)/2;
  for(let f=0;f<floors;f++){
    const y = top + f*fh, gone = f < floors-left;
    const box = el("rect",{x,y,width:w,height:fh-3,rx:6,fill,stroke:edge,"stroke-width":2,opacity:gone?css("--gone"):1,"stroke-dasharray":gone?"4 3":"none"},dyn);
    const label = kind==="P" ? "×2" : (kind==="H"?"500":"250");
    el("text",{x:x+8,y:y+fh/2+3,"font-size":12,"font-weight":800,fill:kind==="P"?"#fff":"#5a4a1a",opacity:gone?.3:.9},dyn,label);
    const cmd = planAt[`${r},${c},${f}`];
    if(cmd){
      const bx=x+w-16, by=y+fh/2-1.5;
      el("circle",{cx:bx,cy:by,r:12,fill:css("--badge"),stroke:"#fff","stroke-width":2,opacity:gone?.55:1},dyn);
      el("text",{x:bx,y:by+5,"text-anchor":"middle","font-size":cmd==="stomp"?12:15,"font-weight":800,fill:css("--badge-ink")},dyn,ICON[cmd]);
    }
  }
}

function render(t){
  if(dyn) dyn.remove();
  dyn = el("g",{});
  const st = DATA.trace[t];
  DATA.board.forEach((row,r)=>row.forEach((k,c)=>{ if(k && !["H","L","P"].includes(k)) tileBase(r,c,k); }));
  DATA.buildings.forEach(([r,c,kind],i)=>{ tileBase(r,c,"floor"); building(r,c,kind,st.floors[i]); });
  // trails
  ["R","G","B"].forEach(col=>{
    const pts=[]; for(let i=0;i<=t;i++){const k=DATA.trace[i].cats.find(k=>k[0]===col); pts.push(`${cx(k[2])},${cy(k[1])}`);}
    el("polyline",{points:pts.join(" "),fill:"none",stroke:css("--cat-"+col),"stroke-width":5,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.55},dyn);
  });
  // cats (offset if sharing a tile)
  st.cats.forEach(([col,r,c,d,p,status],i)=>{
    const ox=(i-1)*10, x=cx(c)+ox, y=cy(r)+ox*0.6;
    if(status==="out"){el("text",{x,y:y+6,"text-anchor":"middle","font-size":26,fill:css("--cat-"+col)},dyn,"✕");return;}
    el("circle",{cx:x,cy:y,r:17,fill:css("--cat-"+col),stroke:"#fff","stroke-width":3},dyn);
    el("text",{x,y:y+5,"text-anchor":"middle","font-size":14,"font-weight":800,fill:"#fff"},dyn,{R:"红",G:"绿",B:"蓝"}[col]);
    if(status!=="bed"){const a={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]}[d];el("path",{d:`M${x+a[0]*24} ${y+a[1]*24} l${-a[1]*6-a[0]*8} ${a[0]*6-a[1]*8} M${x+a[0]*24} ${y+a[1]*24} l${a[1]*6-a[0]*8} ${-a[0]*6-a[1]*8}`,stroke:"#fff","stroke-width":3,"stroke-linecap":"round"},dyn);}
  });
  document.getElementById("turnlabel").textContent = t===0 ? "开局" : `第 ${t} 回合`;
  document.getElementById("turn").value = t;
  const total = st.cats.filter(k=>k[5]!=="out").reduce((s,k)=>s+k[4],0);
  document.getElementById("cats").innerHTML = st.cats.map(([col,r,c,d,p,status])=>{
    const where = status==="out"?"已阵亡":status==="bed"?`已进窝（第 ${DATA.arrive[col]} 回合，第 ${DATA.order[col]} 个）`:`第${r+1}行第${c}列，面朝${NAME[d].slice(1)}`;
    return `<div class="cat"><span class="dot" style="background:var(--cat-${col})"></span><div>${CATN[col]}<small>${where}</small></div><span class="pw">${fmt(p)}</span></div>`;
  }).join("") + `<div class="cat"><span></span><div><b>合计</b></div><span class="pw"><b>${fmt(total)}</b></span></div>`;
  document.querySelectorAll("#cmds tr").forEach(tr=>tr.classList.toggle("fired", +tr.dataset.turn && +tr.dataset.turn<=t));
}
const fmt = n => Number(n).toLocaleString("zh-CN",{maximumFractionDigits:1});

function init(){
  document.getElementById("sub").textContent = DATA.subtitle;
  document.getElementById("chips").innerHTML =
    `<span class="chip">总分<b>${fmt(DATA.score)}</b></span><span class="chip">花费<b>$${DATA.spent}</b></span><span class="chip">指令<b>${DATA.plan.length}</b></span>`;
  document.getElementById("cost").textContent = `坐标：第几行从上往下数（1–5），第几列从猫所在的那一列数起（0–6）。上层先被拆，下层后被拆。共 $${DATA.spent} / $200。`;
  const rows = DATA.plan.slice().sort((a,b)=>(fireTurn[`${a[0]},${a[1]},${a[2]}`]?.[0]??99)-(fireTurn[`${b[0]},${b[1]},${b[2]}`]?.[0]??99));
  document.getElementById("cmds").innerHTML = rows.map(([r,c,f,cmd])=>{
    const kind = DATA.board[r][c], ft = fireTurn[`${r},${c},${f}`];
    return `<tr data-turn="${ft?ft[0]:0}"><td>${r+1}行${c}列 ${KINDN[kind]} · ${kind==="P"?"唯一层":f===0?"上层":"下层"}</td><td><b>${ICON[cmd]}</b> ${cmd==="stomp"?"Stomp":NAME[cmd].slice(1)}</td><td>${ft?`${CATN[ft[1]]} · 第${ft[0]}回合`:"未触发"}</td></tr>`;
  }).join("");
  document.getElementById("legend").innerHTML = [
    ["--high","高楼：每层 +500"],["--low","低楼：每层 +250"],["--plant","发电厂：power ×2"],["--grass","草地"],["--mud","泥地：卡 1 回合"],["--spike","尖刺：power 减半"],["--rock","巨石：反弹"],["--badge","蓝色圆标：挂在这一层的指令（↑↓←→ 转向，踩 = Stomp）"]
  ].map(([v,t])=>`<span><i class="sw" style="background:var(${v})"></i>${t}</span>`).join("") + `<span>半透明楼层：到这一回合为止已被拆掉</span>`;
  drawStatic(); render(0);
}
let timer=null;
const go = t => render(Math.max(0,Math.min(15,t)));
document.getElementById("turn").addEventListener("input",e=>go(+e.target.value));
document.getElementById("prev").onclick=()=>go(+document.getElementById("turn").value-1);
document.getElementById("next").onclick=()=>go(+document.getElementById("turn").value+1);
document.getElementById("first").onclick=()=>go(0);
document.getElementById("play").onclick=()=>{
  const b=document.getElementById("play");
  if(timer){clearInterval(timer);timer=null;b.textContent="▶ 播放";return;}
  let t=+document.getElementById("turn").value; if(t>=15)t=0; go(t); b.textContent="⏸ 暂停";
  timer=setInterval(()=>{t++; go(t); if(t>=15){clearInterval(timer);timer=null;b.textContent="▶ 播放";}},700);
};
init();
</script>
