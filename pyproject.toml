[project]
name = "trellis-cards"
version = "0.1.0"
description = "Skeleton-constrained knowledge cards: one YAML mind map, Obsidian vault as source of truth, Anki .apkg as build output."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "genanki>=0.13",
    "Markdown>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# `trellis clip` only: article extraction straight to markdown
clip = ["trafilatura>=2.0"]
# `trellis ingest` of a pdf only; epub and markdown need nothing extra
ingest = ["pymupdf>=1.24"]
# vault/interviews/core/debrief/: transcribe an interview recording locally and grade it.
# mlx-whisper is Apple-Silicon native; faster-whisper (CTranslate2) is the fallback elsewhere.
# language-tool-python downloads LanguageTool (needs Java) on first use.
debrief = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "language-tool-python>=2.8",
]

[project.scripts]
trellis = "trellis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trellis*"]

[tool.setuptools.package-data]
trellis = ["workbench.html"]

[tool.pytest.ini_options]
# Only the trellis package tests. The interview kits under vault/interviews/companies/*
# carry their own pytest.ini and are run from inside each company folder.
testpaths = ["tests"]
